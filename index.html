<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover">

<title>Ачинск — 3D</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87b5d1;
    touch-action: none;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#interface {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#title {
    position: absolute;
    top: 15px;
    left: 18px;

    color: white;

    font-size: 22px;
    font-weight: 900;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}

#subtitle {
    position: absolute;
    top: 45px;
    left: 18px;

    color: white;

    font-size: 12px;

    opacity: .9;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}


/* =========================
   УПРАВЛЕНИЕ
========================= */

#movement {
    position: absolute;

    left:
        max(18px,
        env(safe-area-inset-left));

    bottom:
        max(18px,
        env(safe-area-inset-bottom));

    width: 190px;
    height: 150px;

    pointer-events: auto;
}

.control {
    position: absolute;

    width: 60px;
    height: 60px;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 25px;
    font-weight: bold;

    background:
        rgba(15,20,28,.78);

    border:
        1px solid
        rgba(255,255,255,.3);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.35);

    user-select: none;

    pointer-events: auto;
}

.control:active {
    transform: scale(.92);
    background:
        rgba(40,70,95,.9);
}


/* ВПЕРЕД */

#forward {
    left: 65px;
    top: 0;
}


/* НАЗАД */

#back {
    left: 65px;
    bottom: 0;
}


/* ВЛЕВО */

#left {
    left: 0;
    top: 45px;
}


/* ВПРАВО */

#right {
    right: 0;
    top: 45px;
}


/* =========================
   КАМЕРА
========================= */

#cameraZone {

    position: absolute;

    right:
        max(20px,
        env(safe-area-inset-right));

    bottom:
        max(20px,
        env(safe-area-inset-bottom));

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.10);

    border:
        1px solid
        rgba(255,255,255,.18);

    pointer-events: auto;

    color:
        rgba(255,255,255,.55);

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 11px;
}

@media (orientation: portrait) {

    #subtitle::after {

        content:
            " • ПОВЕРНИТЕ ТЕЛЕФОН";

        color:
            #ffe08a;
    }

}

</style>
</head>


<body>


<div id="interface">

    <div id="title">
        АЧИНСК
    </div>

    <div id="subtitle">
        3D • первая городская версия
    </div>


    <div id="movement">

        <div
            class="control"
            id="forward">
            ▲
        </div>

        <div
            class="control"
            id="left">
            ◀
        </div>

        <div
            class="control"
            id="right">
            ▶
        </div>

        <div
            class="control"
            id="back">
            ▼
        </div>

    </div>


    <div id="cameraZone">

        СВАЙП<br>
        КАМЕРОЙ

    </div>

</div>


<script type="module">

import * as THREE
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================
   СЦЕНА
===================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87b5d1
    );


scene.fog =
    new THREE.Fog(
        0x87b5d1,
        120,
        700
    );


/* =====================================
   КАМЕРА
===================================== */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1200
    );


camera.position.set(
    0,
    5,
    10
);


/* =====================================
   РЕНДЕР
===================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =====================================
   СВЕТ
===================================== */

const skyLight =
    new THREE.HemisphereLight(
        0xbfdfff,
        0x435a38,
        2
    );


scene.add(
    skyLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );


sun.position.set(
    120,
    180,
    80
);


sun.castShadow =
    true;


sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;


sun.shadow.camera.left =
    -250;

sun.shadow.camera.right =
    250;

sun.shadow.camera.top =
    250;

sun.shadow.camera.bottom =
    -250;


scene.add(
    sun
);


/* =====================================
   ЗЕМЛЯ
===================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            2000,
            2000
        ),

        new THREE.MeshStandardMaterial({
            color:
                0x537d48
        })
    );


ground.rotation.x =
    -Math.PI / 2;


ground.receiveShadow =
    true;


scene.add(
    ground
);


/* =====================================
   ДОРОГИ
===================================== */

function createRoad(
    x,
    z,
    width,
    length,
    rotation = 0
) {

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .08,
                length
            ),

            new THREE.MeshStandardMaterial({
                color:
                    0x333638
            })
        );


    road.position.set(
        x,
        .04,
        z
    );


    road.rotation.y =
        rotation;


    road.receiveShadow =
        true;


    scene.add(
        road
    );


    /* разметка */

    for (
        let i = -length / 2;
        i < length / 2;
        i += 12
    ) {

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .25,
                    .09,
                    5
                ),

                new THREE.MeshStandardMaterial({
                    color:
                        0xe5d9a0
                })
            );


        line.position.set(
            x,
            .1,
            z + i
        );


        line.rotation.y =
            rotation;


        scene.add(
            line
        );
    }
}


createRoad(
    0,
    0,
    45,
    1200
);


createRoad(
    0,
    0,
    45,
    1200,
    Math.PI / 2
);


createRoad(
    -180,
    0,
    28,
    900
);


createRoad(
    180,
    0,
    28,
    900
);


/* =====================================
   ЗДАНИЯ
===================================== */

function createBuilding(
    x,
    z,
    width,
    height,
    depth
) {

    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        Math.random() * .18 +
                        .58,
                        Math.random() * .15 +
                        .55,
                        Math.random() * .12 +
                        .48
                    )
            })
        );


    building.position.set(
        x,
        height / 2,
        z
    );


    building.castShadow =
        true;

    building.receiveShadow =
        true;


    scene.add(
        building
    );


    /* крыша */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width + 1,
                .6,
                depth + 1
            ),

            new THREE.MeshStandardMaterial({
                color:
                    0x4c5052
            })
        );


    roof.position.set(
        x,
        height + .3,
        z
    );


    roof.castShadow =
        true;


    scene.add(
        roof
    );
}


/* городская сетка */

for (
    let x = -450;
    x <= 450;
    x += 90
) {

    for (
        let z = -450;
        z <= 450;
        z += 90
    ) {

        if (
            Math.abs(x) < 65 ||
            Math.abs(z) < 65
        ) {
            continue;
        }


        createBuilding(

            x +
            (Math.random() - .5) * 20,

            z +
            (Math.random() - .5) * 20,

            55 +
            Math.random() * 25,

            15 +
            Math.random() * 35,

            45 +
            Math.random() * 25

        );
    }
}


/* =====================================
   ДЕРЕВЬЯ
===================================== */

function createTree(
    x,
    z
) {

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .7,
                1,
                7,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:
                    0x69452b
            })
        );


    trunk.position.set(
        x,
        3.5,
        z
    );


    trunk.castShadow =
        true;


    scene.add(
        trunk
    );


    const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                5,
                12,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:
                    0x28623a
            })
        );


    crown.position.set(
        x,
        9,
        z
    );


    crown.castShadow =
        true;


    scene.add(
        crown
    );
}


for (
    let i = 0;
    i < 100;
    i++
) {

    const x =
        (Math.random() - .5) *
        1100;

    const z =
        (Math.random() - .5) *
        1100;


    if (
        Math.abs(x) < 45 &&
        Math.abs(z) < 45
    ) {
        continue;
    }


    createTree(
        x,
        z
    );
}


/* =====================================
   ПЕРСОНАЖ
===================================== */

const player =
    new THREE.Group();


scene.add(
    player
);


/* тело */

const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .7,
            1.8,
            5,
            10
        ),

        new THREE.MeshStandardMaterial({
            color:
                0x24517b
        })
    );


body.position.y =
    1.7;


body.castShadow =
    true;


player.add(
    body
);


/* голова */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .55,
            16,
            16
        ),

        new THREE.MeshStandardMaterial({
            color:
                0xe1b18b
        })
    );


head.position.y =
    3.25;


head.castShadow =
    true;


player.add(
    head
);


/* волосы */

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .57,
            16,
            8,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        ),

        new THREE.MeshStandardMaterial({
            color:
                0x241d19
        })
    );


hair.position.y =
    3.5;


player.add(
    hair
);


/* =====================================
   УПРАВЛЕНИЕ
===================================== */

const keys = {

    forward: false,
    back: false,
    left: false,
    right: false
};


function bindButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[key] =
                true;
        }
    );


    const release =
        () => {

            keys[key] =
                false;
        };


    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}


/* правильное направление */

bindButton(
    "forward",
    "forward"
);

bindButton(
    "back",
    "back"
);

bindButton(
    "left",
    "left"
);

bindButton(
    "right",
    "right"
);


/* =====================================
   КЛАВИАТУРА
===================================== */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "w" ||
            event.key === "ArrowUp"
        )
            keys.forward = true;


        if (
            event.key === "s" ||
            event.key === "ArrowDown"
        )
            keys.back = true;


        if (
            event.key === "a" ||
            event.key === "ArrowLeft"
        )
            keys.left = true;


        if (
            event.key === "d" ||
            event.key === "ArrowRight"
        )
            keys.right = true;
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "w" ||
            event.key === "ArrowUp"
        )
            keys.forward = false;


        if (
            event.key === "s" ||
            event.key === "ArrowDown"
        )
            keys.back = false;


        if (
            event.key === "a" ||
            event.key === "ArrowLeft"
        )
            keys.left = false;


        if (
            event.key === "d" ||
            event.key === "ArrowRight"
        )
            keys.right = false;
    }
);


/* =====================================
   КАМЕРА
===================================== */

let cameraYaw = 0;

let cameraPitch = .45;

let cameraDistance = 10;


const cameraZone =
    document.getElementById(
        "cameraZone"
    );


let dragging =
    false;

let lastX =
    0;

let lastY =
    0;


cameraZone.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        dragging =
            true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        cameraZone.setPointerCapture(
            event.pointerId
        );
    }
);


cameraZone.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        const dx =
            event.clientX -
            lastX;


        const dy =
            event.clientY -
            lastY;


        cameraYaw -=
            dx * .008;


        cameraPitch +=
            dy * .006;


        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                .15,
                1.1
            );


        lastX =
            event.clientX;

        lastY =
            event.clientY;
    }
);


cameraZone.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;
    }
);


cameraZone.addEventListener(
    "pointercancel",
    () => {

        dragging =
            false;
    }
);


/* =====================================
   ИГРОВОЙ ЦИКЛ
===================================== */

const clock =
    new THREE.Clock();


function update() {

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    let forward =
        (keys.forward ? 1 : 0) -
        (keys.back ? 1 : 0);


    let side =
        (keys.right ? 1 : 0) -
        (keys.left ? 1 : 0);


    const length =
        Math.hypot(
            forward,
            side
        );


    if (length > 0) {

        forward /=
            length;

        side /=
            length;


        const speed =
            22 * delta;


        const angle =
            cameraYaw;


        const dirX =
            Math.sin(angle) *
            forward;


        const dirZ =
            Math.cos(angle) *
            forward;


        const sideX =
            Math.cos(angle) *
            side;


        const sideZ =
            -Math.sin(angle) *
            side;


        player.position.x +=
            (dirX + sideX) *
            speed;


        player.position.z +=
            (dirZ + sideZ) *
            speed;


        player.rotation.y =
            Math.atan2(
                dirX + sideX,
                dirZ + sideZ
            );
    }


    /* камера */

    const horizontal =
        Math.cos(
            cameraPitch
        ) *
        cameraDistance;


    const vertical =
        Math.sin(
            cameraPitch
        ) *
        cameraDistance;


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 2,
            player.position.z
        );


    const cameraPosition =
        new THREE.Vector3(

            player.position.x -
            Math.sin(cameraYaw) *
            horizontal,

            player.position.y +
            vertical,

            player.position.z -
            Math.cos(cameraYaw) *
            horizontal
        );


    camera.position.lerp(
        cameraPosition,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =====================================
   RENDER
===================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
