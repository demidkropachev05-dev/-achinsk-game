<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#landscapeHint{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    padding:14px 20px;
    border-radius:14px;
    background:rgba(0,0,0,.78);
    color:white;
    font-size:15px;
    text-align:center;
    display:none;
    pointer-events:none;
}

#joystick{
    position:fixed;
    left:max(22px,env(safe-area-inset-left));
    bottom:max(22px,env(safe-area-inset-bottom));
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18);
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.35),
        0 5px 20px rgba(0,0,0,.25);
    z-index:10;
    touch-action:none;
}

#joystick::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:4px;
    margin:-2px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:66px;
    height:66px;
    margin-left:-33px;
    margin-top:-33px;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:
        inset 0 4px 12px rgba(255,255,255,.08),
        0 4px 15px rgba(0,0,0,.3);
    pointer-events:none;
}

#jump{
    position:fixed;
    right:max(25px,env(safe-area-inset-right));
    bottom:max(28px,env(safe-area-inset-bottom));
    width:78px;
    height:78px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.12);
    color:white;
    font-size:28px;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

#jump:active{
    transform:scale(.92);
    background:rgba(255,255,255,.22);
}

#speedButton{
    position:fixed;
    right:max(115px,calc(env(safe-area-inset-right) + 90px));
    bottom:max(40px,calc(env(safe-area-inset-bottom) + 12px));
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.09);
    color:white;
    font-size:12px;
    font-weight:bold;
    z-index:10;
}

#speedButton.active{
    background:rgba(255,190,70,.3);
    border-color:rgba(255,210,100,.6);
}

#topInfo{
    position:fixed;
    left:50%;
    top:max(10px,env(safe-area-inset-top));
    transform:translateX(-50%);
    z-index:8;
    color:rgba(255,255,255,.8);
    font-size:12px;
    padding:7px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(8px);
    pointer-events:none;
}

@media (orientation:portrait){
    #landscapeHint{
        display:block;
    }
}

@media (max-width:700px){
    #joystick{
        width:138px;
        height:138px;
    }

    #stick{
        width:62px;
        height:62px;
        margin-left:-31px;
        margin-top:-31px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="topInfo">АЧИНСК 3D</div>

<div id="landscapeHint">
    📱 Поверните телефон горизонтально
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="speedButton">RUN</button>

<button id="jump">↑</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   НАСТРОЙКИ
========================================================= */

const CITY_SIZE = 1100;

const PLAYER_SPEED = 18;
const RUN_MULTIPLIER = 1.45;

const GRAVITY = -42;
const JUMP_POWER = 15;

const PLAYER_RADIUS = 1.7;

const ROAD_WIDTH = 28;


/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8194a5);

scene.fog = new THREE.FogExp2(
    0x8194a5,
    0.0017
);


const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1800
);

camera.position.set(
    0,
    7,
    12
);


const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.05;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   СВЕТ
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbfd6e8,
    0x3c332b,
    2.0
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffd4a0,
    3.0
);

sun.position.set(
    -250,
    350,
    180
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -450;
sun.shadow.camera.right = 450;
sun.shadow.camera.top = 450;
sun.shadow.camera.bottom = -450;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;

scene.add(sun);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const groundMat =
    new THREE.MeshStandardMaterial({
        color:0x555b58,
        roughness:1
    });


const roadMat =
    new THREE.MeshStandardMaterial({
        color:0x24272a,
        roughness:.96
    });


const sidewalkMat =
    new THREE.MeshStandardMaterial({
        color:0x777979,
        roughness:.95
    });


const curbMat =
    new THREE.MeshStandardMaterial({
        color:0x8c8c88,
        roughness:.9
    });


const whiteMat =
    new THREE.MeshStandardMaterial({
        color:0xdad9d1,
        roughness:.8
    });


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(
        CITY_SIZE,
        CITY_SIZE
    ),
    groundMat
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   COLLIDERS
========================================================= */

const colliders = [];


function addCollider(
    x,
    z,
    width,
    depth
){
    colliders.push({
        minX:x-width/2,
        maxX:x+width/2,
        minZ:z-depth/2,
        maxZ:z+depth/2
    });
}


/* =========================================================
   ДОРОГИ
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            .08,
            depth
        ),
        roadMat
    );

    road.position.set(
        x,
        .04,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    const sidewalkSize = 3;


    if(width > depth){

        const s1 = new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .14,
                sidewalkSize
            ),
            sidewalkMat
        );

        s1.position.set(
            x,
            .07,
            z-depth/2-sidewalkSize/2
        );

        scene.add(s1);


        const s2 = s1.clone();

        s2.position.z =
            z+depth/2+sidewalkSize/2;

        scene.add(s2);

    }else{

        const s1 = new THREE.Mesh(
            new THREE.BoxGeometry(
                sidewalkSize,
                .14,
                depth
            ),
            sidewalkMat
        );

        s1.position.set(
            x-width/2-sidewalkSize/2,
            .07,
            z
        );

        scene.add(s1);


        const s2 = s1.clone();

        s2.position.x =
            x+width/2+sidewalkSize/2;

        scene.add(s2);
    }
}


/* Главные дороги */

createRoad(
    0,
    0,
    CITY_SIZE,
    ROAD_WIDTH
);

createRoad(
    0,
    190,
    CITY_SIZE,
    ROAD_WIDTH
);

createRoad(
    0,
    -190,
    CITY_SIZE,
    ROAD_WIDTH
);

createRoad(
    0,
    0,
    ROAD_WIDTH,
    CITY_SIZE
);

createRoad(
    190,
    0,
    ROAD_WIDTH,
    CITY_SIZE
);

createRoad(
    -190,
    0,
    ROAD_WIDTH,
    CITY_SIZE
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function createRoadMarksHorizontal(z){

    for(
        let x=-CITY_SIZE/2;
        x<CITY_SIZE/2;
        x+=22
    ){

        const mark = new THREE.Mesh(
            new THREE.BoxGeometry(
                10,
                .035,
                .32
            ),
            whiteMat
        );

        mark.position.set(
            x,
            .095,
            z
        );

        scene.add(mark);
    }
}


function createRoadMarksVertical(x){

    for(
        let z=-CITY_SIZE/2;
        z<CITY_SIZE/2;
        z+=22
    ){

        const mark = new THREE.Mesh(
            new THREE.BoxGeometry(
                .32,
                .035,
                10
            ),
            whiteMat
        );

        mark.position.set(
            x,
            .095,
            z
        );

        scene.add(mark);
    }
}


createRoadMarksHorizontal(0);
createRoadMarksHorizontal(190);
createRoadMarksHorizontal(-190);

createRoadMarksVertical(0);
createRoadMarksVertical(190);
createRoadMarksVertical(-190);


/* =========================================================
   ЗДАНИЯ
========================================================= */

const buildingColors = [
    0x9a9286,
    0x777d82,
    0xa69b8e,
    0x73777a,
    0xb1a89c,
    0x696e72,
    0x8c8177
];


function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    color
){

    const group = new THREE.Group();

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color,
            roughness:.88,
            metalness:.03
        });


    const body = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        bodyMat
    );

    body.position.y =
        height/2;

    body.castShadow = true;
    body.receiveShadow = true;

    group.add(body);


    /* крыша */

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.35,
            .35,
            depth+.35
        ),
        new THREE.MeshStandardMaterial({
            color:0x424448,
            roughness:.9
        })
    );

    roof.position.y =
        height+.15;

    roof.castShadow = true;

    group.add(roof);


    /* окна */

    const windowMat =
        new THREE.MeshStandardMaterial({
            color:0x9eb7c5,
            roughness:.25,
            metalness:.15,
            emissive:0x17242a,
            emissiveIntensity:.25
        });


    const floors =
        Math.max(
            1,
            Math.floor(height/4)
        );

    const colsX =
        Math.max(
            1,
            Math.floor(width/4)
        );

    const colsZ =
        Math.max(
            1,
            Math.floor(depth/4)
        );


    /* фасад X */

    for(
        let f=0;
        f<floors;
        f++
    ){

        for(
            let c=0;
            c<colsX;
            c++
        ){

            const w = new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.35,
                    1.7,
                    .06
                ),
                windowMat
            );

            const px =
                -width/2+
                2+
                c*4;

            const py =
                2.2+
                f*4;

            w.position.set(
                px,
                py,
                depth/2+.035
            );

            group.add(w);


            const w2 = w.clone();

            w2.position.z =
                -depth/2-.035;

            group.add(w2);
        }
    }


    /* боковые окна */

    for(
        let f=0;
        f<floors;
        f++
    ){

        for(
            let c=0;
            c<colsZ;
            c++
        ){

            const w = new THREE.Mesh(
                new THREE.BoxGeometry(
                    .06,
                    1.7,
                    1.35
                ),
                windowMat
            );

            const pz =
                -depth/2+
                2+
                c*4;

            const py =
                2.2+
                f*4;

            w.position.set(
                width/2+.035,
                py,
                pz
            );

            group.add(w);


            const w2 = w.clone();

            w2.position.x =
                -width/2-.035;

            group.add(w2);
        }
    }


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);


    addCollider(
        x,
        z,
        width,
        depth
    );
}


/* =========================================================
   РАСКЛАДКА ГОРОДА
========================================================= */

function insideRoad(
    x,
    z
){

    const roadHalf =
        ROAD_WIDTH/2 + 8;

    return (
        Math.abs(z) < roadHalf ||
        Math.abs(z-190) < roadHalf ||
        Math.abs(z+190) < roadHalf ||
        Math.abs(x) < roadHalf ||
        Math.abs(x-190) < roadHalf ||
        Math.abs(x+190) < roadHalf
    );
}


let buildingCount = 0;


for(
    let x=-500;
    x<=500;
    x+=52
){

    for(
        let z=-500;
        z<=500;
        z+=52
    ){

        if(
            insideRoad(x,z)
        ){
            continue;
        }


        const offsetX =
            (Math.random()-.5)*14;

        const offsetZ =
            (Math.random()-.5)*14;


        const width =
            28+
            Math.random()*15;

        const depth =
            27+
            Math.random()*15;

        const height =
            10+
            Math.random()*34;


        createBuilding(
            x+offsetX,
            z+offsetZ,
            width,
            depth,
            height,
            buildingColors[
                Math.floor(
                    Math.random()*
                    buildingColors.length
                )
            ]
        );


        buildingCount++;


        if(
            buildingCount>=95
        ){
            break;
        }
    }


    if(
        buildingCount>=95
    ){
        break;
    }
}


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

function createTree(x,z){

    const group =
        new THREE.Group();


    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .45,
            .65,
            4,
            7
        ),
        new THREE.MeshStandardMaterial({
            color:0x514033,
            roughness:1
        })
    );

    trunk.position.y=2;

    trunk.castShadow=true;

    group.add(trunk);


    const crownMat =
        new THREE.MeshStandardMaterial({
            color:0x304c31,
            roughness:1
        });


    const crown1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.7,
                8,
                6
            ),
            crownMat
        );

    crown1.position.y=5;

    crown1.castShadow=true;

    group.add(crown1);


    const crown2 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.1,
                8,
                6
            ),
            crownMat
        );

    crown2.position.set(
        1.2,
        6,
        .3
    );

    crown2.castShadow=true;

    group.add(crown2);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


let trees=0;


for(
    let i=0;
    i<140;
    i++
){

    const x =
        -500+
        Math.random()*1000;

    const z =
        -500+
        Math.random()*1000;


    if(
        insideRoad(x,z)
    ){
        continue;
    }


    createTree(x,z);

    trees++;
}


/* =========================================================
   ФОНАРИ
========================================================= */

function createLamp(x,z){

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .09,
                .13,
                6,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x25282a,
                roughness:.75,
                metalness:.5
            })
        );

    pole.position.y=3;

    pole.castShadow=true;


    const lightMat =
        new THREE.MeshStandardMaterial({
            color:0xffd99a,
            emissive:0xffa83d,
            emissiveIntensity:1.8
        });


    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .22,
                8,
                8
            ),
            lightMat
        );

    lamp.position.y=6;


    const group =
        new THREE.Group();

    group.add(
        pole,
        lamp
    );

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);
}


for(
    let x=-480;
    x<=480;
    x+=60
){

    createLamp(
        x,
        10
    );

    createLamp(
        x,
        200
    );

    createLamp(
        x,
        -200
    );
}


for(
    let z=-480;
    z<=480;
    z+=60
){

    createLamp(
        10,
        z
    );

    createLamp(
        200,
        z
    );

    createLamp(
        -200,
        z
    );
}


/* =========================================================
   МАШИНЫ
========================================================= */

function createCar(
    x,
    z,
    rotation
){

    const group =
        new THREE.Group();


    const colors=[
        0x202326,
        0x4b5055,
        0x7b2522,
        0x263d54,
        0xaaa59b,
        0x343434
    ];


    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:
                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ],
            roughness:.5,
            metalness:.25
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.2,
                1.05,
                1.8
            ),
            bodyMat
        );

    body.position.y=.75;

    body.castShadow=true;

    group.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .85,
                1.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x252d32,
                roughness:.2,
                metalness:.1
            })
        );

    cabin.position.y=1.55;

    cabin.castShadow=true;

    group.add(cabin);


    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:.9
        });


    for(
        const wx of [-1.45,1.45]
    ){

        for(
            const wz of [-.9,.9]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .43,
                        .43,
                        .28,
                        12
                    ),
                    wheelMat
                );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                wx,
                .45,
                wz
            );

            group.add(wheel);
        }
    }


    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;

    scene.add(group);
}


for(
    let i=0;
    i<26;
    i++
){

    const horizontal =
        i%2===0;


    const road =
        [-190,0,190][
            i%3
        ];


    if(horizontal){

        createCar(
            -450+
            (i*67)%850,
            road+
            (i%2?4:-4),
            0
        );

    }else{

        createCar(
            road+
            (i%2?4:-4),
            -450+
            (i*73)%850,
            Math.PI/2
        );
    }
}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

const player =
    new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    40
);


let playerModel=null;


const loader =
    new GLTFLoader();


loader.load(
    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    gltf=>{

        playerModel =
            gltf.scene;

        playerModel.scale.set(
            1.9,
            1.9,
            1.9
        );

        playerModel.position.y=0;

        playerModel.traverse(
            obj=>{

                if(
                    obj.isMesh
                ){

                    obj.castShadow=true;
                    obj.receiveShadow=true;
                }
            }
        );

        player.add(
            playerModel
        );
    },

    undefined,

    ()=>{
        createFallbackPlayer();
    }
);


function createFallbackPlayer(){

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x3b4650,
            roughness:.8
        });


    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .55,
                1.2,
                5,
                10
            ),
            mat
        );

    body.position.y=1.35;

    body.castShadow=true;

    player.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .43,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xb77e62,
                roughness:.8
            })
        );

    head.position.y=2.45;

    head.castShadow=true;

    player.add(head);
}


/* =========================================================
   ФИЗИКА
========================================================= */

let velocityY=0;
let grounded=true;


function collidesAt(
    x,
    z
){

    for(
        const c of colliders
    ){

        if(
            x >
            c.minX-PLAYER_RADIUS &&
            x <
            c.maxX+PLAYER_RADIUS &&
            z >
            c.minZ-PLAYER_RADIUS &&
            z <
            c.maxZ+PLAYER_RADIUS
        ){

            return true;
        }
    }

    return false;
}


function movePlayer(
    dx,
    dz
){

    const nextX =
        player.position.x+
        dx;

    const nextZ =
        player.position.z+
        dz;


    /* отдельная проверка X
       позволяет скользить вдоль стены */

    if(
        !collidesAt(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;
    }


    /* отдельная проверка Z */

    if(
        !collidesAt(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;
    }


    const limit =
        CITY_SIZE/2-15;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -limit,
            limit
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -limit,
            limit
        );
}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickActive=false;

let joystickX=0;
let joystickY=0;

let joystickPointerId=null;


const JOYSTICK_RADIUS=54;


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;


    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(
        distance>JOYSTICK_RADIUS
    ){

        const scale =
            JOYSTICK_RADIUS/
            distance;

        dx*=scale;
        dy*=scale;
    }


    joystickX =
        dx/JOYSTICK_RADIUS;

    joystickY =
        dy/JOYSTICK_RADIUS;


    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickActive=false;

    joystickPointerId=null;

    joystickX=0;
    joystickY=0;

    stick.style.transform =
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joystickActive=true;

        joystickPointerId=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            !joystickActive ||
            e.pointerId!==joystickPointerId
        ){
            return;
        }

        e.preventDefault();

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointerup",
    e=>{

        if(
            e.pointerId===
            joystickPointerId
        ){

            resetJoystick();
        }
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   RUN
========================================================= */

const speedButton =
    document.getElementById(
        "speedButton"
    );


let running=false;


speedButton.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        running=true;

        speedButton.classList.add(
            "active"
        );
    }
);


function stopRun(){

    running=false;

    speedButton.classList.remove(
        "active"
    );
}


speedButton.addEventListener(
    "pointerup",
    stopRun
);

speedButton.addEventListener(
    "pointercancel",
    stopRun
);

speedButton.addEventListener(
    "pointerleave",
    stopRun
);


/* =========================================================
   ПРЫЖОК
========================================================= */

const jump =
    document.getElementById(
        "jump"
    );


function doJump(){

    if(
        grounded
    ){

        velocityY=
            JUMP_POWER;

        grounded=false;
    }
}


jump.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        doJump();
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let cameraYaw=0;
let cameraPitch=.28;

let cameraDistance=9;

let cameraTouchId=null;

let lastTouchX=0;
let lastTouchY=0;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        /* Если нажали на джойстик,
           прыжок или RUN —
           камера не должна двигаться */

        if(
            e.target===joystick ||
            e.target===stick ||
            e.target===jump ||
            e.target===speedButton
        ){
            return;
        }


        cameraTouchId=
            e.pointerId;

        lastTouchX=
            e.clientX;

        lastTouchY=
            e.clientY;


        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId!==cameraTouchId
        ){
            return;
        }


        const dx =
            e.clientX-lastTouchX;

        const dy =
            e.clientY-lastTouchY;


        lastTouchX=
            e.clientX;

        lastTouchY=
            e.clientY;


        cameraYaw -=
            dx*.006;

        cameraPitch -=
            dy*.004;


        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                -0.25,
                .85
            );
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    e=>{

        if(
            e.pointerId===
            cameraTouchId
        ){

            cameraTouchId=null;
        }
    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    e=>{

        if(
            e.pointerId===
            cameraTouchId
        ){

            cameraTouchId=null;
        }
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;

        if(
            e.code==="Space"
        ){
            doJump();
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =========================================================
   ДВИЖЕНИЕ
========================================================= */

const clock =
    new THREE.Clock();


function updatePlayer(
    delta
){

    let forward =
        -joystickY;

    let side =
        joystickX;


    /* клавиатура */

    if(
        keys["KeyW"] ||
        keys["ArrowUp"]
    ){
        forward=1;
    }

    if(
        keys["KeyS"] ||
        keys["ArrowDown"]
    ){
        forward=-1;
    }

    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ){
        side=-1;
    }

    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ){
        side=1;
    }


    const length =
        Math.sqrt(
            forward*forward+
            side*side
        );


    if(
        length>1
    ){

        forward/=length;
        side/=length;
    }


    const speed =
        PLAYER_SPEED*
        (running?
            RUN_MULTIPLIER:
            1);


    /* =====================================================
       ВАЖНО:
       Здесь исправлена главная ошибка управления.

       forward = направление ВПЕРЁД
       side    = направление ВПРАВО

       yaw камеры определяет,
       куда именно смотрит персонаж.
    ===================================================== */


    const sin =
        Math.sin(cameraYaw);

    const cos =
        Math.cos(cameraYaw);


    const moveX =
        sin*forward+
        cos*side;


    const moveZ =
        cos*forward-
        sin*side;


    if(
        length>.05
    ){

        movePlayer(
            moveX*
            speed*
            delta,

            moveZ*
            speed*
            delta
        );


        /* персонаж поворачивается
           в сторону движения */

        const targetRotation =
            Math.atan2(
                moveX,
                moveZ
            );


        if(
            playerModel
        ){

            const current =
                playerModel.rotation.y;


            let difference =
                targetRotation-
                current;


            while(
                difference>Math.PI
            ){
                difference-=Math.PI*2;
            }

            while(
                difference<-Math.PI
            ){
                difference+=Math.PI*2;
            }


            playerModel.rotation.y +=
                difference*
                Math.min(
                    1,
                    delta*10
                );
        }
    }


    /* =====================================================
       ГРАВИТАЦИЯ
    ===================================================== */

    velocityY +=
        GRAVITY*
        delta;


    player.position.y +=
        velocityY*
        delta;


    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }
}


/* =========================================================
   КАМЕРА FOLLOW
========================================================= */

function updateCamera(){

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+2.2,
            player.position.z
        );


    const horizontal =
        Math.cos(cameraPitch)*
        cameraDistance;

    const vertical =
        Math.sin(cameraPitch)*
        cameraDistance;


    const offsetX =
        Math.sin(cameraYaw)*
        horizontal;

    const offsetZ =
        Math.cos(cameraYaw)*
        horizontal;


    const desired =
        new THREE.Vector3(
            target.x+
            offsetX,

            target.y+
            vertical,

            target.z+
            offsetZ
        );


    camera.position.lerp(
        desired,
        .13
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    camera.aspect =
        width/height;

    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );
}


window.addEventListener(
    "resize",
    resize
);

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            resize,
            200
        );
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(
        delta
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


resize();

animate();

</script>
