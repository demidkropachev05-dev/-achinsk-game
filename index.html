<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ачинск 3D</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}
body{
    touch-action:none;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
canvas{
    display:block;
    width:100%;
    height:100%;
}
#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#101010;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:20px;
    padding:30px;
}
@media (orientation:portrait){
    #rotate{
        display:flex;
    }
}
#hud{
    position:fixed;
    left:18px;
    top:15px;
    z-index:10;
    color:white;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}
#title{
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
}
#subtitle{
    margin-top:3px;
    font-size:11px;
    opacity:.65;
}
#fps{
    margin-top:7px;
    font-size:10px;
    opacity:.45;
}
#controls{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}
.joystick{
    position:absolute;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.075);
    border:2px solid rgba(255,255,255,.16);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.2),
        0 5px 20px rgba(0,0,0,.18);
    pointer-events:auto;
    touch-action:none;
}
#leftJoy{
    left:30px;
    bottom:28px;
}
#rightJoy{
    right:30px;
    bottom:28px;
}
.joyInner{
    position:absolute;
    width:62px;
    height:62px;
    left:50%;
    top:50%;
    margin-left:-31px;
    margin-top:-31px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,
        rgba(255,255,255,.28),
        rgba(255,255,255,.08) 45%,
        rgba(0,0,0,.18));
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 4px 12px rgba(0,0,0,.35);
}
#hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.45);
    font-size:10px;
    pointer-events:none;
}
#loading{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#111;
    color:white;
    transition:opacity .5s;
}
#loading h1{
    margin:0 0 10px;
    font-size:27px;
    letter-spacing:2px;
}
#loading p{
    margin:0;
    opacity:.55;
    font-size:12px;
}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">
    <h1>АЧИНСК 3D</h1>
    <p>Загрузка города...</p>
</div>
<div id="rotate">
    <div>
        <div style="font-size:45px;margin-bottom:15px">↔</div>
        Поверни смартфон горизонтально
    </div>
</div>
<div id="hud">
    <div id="title">АЧИНСК 3D</div>
    <div id="subtitle">OPEN WORLD • ПРОТОТИП</div>
    <div id="fps"></div>
</div>
<div id="controls">
    <div id="leftJoy" class="joystick">
        <div id="leftKnob" class="joyInner"></div>
    </div>
    <div id="rightJoy" class="joystick">
        <div id="rightKnob" class="joyInner"></div>
    </div>
    <div id="hint">ЛЕВЫЙ — ДВИЖЕНИЕ • ПРАВЫЙ — КАМЕРА</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ============================================================
   АЧИНСК 3D
   Первый реалистичный мобильный прототип
   Всё находится в одном index.html
============================================================ */
const THREE = window.THREE;
const game = document.getElementById("game");
const loading = document.getElementById("loading");
const fpsElement = document.getElementById("fps");
/* ============================================================
   SCENE
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91a0ad);
scene.fog = new THREE.Fog(
    0x91a0ad,
    90,
    330
);
/* ============================================================
   CAMERA
============================================================ */
const camera = new THREE.PerspectiveCamera(
    62,
    innerWidth / innerHeight,
    0.05,
    500
);
camera.position.set(0,5,9);
/* ============================================================
   RENDERER
============================================================ */
const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});
renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.65)
);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
game.appendChild(renderer.domElement);
/* ============================================================
   LIGHT
============================================================ */
const hemi = new THREE.HemisphereLight(
    0xc5d8e6,
    0x45433e,
    1.7
);
scene.add(hemi);
const sun = new THREE.DirectionalLight(
    0xffe7c2,
    3.0
);
sun.position.set(
    -80,
    130,
    70
);
sun.castShadow = true;
sun.shadow.mapSize.set(1536,1536);
sun.shadow.camera.left = -110;
sun.shadow.camera.right = 110;
sun.shadow.camera.top = 110;
sun.shadow.camera.bottom = -110;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.bias = -0.00025;
scene.add(sun);
/* ============================================================
   MATERIAL HELPERS
============================================================ */
function mat(color, rough=0.8, metal=0){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal
    });
}
const asphaltMat = mat(0x3d4142,.96);
const asphaltDarkMat = mat(0x303334,.98);
const concreteMat = mat(0x777877,.95);
const sidewalkMat = mat(0x888986,.9);
const grassMat = mat(0x4c5b43,1);
const whiteMat = mat(0xd6d4cc,.82);
const darkMat = mat(0x202326,.65);
const glassMat = new THREE.MeshStandardMaterial({
    color:0x354955,
    roughness:.22,
    metalness:.25,
    transparent:true,
    opacity:.82
});
const brickMat = mat(0x725b4d,.88);
const beigeMat = mat(0x857d70,.92);
const greyBuildingMat = mat(0x696b6a,.95);
const panelMat = mat(0x596066,.92);
const woodMat = mat(0x55443b,.9);
const treeTrunkMat = mat(0x4c3a2d,1);
const leafMats = [
    mat(0x354936,1),
    mat(0x40563c,1),
    mat(0x2f4532,1),
    mat(0x4d5d3e,1)
];
/* ============================================================
   BASIC GEOMETRY CACHE
============================================================ */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const cylGeo = new THREE.CylinderGeometry(1,1,1,10);
/* ============================================================
   WORLD
============================================================ */
const world = new THREE.Group();
scene.add(world);
/* ============================================================
   GROUND
============================================================ */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    grassMat
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);
/* ============================================================
   ROAD HELPERS
============================================================ */
function createRoad(x,z,w,d){
    const road = new THREE.Mesh(
        new THREE.BoxGeometry(w,.08,d),
        asphaltMat
    );
    road.position.set(x,.035,z);
    road.receiveShadow = true;
    world.add(road);
    /* дорожные края */
    const curb1 = new THREE.Mesh(
        new THREE.BoxGeometry(w,.17,.38),
        concreteMat
    );
    curb1.position.set(
        x,
        .11,
        z-d/2-.18
    );
    curb1.receiveShadow = true;
    world.add(curb1);
    const curb2 = curb1.clone();
    curb2.position.z = z+d/2+.18;
    world.add(curb2);
    return road;
}
function createVerticalRoad(x,z,w,d){
    return createRoad(x,z,w,d);
}
/* ============================================================
   CITY ROADS
============================================================ */
createRoad(0,0,20,340);
createRoad(-75,0,17,340);
createRoad(75,0,17,340);
createRoad(0,-75,340,18);
createRoad(0,75,340,18);
createRoad(0,-150,14,90);
createRoad(0,150,14,90);
createRoad(-145,0,14,80);
createRoad(145,0,14,80);
/* ============================================================
   ROAD MARKINGS
============================================================ */
function roadLine(x,y,z,w,d){
    const line = new THREE.Mesh(
        new THREE.BoxGeometry(w,.012,d),
        new THREE.MeshBasicMaterial({
            color:0xcfc9a8
        })
    );
    line.position.set(x,y,z);
    world.add(line);
}
for(let z=-160; z<160; z+=10){
    roadLine(0,.092,z,.28,5);
}
for(let x=-160; x<160; x+=10){
    roadLine(x,.092,0,5,.28);
}
/* ============================================================
   SIDEWALKS
============================================================ */
function sidewalk(x,z,w,d){
    const s = new THREE.Mesh(
        new THREE.BoxGeometry(w,.16,d),
        sidewalkMat
    );
    s.position.set(x,.13,z);
    s.receiveShadow = true;
    world.add(s);
}
sidewalk(-12,0,4,340);
sidewalk(12,0,4,340);
sidewalk(-75-10,0,4,340);
sidewalk(-75+10,0,4,340);
sidewalk(75-10,0,4,340);
sidewalk(75+10,0,4,340);
sidewalk(0,-75-10,340,4);
sidewalk(0,-75+10,340,4);
sidewalk(0,75-10,340,4);
sidewalk(0,75+10,340,4);
/* ============================================================
   BUILDING SYSTEM
============================================================ */
function createWindow(parent,x,y,z,w,h,depth=0.08){
    const frame = new THREE.Mesh(
        new THREE.BoxGeometry(w+.12,h+.12,depth),
        darkMat
    );
    frame.position.set(x,y,z);
    parent.add(frame);
    const glass = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,depth+.02),
        glassMat
    );
    glass.position.set(
        x,
        y,
        z-depth*.15
    );
    parent.add(glass);
    /* центральная рама */
    const vertical = new THREE.Mesh(
        new THREE.BoxGeometry(.045,h+.04,depth+.04),
        whiteMat
    );
    vertical.position.set(x,y,z-.05);
    parent.add(vertical);
    const horizontal = new THREE.Mesh(
        new THREE.BoxGeometry(w+.03,.045,depth+.04),
        whiteMat
    );
    horizontal.position.set(x,y,z-.05);
    parent.add(horizontal);
}
function createBalcony(parent,x,y,z,w,d){
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(w,.09,d),
        concreteMat
    );
    floor.position.set(x,y,z);
    parent.add(floor);
    const railMat = darkMat;
    for(let i=0;i<5;i++){
        const rail = new THREE.Mesh(
            new THREE.BoxGeometry(.035,.9,.035),
            railMat
        );
        rail.position.set(
            x-w/2+i*(w/4),
            y+.45,
            z-d/2
        );
        parent.add(rail);
    }
    const top = new THREE.Mesh(
        new THREE.BoxGeometry(w,.05,.05),
        railMat
    );
    top.position.set(
        x,
        y+.9,
        z-d/2
    );
    parent.add(top);
}
function createBuilding(x,z,w,d,h,type=0){
    const group = new THREE.Group();
    group.position.set(x,0,z);
    let buildingMaterial;
    if(type===0) buildingMaterial=beigeMat;
    if(type===1) buildingMaterial=brickMat;
    if(type===2) buildingMaterial=greyBuildingMat;
    if(type===3) buildingMaterial=panelMat;
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        buildingMaterial
    );
    body.position.y=h/2;
    body.castShadow=true;
    body.receiveShadow=true;
    group.add(body);
    /* roof */
    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.25,
            .22,
            d+.25
        ),
        darkMat
    );
    roof.position.y=h+.11;
    roof.castShadow=true;
    group.add(roof);
    /* окна */
    const rows = Math.max(1,Math.floor(h/3));
    const columnsFront = Math.max(
        2,
        Math.floor(w/3)
    );
    for(let r=0;r<rows;r++){
        const yy = 2.2+r*2.8;
        if(yy>h-1) continue;
        for(let c=0;c<columnsFront;c++){
            const xx =
                -w/2+
                1.5+
                c*((w-3)/(columnsFront-1));
            createWindow(
                group,
                xx,
                yy,
                -d/2-.045,
                1.25,
                1.45
            );
            if((c+r)%4===0 && h>9){
                createBalcony(
                    group,
                    xx,
                    yy-.85,
                    -d/2-.18,
                    1.7,
                    .75
                );
            }
        }
    }
    /* боковые окна */
    const sideRows=Math.max(
        1,
        Math.floor(d/4)
    );
    for(let r=0;r<sideRows;r++){
        const zz =
            -d/2+
            2+
            r*((d-4)/Math.max(1,sideRows-1));
        if(w>10){
            createWindow(
                group,
                w/2+.045,
                3,
                zz,
                .08,
                1.5
            );
        }
    }
    /* подъезд */
    const entrance = new THREE.Mesh(
        new THREE.BoxGeometry(2.5,3.1,.28),
        darkMat
    );
    entrance.position.set(
        0,
        1.55,
        -d/2-.16
    );
    group.add(entrance);
    const door = new THREE.Mesh(
        new THREE.BoxGeometry(1.65,2.5,.08),
        glassMat
    );
    door.position.set(
        0,
        1.35,
        -d/2-.34
    );
    group.add(door);
    /* козырёк */
    const canopy = new THREE.Mesh(
        new THREE.BoxGeometry(3.1,.16,1.1),
        darkMat
    );
    canopy.position.set(
        0,
        3.15,
        -d/2-.55
    );
    canopy.castShadow=true;
    group.add(canopy);
    /* кондиционеры */
    if(w>14){
        for(let i=0;i<3;i++){
            const ac = new THREE.Mesh(
                new THREE.BoxGeometry(.75,.48,.22),
                whiteMat
            );
            ac.position.set(
                -w/2+3+i*3,
                Math.min(h-1,6.5),
                -d/2-.16
            );
            group.add(ac);
        }
    }
    /* вентиляция на крыше */
    if(h>12){
        for(let i=0;i<3;i++){
            const vent = new THREE.Mesh(
                new THREE.BoxGeometry(.7,.8,.7),
                darkMat
            );
            vent.position.set(
                -w/4+i*(w/4),
                h+.5,
                0
            );
            group.add(vent);
        }
    }
    world.add(group);
    return group;
}
/* ============================================================
   CITY BUILDINGS
============================================================ */
createBuilding(-35,-35,34,28,18,1);
createBuilding(35,-35,28,25,24,3);
createBuilding(-35,35,30,25,12,0);
createBuilding(35,35,36,28,20,2);
createBuilding(-110,-35,34,28,22,3);
createBuilding(-110,35,28,25,14,1);
createBuilding(110,-35,34,28,18,0);
createBuilding(110,35,30,25,25,3);
createBuilding(-145,-65,28,30,12,1);
createBuilding(145,-65,35,30,17,2);
createBuilding(-145,65,32,28,20,3);
createBuilding(145,65,32,28,14,0);
createBuilding(-35,120,38,28,20,1);
createBuilding(35,120,32,25,16,3);
createBuilding(-35,-120,34,28,24,2);
createBuilding(35,-120,38,30,18,0);
/* ============================================================
   SMALL COMMERCIAL BUILDINGS
============================================================ */
function createShop(x,z){
    const group=new THREE.Group();
    const body=new THREE.Mesh(
        new THREE.BoxGeometry(18,5.5,12),
        mat(0x68645d,.9)
    );
    body.position.y=2.75;
    body.castShadow=true;
    body.receiveShadow=true;
    group.add(body);
    const sign=new THREE.Mesh(
        new THREE.BoxGeometry(12,1.2,.16),
        mat(0x252525,.5)
    );
    sign.position.set(
        0,
        5.1,
        -6.1
    );
    group.add(sign);
    for(let i=-1;i<=1;i++){
        createWindow(
            group,
            i*4.2,
            2.7,
            -6.1,
            3.2,
            2.4,
            .1
        );
    }
    group.position.set(x,0,z);
    world.add(group);
}
createShop(-35,85);
createShop(35,85);
createShop(-35,-85);
createShop(35,-85);
/* ============================================================
   TREES
============================================================ */
function createTree(x,z,scale=1){
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .22*scale,
            .34*scale,
            2.8*scale,
            8
        ),
        treeTrunkMat
    );
    trunk.position.y=1.4*scale;
    trunk.castShadow=true;
    tree.add(trunk);
    const crown=new THREE.Group();
    for(let i=0;i<5;i++){
        const leaf=new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                (1.25+Math.random()*.55)*scale,
                1
            ),
            leafMats[i%leafMats.length]
        );
        leaf.position.set(
            (Math.random()-.5)*1.3*scale,
            3.1*scale+(Math.random()-.5)*.7*scale,
            (Math.random()-.5)*1.3*scale
        );
        leaf.scale.y=.9;
        leaf.castShadow=true;
        leaf.receiveShadow=true;
        crown.add(leaf);
    }
    tree.add(crown);
    tree.position.set(x,0,z);
    world.add(tree);
}
/* ============================================================
   TREE PLACEMENT
============================================================ */
const treePositions=[
    [-18,-20],[-18,-5],[-18,20],[-18,50],
    [18,-20],[18,5],[18,25],[18,50],
    [-90,-15],[-90,15],
    [90,-15],[90,15],
    [-55,65],[55,65],
    [-55,-65],[55,-65],
    [-130,-15],[-130,15],
    [130,-15],[130,15],
    [-20,105],[20,105],
    [-20,-105],[20,-105]
];
for(const p of treePositions){
    createTree(
        p[0],
        p[1],
        .9+Math.random()*.3
    );
}
/* ============================================================
   STREET LIGHTS
============================================================ */
function createLamp(x,z,rot=0){
    const group=new THREE.Group();
    const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.07,.1,5.8,8),
        darkMat
    );
    pole.position.y=2.9;
    group.add(pole);
    const arm=new THREE.Mesh(
        new THREE.BoxGeometry(1.5,.08,.08),
        darkMat
    );
    arm.position.set(.7,5.55,0);
    group.add(arm);
    const lamp=new THREE.Mesh(
        new THREE.BoxGeometry(.45,.15,.3),
        whiteMat
    );
    lamp.position.set(
        1.35,
        5.43,
        0
    );
    group.add(lamp);
    const light=new THREE.PointLight(
        0xffd99a,
        .5,
        12
    );
    light.position.set(
        1.35,
        5.3,
        0
    );
    group.add(light);
    group.position.set(x,0,z);
    group.rotation.y=rot;
    world.add(group);
}
for(let z=-145;z<=145;z+=30){
    createLamp(-15,z,0);
    createLamp(15,z,Math.PI);
}
for(let x=-145;x<=145;x+=30){
    createLamp(x,-15,Math.PI/2);
    createLamp(x,15,-Math.PI/2);
}
/* ============================================================
   PARKING LOTS / CARS AS STATIC PROPS
============================================================ */
function createStaticCar(x,z,color){
    const car=new THREE.Group();
    const body=new THREE.Mesh(
        new THREE.BoxGeometry(2.1,.65,4.2),
        mat(color,.55,.05)
    );
    body.position.y=.55;
    body.castShadow=true;
    car.add(body);
    const cabin=new THREE.Mesh(
        new THREE.BoxGeometry(1.65,.72,2.1),
        darkMat
    );
    cabin.position.set(
        0,
        1.05,
        -.15
    );
    cabin.castShadow=true;
    car.add(cabin);
    for(const sx of [-1,1]){
        for(const sz of [-1,1]){
            const wheel=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .34,.34,.18,12
                ),
                darkMat
            );
            wheel.rotation.z=Math.PI/2;
            wheel.position.set(
                sx*1.05,
                .38,
                sz*1.45
            );
            car.add(wheel);
        }
    }
    car.position.set(x,0,z);
    world.add(car);
}
const carColors=[
    0x272a2d,
    0x6d2d2a,
    0x777b78,
    0x25384a,
    0x8a8070
];
let carIndex=0;
for(let z=-55;z<=55;z+=8){
    createStaticCar(
        -28,
        z,
        carColors[carIndex++%carColors.length]
    );
    createStaticCar(
        28,
        z+3,
        carColors[carIndex++%carColors.length]
    );
}
/* ============================================================
   FENCES
============================================================ */
function createFence(x,z,length,rot=0){
    const group=new THREE.Group();
    const posts=Math.floor(length/2);
    for(let i=0;i<=posts;i++){
        const post=new THREE.Mesh(
            new THREE.BoxGeometry(.08,1.4,.08),
            darkMat
        );
        post.position.set(
            -length/2+i*2,
            .7,
            0
        );
        group.add(post);
    }
    const rail1=new THREE.Mesh(
        new THREE.BoxGeometry(length,.06,.06),
        darkMat
    );
    rail1.position.y=.45;
    group.add(rail1);

    rail2.position.y=1.05;
    group.add(rail2);
    group.position.set(x,0,z);
    group.rotation.y=rot;
    world.add(group);
}

const velocity=new THREE.Vector3();
let moveX=0;
let moveY=0;
let camYaw=0;
let camPitch=.30;
let moving=false;
const playerSpeed=5.2;
let walkTime=0;
/* ============================================================
   LEFT JOYSTICK
============================================================ */
const leftJoy=document.getElementById("leftJoy");
const leftKnob=document.getElementById("leftKnob");
let leftTouch=null;
function updateLeftJoystick(clientX,clientY){
    const rect=leftJoy.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    let dx=clientX-cx;
    let dy=clientY-cy;
    const max=48;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>max){
        dx=dx/dist*max;
        dy=dy/dist*max;
    }
    leftKnob.style.transform=
        `translate(${dx}px,${dy}px)`;
    moveX=dx/max;
    /* ВАЖНО:
       экранный верх = вперёд
       поэтому dy инвертируем
    */
    moveY=-dy/max;
}
function resetLeft(){
    moveX=0;
    moveY=0;
    leftKnob.style.transform=
        "translate(0px,0px)";
}
leftJoy.addEventListener(
    "pointerdown",
    e=>{
        leftTouch=e.pointerId;
        leftJoy.setPointerCapture(e.pointerId);
        updateLeftJoystick(
            e.clientX,
            e.clientY
        );
    }
);
leftJoy.addEventListener(
    "pointermove",
    e=>{
        if(e.pointerId!==leftTouch) return;
        updateLeftJoystick(
            e.clientX,
            e.clientY
        );
    }
);
leftJoy.addEventListener(
    "pointerup",
    e=>{
        if(e.pointerId===leftTouch){
            leftTouch=null;
            resetLeft();
        }
    }
);
leftJoy.addEventListener(
    "pointercancel",
    ()=>{
        leftTouch=null;
        resetLeft();
    }
);
/* ============================================================
   RIGHT JOYSTICK
============================================================ */
const rightJoy=document.getElementById("rightJoy");
const rightKnob=document.getElementById("rightKnob");
let rightTouch=null;
let previousRightX=0;
let previousRightY=0;
rightJoy.addEventListener(
    "pointerdown",
    e=>{
        rightTouch=e.pointerId;
        rightJoy.setPointerCapture(
            e.pointerId
        );
        previousRightX=e.clientX;
        previousRightY=e.clientY;
    }
);
rightJoy.addEventListener(
    "pointermove",
    e=>{
        if(e.pointerId!==rightTouch) return;
        const dx=e.clientX-previousRightX;
        const dy=e.clientY-previousRightY;
        previousRightX=e.clientX;
        previousRightY=e.clientY;
        camYaw-=dx*.008;
        camPitch-=dy*.005;
        camPitch=
            THREE.MathUtils.clamp(
                camPitch,
                -0.15,
                .9
            );
        const rect=rightJoy.getBoundingClientRect();
        let kx=
            e.clientX-
            (rect.left+rect.width/2);
        let ky=
            e.clientY-
            (rect.top+rect.height/2);
        const max=45;
        const dist=Math.sqrt(kx*kx+ky*ky);
        if(dist>max){
            kx=kx/dist*max;
            ky=ky/dist*max;
        }
        rightKnob.style.transform=
            `translate(${kx}px,${ky}px)`;
    }
);
function resetRight(){
    rightKnob.style.transform=
        "translate(0px,0px)";
}
rightJoy.addEventListener(
    "pointerup",
    e=>{
        if(e.pointerId===rightTouch){
            rightTouch=null;
            resetRight();
        }
    }
);

);

============================================================ */
const keys={};
window.addEventListener(
    "keydown",

    e=>{

/* ============================================================
   MOVEMENT
============================================================ */
function updatePlayer(dt){
    let x=moveX;
    let y=moveY;
    if(keys.KeyA || keys.ArrowLeft) x=-1;
    if(keys.KeyD || keys.ArrowRight) x=1;
    if(keys.KeyW || keys.ArrowUp) y=1;
    if(keys.KeyS || keys.ArrowDown) y=-1;
    const length=Math.sqrt(x*x+y*y);
    if(length>1){
        x/=length;
        y/=length;
    }
    moving=
        Math.abs(x)>.03 ||
        Math.abs(y)>.03;
    if(!moving){
        velocity.x*=Math.pow(.001,dt);
        velocity.z*=Math.pow(.001,dt);
        return;
    }
    /* движение относительно направления камеры */
    const forwardX=
        Math.sin(camYaw);
    const forwardZ=
        Math.cos(camYaw);
    const rightX=
        Math.cos(camYaw);
    const rightZ=
        -Math.sin(camYaw);
    const dirX=
        forwardX*y+
        rightX*x;
    const dirZ=
        forwardZ*y+
        rightZ*x;
    const len=
        Math.sqrt(
            dirX*dirX+
            dirZ*dirZ
        );
    const nx=dirX/len;
    const nz=dirZ/len;
    const targetVX=
        nx*playerSpeed;
    const targetVZ=
        nz*playerSpeed;
    velocity.x=
        THREE.MathUtils.lerp(
            velocity.x,
            targetVX,
            Math.min(1,dt*9)
        );
    velocity.z=
        THREE.MathUtils.lerp(
            velocity.z,
            targetVZ,
            Math.min(1,dt*9)
        );
    player.position.x+=
        velocity.x*dt;
    player.position.z+=
        velocity.z*dt;
    /* ограничение территории */
    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -160,
            160
        );
    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -160,
            160
        );
    /* направление персонажа */
    const targetRotation=
        Math.atan2(
            velocity.x,
            velocity.z
        );
    let diff=
        targetRotation-
        player.rotation.y;
    diff=
        Math.atan2(
            Math.sin(diff),
            Math.cos(diff)
        );
    player.rotation.y+=
        diff*
        Math.min(1,dt*10);
    /* анимация ходьбы */
    walkTime+=dt*9;
    const amount=
        Math.min(
            .75,
            Math.sqrt(
                velocity.x*velocity.x+
                velocity.z*velocity.z
            )/playerSpeed
        );
    leftLeg.rotation.x=
        Math.sin(walkTime)*
        .55*amount;
    rightLeg.rotation.x=
        Math.sin(walkTime+Math.PI)*
        .55*amount;
    leftArm.rotation.x=
        Math.sin(walkTime+Math.PI)*
        .38*amount;
    rightArm.rotation.x=
        Math.sin(walkTime)*
        .38*amount;
    torso.rotation.z=
        Math.sin(walkTime*2)*
        .018*amount;
}
/* ============================================================
   CAMERA
============================================================ */
const cameraTarget=new THREE.Vector3();
function updateCamera(dt){
    const distance=7.5;
    const horizontal=
        Math.cos(camPitch)*
        distance;
    const vertical=
        Math.sin(camPitch)*
        distance;
    const desiredX=
        player.position.x+
        Math.sin(camYaw)*
        horizontal;
    const desiredZ=
        player.position.z+
        Math.cos(camYaw)*
        horizontal;
    const desiredY=
        player.position.y+
        2.4+
        vertical;
    camera.position.x=
        THREE.MathUtils.lerp(
            camera.position.x,
            desiredX,
            Math.min(1,dt*7)
        );
    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            desiredY,
            Math.min(1,dt*7)
        );
    camera.position.z=
        THREE.MathUtils.lerp(
            camera.position.z,
            desiredZ,
            Math.min(1,dt*7)
        );
    cameraTarget.set(
        player.position.x,
        player.position.y+1.35,
        player.position.z
    );
    camera.lookAt(cameraTarget);
}

/* ============================================================
   FPS
============================================================ */
let lastTime=performance.now();
let frames=0;
let fpsTime=performance.now();
function updateFPS(now){
    frames++;
    if(now-fpsTime>1000){
        fpsElement.textContent=
            "FPS: "+frames;
        frames=0;
        fpsTime=now;
    }
}
/* ============================================================
   MAIN LOOP
============================================================ */
function animate(now){
    requestAnimationFrame(animate);
    let dt=
        (now-lastTime)/1000;
    lastTime=now;
    dt=
        Math.min(dt,.05);
    updatePlayer(dt);
    updateCamera(dt);
    renderer.render(
        scene,
        camera
    );
    updateFPS(now);
}
animate(performance.now());
