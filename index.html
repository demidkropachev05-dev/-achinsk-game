<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Ачинск 3D — Optimized</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#171b25;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    color:white;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 2px 7px rgba(0,0,0,.8);
}

#subtitle{
    position:absolute;
    top:45px;
    left:max(15px,env(safe-area-inset-left));
    color:rgba(255,255,255,.85);
    font-size:12px;
    text-shadow:0 2px 5px rgba(0,0,0,.8);
}

#joystick{
    position:absolute;

    left:max(
        22px,
        env(safe-area-inset-left)
    );

    bottom:max(
        22px,
        env(safe-area-inset-bottom)
    );

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(8,12,18,.34);

    border:2px solid rgba(255,255,255,.20);

    box-shadow:
        0 7px 22px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.10);

    pointer-events:auto;
    touch-action:none;
    z-index:20;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:68px;
    height:68px;

    margin-left:-34px;
    margin-top:-34px;

    border-radius:50%;

    background:rgba(10,15,21,.88);

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 5px 18px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.12);

    pointer-events:none;
}

#jump{
    position:absolute;

    right:max(
        40px,
        calc(env(safe-area-inset-right) + 40px)
    );

    bottom:max(
        38px,
        calc(env(safe-area-inset-bottom) + 38px)
    );

    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:12px;
    font-weight:900;

    background:rgba(10,15,21,.86);

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
        0 6px 20px rgba(0,0,0,.45);

    pointer-events:auto;
    touch-action:none;
    user-select:none;

    z-index:30;
}

#jump:active{
    transform:scale(.92);
}

#orientation{
    position:absolute;

    right:15px;
    top:15px;

    padding:7px 10px;

    border-radius:10px;

    color:white;
    font-size:11px;

    background:rgba(0,0,0,.30);

    z-index:40;
}

@media(orientation:portrait){

    #orientation{
        background:rgba(80,50,0,.7);
    }

    #orientation::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe08a;
    }
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">
        АЧИНСК
    </div>

    <div id="subtitle">
        3D • городская версия
    </div>

    <div id="orientation">
        LANDSCAPE
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="jump">
        ПРЫЖОК
    </div>

</div>


<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const CITY_SIZE = 1100;

const PLAYER_SPEED = 20;

const COLLISION_PADDING = 1.8;

const clock = new THREE.Clock();


/* =========================================================
   СЦЕНА
========================================================= */

const scene =
    new THREE.Scene();


/*
   Вечернее небо.
*/

scene.background =
    new THREE.Color(
        0x283447
    );


scene.fog =
    new THREE.Fog(
        0x283447,
        110,
        650
    );


/* =========================================================
   КАМЕРА
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        .1,
        1200
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance",

        logarithmicDepthBuffer:false
    });


/*
   Главная оптимизация для телефона.
*/

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


renderer.setSize(
    innerWidth,
    innerHeight,
    false
);


renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.12;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   ОСВЕЩЕНИЕ — ВЕЧЕР
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0x9eb9d8,
        0x151b15,
        1.45
    );

scene.add(
    hemisphere
);


const sun =
    new THREE.DirectionalLight(
        0xffb06b,
        2.0
    );


sun.position.set(
    -180,
    190,
    -260
);


sun.castShadow = true;


/*
   Меньшая shadow map =
   заметно меньше нагрузки.
*/

sun.shadow.mapSize.width =
    1024;

sun.shadow.mapSize.height =
    1024;


sun.shadow.camera.left =
    -300;

sun.shadow.camera.right =
    300;

sun.shadow.camera.top =
    300;

sun.shadow.camera.bottom =
    -300;


sun.shadow.camera.near =
    20;

sun.shadow.camera.far =
    700;


sun.shadow.bias =
    -0.00025;


scene.add(
    sun
);


/* =========================================================
   ЛУНА / ХОЛОДНЫЙ КОНТРОВОЙ СВЕТ
========================================================= */

const moonLight =
    new THREE.DirectionalLight(
        0x8aa9d6,
        .45
    );


moonLight.position.set(
    160,
    110,
    120
);


scene.add(
    moonLight
);


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const groundMaterial =
    new THREE.MeshStandardMaterial({

        color:0x465f42,

        roughness:.96,

        metalness:0
    });


const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            CITY_SIZE,
            CITY_SIZE
        ),

        groundMaterial
    );


ground.rotation.x =
    -Math.PI / 2;


ground.receiveShadow = true;


scene.add(
    ground
);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const roadMaterial =
    new THREE.MeshStandardMaterial({

        color:0x292c30,

        roughness:.94
    });


const sidewalkMaterial =
    new THREE.MeshStandardMaterial({

        color:0x858889,

        roughness:.92
    });


const curbMaterial =
    new THREE.MeshStandardMaterial({

        color:0xaaa9a2,

        roughness:.86
    });


const markingMaterial =
    new THREE.MeshStandardMaterial({

        color:0xe8e3cf,

        roughness:.8
    });


/* =========================================================
   ДОРОГИ
========================================================= */

const roads = [];


function createRoad(
    width,
    length,
    x,
    z,
    rotation=0
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),

            roadMaterial
        );


    road.position.set(
        x,
        .06,
        z
    );


    road.rotation.y =
        rotation;


    road.receiveShadow = true;


    scene.add(
        road
    );


    /*
       Сохраняем область дороги.
       Это используется при генерации домов.
    */

    roads.push({

        x:x,

        z:z,

        width:width,

        length:length,

        rotation:rotation
    });


    const sideOffset =
        width / 2 + 4;


    for(
        const side of [-1,1]
    ){

        const sidewalk =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    7,
                    .20,
                    length
                ),

                sidewalkMaterial
            );


        sidewalk.position.set(

            x +
            Math.cos(rotation) *
            sideOffset *
            side,

            .13,

            z +
            Math.sin(rotation) *
            sideOffset *
            side
        );


        sidewalk.rotation.y =
            rotation;


        sidewalk.receiveShadow =
            true;


        scene.add(
            sidewalk
        );


        const curb =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .55,
                    .32,
                    length
                ),

                curbMaterial
            );


        curb.position.set(

            x +
            Math.cos(rotation) *
            (width/2+.3) *
            side,

            .18,

            z +
            Math.sin(rotation) *
            (width/2+.3) *
            side
        );


        curb.rotation.y =
            rotation;


        scene.add(
            curb
        );
    }
}


/*
   Основные улицы.
*/

createRoad(
    42,
    1200,
    0,
    0
);


createRoad(
    42,
    1200,
    0,
    0,
    Math.PI/2
);


createRoad(
    26,
    1050,
    -190,
    0
);


createRoad(
    26,
    1050,
    190,
    0
);


createRoad(
    26,
    1050,
    0,
    -190,
    Math.PI/2
);


createRoad(
    26,
    1050,
    0,
    190,
    Math.PI/2
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function createLaneMarks(){

    const vertical =
        new THREE.InstancedMesh(

            new THREE.BoxGeometry(
                .25,
                .08,
                7
            ),

            markingMaterial,

            70
        );


    const matrix =
        new THREE.Matrix4();


    let index=0;


    for(
        let z=-630;
        z<630;
        z+=18
    ){

        matrix.makeTranslation(
            0,
            .14,
            z
        );


        vertical.setMatrixAt(
            index++,
            matrix
        );
    }


    vertical.instanceMatrix.needsUpdate =
        true;


    scene.add(
        vertical
    );


    const horizontal =
        new THREE.InstancedMesh(

            new THREE.BoxGeometry(
                7,
                .08,
                .25
            ),

            markingMaterial,

            70
        );


    index=0;


    for(
        let x=-630;
        x<630;
        x+=18
    ){

        matrix.makeTranslation(
            x,
            .14,
            0
        );


        horizontal.setMatrixAt(
            index++,
            matrix
        );
    }


    horizontal.instanceMatrix.needsUpdate =
        true;


    scene.add(
        horizontal
    );
}


createLaneMarks();


/* =========================================================
   ПРОВЕРКА — МОЖНО ЛИ СТАВИТЬ ЗДАНИЕ
========================================================= */

function isPositionNearRoad(
    x,
    z,
    width,
    depth
){

    for(
        const road of roads
    ){

        /*
           Для нашей сетки дорог
           достаточно проверять
           ближайшие оси.
        */

        if(
            road.rotation === 0
        ){

            const distanceZ =
                Math.abs(
                    z-road.z
                );


            if(
                distanceZ <
                road.width/2 +
                depth/2 +
                9
            ){

                return true;
            }

        }else{

            const distanceX =
                Math.abs(
                    x-road.x
                );


            if(
                distanceX <
                road.width/2 +
                width/2 +
                9
            ){

                return true;
            }
        }
    }


    return false;
}


/* =========================================================
   ЗДАНИЯ
========================================================= */

const buildingColliders = [];


const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color:0x8f928f,
        roughness:.86
    }),

    new THREE.MeshStandardMaterial({
        color:0xa39b8c,
        roughness:.88
    }),

    new THREE.MeshStandardMaterial({
        color:0x777f84,
        roughness:.86
    }),

    new THREE.MeshStandardMaterial({
        color:0xb0a38f,
        roughness:.87
    }),

    new THREE.MeshStandardMaterial({
        color:0x8b9698,
        roughness:.89
    })
];


const roofMaterial =
    new THREE.MeshStandardMaterial({

        color:0x3b3d40,

        roughness:.94
    });


function createBuilding(
    x,
    z
){

    const width =
        36 +
        Math.random()*25;


    const depth =
        34 +
        Math.random()*24;


    const height =
        18 +
        Math.random()*38;


    /*
       Дополнительная защита.
    */

    if(
        isPositionNearRoad(
            x,
            z,
            width,
            depth
        )
    ){

        return false;
    }


    const group =
        new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );


    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material
        );


    building.position.y =
        height/2;


    building.castShadow = true;

    building.receiveShadow = true;


    group.add(
        building
    );


    /*
       Крыша.
    */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+1.5,
                .7,
                depth+1.5
            ),

            roofMaterial
        );


    roof.position.y =
        height+.35;


    roof.castShadow = true;


    group.add(
        roof
    );


    /*
       Простая архитектурная верхняя часть.
    */

    if(
        height>38
    ){

        const upper =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    width*.72,
                    4,
                    depth*.72
                ),

                material
            );


        upper.position.y =
            height+2;


        upper.castShadow=true;


        group.add(
            upper
        );
    }


    scene.add(
        group
    );


    /*
       Коллайдер.
    */

    buildingColliders.push({

        minX:
            x-width/2,

        maxX:
            x+width/2,

        minZ:
            z-depth/2,

        maxZ:
            z+depth/2
    });


    return true;
}


/* =========================================================
   СЕТКА ГОРОДА
========================================================= */

for(
    let x=-500;
    x<=500;
    x+=88
){

    for(
        let z=-500;
        z<=500;
        z+=88
    ){

        if(
            Math.abs(x)<70 ||
            Math.abs(z)<70
        )
            continue;


        let px =
            x +
            (Math.random()-.5)*14;


        let pz =
            z +
            (Math.random()-.5)*14;


        createBuilding(
            px,
            pz
        );
    }
}


/* =========================================================
   ОКНА — INSTANCEDMESH
========================================================= */

const windowMaterial =
    new THREE.MeshStandardMaterial({

        color:0x304c60,

        roughness:.32,

        metalness:.12
    });


const windowGeometry =
    new THREE.BoxGeometry(
        2.6,
        3.3,
        .12
    );


/*
   Не делаем тысячи отдельных Mesh.
*/

const MAX_WINDOWS = 1800;


const windowInstances =
    new THREE.InstancedMesh(

        windowGeometry,

        windowMaterial,

        MAX_WINDOWS
    );


const windowMatrix =
    new THREE.Matrix4();


let windowCount=0;


for(
    const collider of buildingColliders
){

    if(
        windowCount>=MAX_WINDOWS
    )
        break;


    const centerX =
        (collider.minX+
        collider.maxX)/2;


    const centerZ =
        (collider.minZ+
        collider.maxZ)/2;


    const width =
        collider.maxX-
        collider.minX;


    const depth =
        collider.maxZ-
        collider.minZ;


    const cols =
        Math.max(
            2,
            Math.floor(
                width/8
            )
        );


    const rows =
        3;


    for(
        let c=0;
        c<cols;
        c++
    ){

        for(
            let r=0;
            r<rows;
            r++
        ){

            if(
                windowCount>=MAX_WINDOWS
            )
                break;


            const wx =
                collider.minX+
                5+
                c*
                (
                    Math.max(
                        1,
                        width-10
                    ) /
                    Math.max(
                        1,
                        cols-1
                    )
                );


            const wy =
                5+
                r*7;


            /*
               Только фасад,
               чтобы не удваивать количество.
            */

            windowMatrix.compose(

                new THREE.Vector3(
                    wx,
                    wy,
                    collider.minZ-.08
                ),

                new THREE.Quaternion(),

                new THREE.Vector3(
                    1,
                    1,
                    1
                )
            );


            windowInstances.setMatrixAt(
                windowCount++,
                windowMatrix
            );
        }
    }
}


windowInstances.count =
    windowCount;


windowInstances.instanceMatrix.needsUpdate =
    true;


scene.add(
    windowInstances
);


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

const trunkMaterial =
    new THREE.MeshStandardMaterial({

        color:0x4a3022,

        roughness:.94
    });


const leafMaterial =
    new THREE.MeshStandardMaterial({

        color:0x2d6335,

        roughness:.91
    });


const leafGeometry =
    new THREE.IcosahedronGeometry(
        2.7,
        1
    );


const trunkGeometry =
    new THREE.CylinderGeometry(
        .42,
        .58,
        6.5,
        8
    );


const MAX_TREES = 90;


const treeLeaves =
    new THREE.InstancedMesh(

        leafGeometry,

        leafMaterial,

        MAX_TREES
    );


const treeTrunks =
    new THREE.InstancedMesh(

        trunkGeometry,

        trunkMaterial,

        MAX_TREES
    );


const treeMatrix =
    new THREE.Matrix4();


let treeCount=0;


const treePositions=[];


for(
    let x=-500;
    x<=500;
    x+=55
){

    for(
        let z=-500;
        z<=500;
        z+=55
    ){

        if(
            Math.random()>.12
        )
            continue;


        if(
            isPositionNearRoad(
                x,
                z,
                5,
                5
            )
        )
            continue;


        if(
            treeCount>=MAX_TREES
        )
            break;


        const px =
            x+
            (Math.random()-.5)*22;


        const pz =
            z+
            (Math.random()-.5)*22;


        /*
           Проверяем здания.
        */

        let blocked=false;


        for(
            const c of buildingColliders
        ){

            if(
                px>c.minX-5 &&
                px<c.maxX+5 &&
                pz>c.minZ-5 &&
                pz<c.maxZ+5
            ){

                blocked=true;
                break;
            }
        }


        if(blocked)
            continue;


        const scale =
            .75+
            Math.random()*.35;


        treeMatrix.compose(

            new THREE.Vector3(
                px,
                3.25,
                pz
            ),

            new THREE.Quaternion(),

            new THREE.Vector3(
                scale,
                scale,
                scale
            )
        );


        treeTrunks.setMatrixAt(
            treeCount,
            treeMatrix
        );


        treeMatrix.compose(

            new THREE.Vector3(
                px,
                8.2*scale,
                pz
            ),

            new THREE.Quaternion(),

            new THREE.Vector3(
                scale,
                scale*.82,
                scale
            )
        );


        treeLeaves.setMatrixAt(
            treeCount,
            treeMatrix
        );


        treeCount++;
    }
}


treeTrunks.count =
    treeCount;


treeLeaves.count =
    treeCount;


treeTrunks.instanceMatrix.needsUpdate =
    true;


treeLeaves.instanceMatrix.needsUpdate =
    true;


scene.add(
    treeTrunks
);


scene.add(
    treeLeaves
);


/* =========================================================
   ФОНАРИ
========================================================= */

const lampMaterial =
    new THREE.MeshStandardMaterial({

        color:0x34383b,

        metalness:.65,

        roughness:.42
    });


const lampLightMaterial =
    new THREE.MeshStandardMaterial({

        color:0xffd990,

        emissive:0xff9d32,

        emissiveIntensity:2.2
    });


const lampPoleGeometry =
    new THREE.CylinderGeometry(
        .11,
        .16,
        7,
        7
    );


const lampHeadGeometry =
    new THREE.SphereGeometry(
        .27,
        8,
        8
    );


const lampCount=44;


const lampPoles =
    new THREE.InstancedMesh(

        lampPoleGeometry,

        lampMaterial,

        lampCount
    );


const lampHeads =
    new THREE.InstancedMesh(

        lampHeadGeometry,

        lampLightMaterial,

        lampCount
    );


const lampMatrix =
    new THREE.Matrix4();


let lampIndex=0;


for(
    let z=-580;
    z<=580;
    z+=55
){

    if(
        lampIndex>=lampCount
    )
        break;


    lampMatrix.makeTranslation(
        -27,
        3.5,
        z
    );


    lampPoles.setMatrixAt(
        lampIndex,
        lampMatrix
    );


    lampMatrix.makeTranslation(
        -25,
        6.8,
        z
    );


    lampHeads.setMatrixAt(
        lampIndex,
        lampMatrix
    );


    lampIndex++;
}


lampPoles.count =
    lampIndex;


lampHeads.count =
    lampIndex;


lampPoles.instanceMatrix.needsUpdate =
    true;


lampHeads.instanceMatrix.needsUpdate =
    true;


scene.add(
    lampPoles
);


scene.add(
    lampHeads
);


/*
   Только несколько настоящих источников света.
   Не ставим PointLight на каждый фонарь.
*/

const streetLights=[];


for(
    let i=0;
    i<6;
    i++
){

    const light =
        new THREE.PointLight(
            0xffb55d,
            7,
            55,
            2
        );


    light.position.set(

        -25,

        6.5,

        -250+
        i*100
    );


    scene.add(
        light
    );


    streetLights.push(
        light
    );
}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

const player =
    new THREE.Group();


scene.add(
    player
);


player.position.set(
    0,
    0,
    80
);


let characterModel=null;

let characterMixer=null;

let idleAction=null;

let walkAction=null;

let runAction=null;

let activeAction=null;


const characterLoader =
    new GLTFLoader();


characterLoader.load(

    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    function(gltf){

        characterModel =
            gltf.scene;


        characterModel.scale.setScalar(
            1.8
        );


        characterModel.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;

                    object.receiveShadow=true;


                    if(
                        object.material
                    ){

                        object.material.needsUpdate=true;


                        if(
                            "roughness"
                            in object.material
                        ){

                            object.material.roughness=.78;
                        }


                        if(
                            "metalness"
                            in object.material
                        ){

                            object.material.metalness=.02;
                        }
                    }
                }
            }
        );


        player.add(
            characterModel
        );


        characterMixer =
            new THREE.AnimationMixer(
                characterModel
            );


        function findAnimation(
            names
        ){

            for(
                const name of names
            ){

                const clip =
                    gltf.animations.find(
                        animation =>
                            animation.name.toLowerCase() ===
                            name.toLowerCase()
                    );


                if(clip)
                    return clip;
            }


            return null;
        }


        const idleClip =
            findAnimation([
                "idle",
                "Idle"
            ]);


        const walkClip =
            findAnimation([
                "walk",
                "walking",
                "Walk",
                "Walking"
            ]);


        const runClip =
            findAnimation([
                "run",
                "running",
                "Run",
                "Running"
            ]);


        if(idleClip){

            idleAction =
                characterMixer.clipAction(
                    idleClip
                );

            idleAction.play();

            activeAction =
                idleAction;
        }


        if(walkClip){

            walkAction =
                characterMixer.clipAction(
                    walkClip
                );

            walkAction.loop =
                THREE.LoopRepeat;
        }


        if(runClip){

            runAction =
                characterMixer.clipAction(
                    runClip
                );

            runAction.loop =
                THREE.LoopRepeat;
        }

    },

    undefined,

    function(error){

        console.error(
            "Character loading error:",
            error
        );
    }
);


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function playCharacterAnimation(
    action
){

    if(!action)
        return;


    if(activeAction===action)
        return;


    const previous =
        activeAction;


    activeAction =
        action;


    action.reset();

    action.enabled=true;

    action.setEffectiveWeight(1);


    if(previous){

        action.crossFadeFrom(
            previous,
            .18,
            true
        );
    }


    action.play();
}


function updateCharacterAnimation(
    delta,
    moving
){

    if(!characterMixer)
        return;


    characterMixer.update(
        delta
    );


    if(
        moving &&
        walkAction
    ){

        playCharacterAnimation(
            walkAction
        );

    }else if(
        idleAction
    ){

        playCharacterAnimation(
            idleAction
        );
    }
}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


let joystickPointerId=null;

let joystickX=0;

let joystickY=0;


const joystickRadius=55;


function updateJoystick(
    event
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;


    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        event.clientX-
        centerX;


    let dy =
        event.clientY-
        centerY;


    const length =
        Math.hypot(
            dx,
            dy
        );


    if(
        length>
        joystickRadius
    ){

        dx =
            dx/
            length*
            joystickRadius;


        dy =
            dy/
            length*
            joystickRadius;
    }


    joystickX =
        dx/
        joystickRadius;


    joystickY =
        dy/
        joystickRadius;


    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickPointerId=null;

    joystickX=0;

    joystickY=0;


    stick.style.transform =
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystickPointerId =
            e.pointerId;


        joystick.setPointerCapture(
            e.pointerId
        );


        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        e.preventDefault();


        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId ===
            joystickPointerId
        ){

            resetJoystick();
        }
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


joystick.addEventListener(
    "lostpointercapture",
    resetJoystick
);


/* =========================================================
   ПРЫЖОК
========================================================= */

let verticalVelocity=0;

let isJumping=false;


const jumpButton =
    document.getElementById(
        "jump"
    );


function jump(){

    if(isJumping)
        return;


    isJumping=true;

    verticalVelocity=8.2;
}


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();

        jumpButton.setPointerCapture(
            e.pointerId
        );
    },
    {
        passive:false
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let yaw=0;

let pitch=.42;

let distance=7;


let cameraPointerId=null;

let cameraLastX=0;

let cameraLastY=0;


function isControlElement(
    target
){

    return (

        target===joystick ||

        joystick.contains(target) ||

        target===jumpButton ||

        jumpButton.contains(target)
    );
}


document.addEventListener(
    "pointerdown",
    function(e){

        if(
            isControlElement(
                e.target
            )
        )
            return;


        cameraPointerId =
            e.pointerId;


        cameraLastX =
            e.clientX;


        cameraLastY =
            e.clientY;

    },
    {
        capture:true
    }
);


document.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            cameraPointerId
        )
            return;


        const dx =
            e.clientX-
            cameraLastX;


        const dy =
            e.clientY-
            cameraLastY;


        yaw -=
            dx*.007;


        pitch +=
            dy*.005;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.05
            );


        cameraLastX =
            e.clientX;


        cameraLastY =
            e.clientY;


        e.preventDefault();

    },
    {
        passive:false,
        capture:true
    }
);


document.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        ){

            cameraPointerId=null;
        }
    },
    {
        capture:true
    }
);


document.addEventListener(
    "pointercancel",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        ){

            cameraPointerId=null;
        }
    },
    {
        capture:true
    }
);


/* =========================================================
   КОЛЛИЗИИ
========================================================= */

function collidesWithBuildings(
    x,
    z
){

    const radius =
        COLLISION_PADDING;


    for(
        const box of buildingColliders
    ){

        if(

            x >
            box.minX-radius &&

            x <
            box.maxX+radius &&

            z >
            box.minZ-radius &&

            z <
            box.maxZ+radius

        ){

            return true;
        }
    }


    return false;
}


/*
   Движение по X и Z отдельно.
   Это позволяет персонажу скользить
   вдоль стены вместо полного стопа.
*/

function movePlayer(
    dx,
    dz
){

    const nextX =
        player.position.x+
        dx;


    if(
        !collidesWithBuildings(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;
    }


    const nextZ =
        player.position.z+
        dz;


    if(
        !collidesWithBuildings(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;
    }


    /*
       Границы города.
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -530,
            530
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -530,
            530
        );
}


/* =========================================================
   ИГРОВАЯ ЛОГИКА
========================================================= */

function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    /*
       ВАЖНО:

       joystickX вправо = +1
       joystickX влево = -1

       joystickY вверх = -1
       joystickY вниз = +1

       Поэтому здесь диагонали
       больше НЕ инвертируются.
    */

    let forward =
        -joystickY;


    let side =
        joystickX;


    const length =
        Math.hypot(
            forward,
            side
        );


    const moving =
        length>.08;


    if(moving){

        forward /=
            length;


        side /=
            length;


        const speed =
            PLAYER_SPEED*
            delta;


        const sin =
            Math.sin(yaw);


        const cos =
            Math.cos(yaw);


        const moveX =
            sin*forward+
            cos*side;


        const moveZ =
            cos*forward-
            sin*side;


        movePlayer(
            moveX*speed,
            moveZ*speed
        );


        if(
            Math.abs(moveX)+
            Math.abs(moveZ)>.01
        ){

            player.rotation.y =
                Math.atan2(
                    moveX,
                    moveZ
                );
        }
    }


    /* =====================================================
       ПРЫЖОК
    ===================================================== */

    if(isJumping){

        verticalVelocity -=
            22*delta;


        player.position.y +=
            verticalVelocity*
            delta;


        if(
            player.position.y<=0
        ){

            player.position.y=0;

            verticalVelocity=0;

            isJumping=false;
        }
    }


    updateCharacterAnimation(
        delta,
        moving
    );


    /* =====================================================
       КАМЕРА
    ===================================================== */

    const horizontal =
        Math.cos(pitch)*
        distance;


    const vertical =
        Math.sin(pitch)*
        distance;


    const target =
        new THREE.Vector3(

            player.position.x,

            2.35+
            player.position.y,

            player.position.z
        );


    const wanted =
        new THREE.Vector3(

            player.position.x-
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z-
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .14
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight,
            false
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );
    }
);


/* =========================================================
   ОШИБКИ
========================================================= */

window.addEventListener(
    "error",
    function(e){

        console.error(
            "GAME ERROR:",
            e.message
        );
    }
);

</script>
