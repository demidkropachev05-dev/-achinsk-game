<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>АЧИНСК 3D — REALISTIC</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#101821;
touch-action:none;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#ui{
position:fixed;
inset:0;
pointer-events:none;
}

#title{
position:absolute;
top:max(12px,env(safe-area-inset-top));
left:max(15px,env(safe-area-inset-left));
color:#fff;
font-size:23px;
font-weight:900;
letter-spacing:1px;
text-shadow:0 2px 8px rgba(0,0,0,.9);
}

#subtitle{
position:absolute;
top:45px;
left:max(15px,env(safe-area-inset-left));
color:rgba(255,255,255,.78);
font-size:12px;
text-shadow:0 2px 6px rgba(0,0,0,.8);
}

#orientation{
position:absolute;
right:15px;
top:15px;
padding:7px 10px;
border-radius:10px;
color:#fff;
font-size:11px;
background:rgba(0,0,0,.35);
backdrop-filter:blur(5px);
}

#joystick{
position:absolute;

left:max(
22px,
env(safe-area-inset-left)
);

bottom:max(
22px,
env(safe-area-inset-bottom)
);

width:150px;
height:150px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,255,255,.08),
rgba(5,10,15,.38)
);

border:2px solid rgba(255,255,255,.20);

box-shadow:
0 8px 28px rgba(0,0,0,.45),
inset 0 2px 8px rgba(255,255,255,.08);

pointer-events:auto;
touch-action:none;

z-index:20;
}

#stick{
position:absolute;

left:50%;
top:50%;

width:68px;
height:68px;

margin-left:-34px;
margin-top:-34px;

border-radius:50%;

background:
radial-gradient(
circle at 35% 30%,
rgba(90,105,116,.95),
rgba(15,22,28,.98)
);

border:1px solid rgba(255,255,255,.35);

box-shadow:
0 7px 22px rgba(0,0,0,.55),
inset 0 2px 5px rgba(255,255,255,.12);

pointer-events:none;
}

#jump{
position:absolute;

right:max(
40px,
calc(env(safe-area-inset-right) + 40px)
);

bottom:max(
38px,
calc(env(safe-area-inset-bottom) + 38px)
);

width:74px;
height:74px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

color:#fff;

font-size:12px;
font-weight:900;

background:
radial-gradient(
circle at 35% 30%,
rgba(75,88,98,.98),
rgba(10,16,21,.98)
);

border:1px solid rgba(255,255,255,.30);

box-shadow:
0 7px 24px rgba(0,0,0,.55),
inset 0 2px 6px rgba(255,255,255,.10);

pointer-events:auto;
touch-action:none;

z-index:30;
}

#jump:active{
transform:scale(.92);
}

#credit{
position:absolute;
left:50%;
bottom:8px;
transform:translateX(-50%);
font-size:9px;
color:rgba(255,255,255,.28);
white-space:nowrap;
}

@media(orientation:portrait){

#orientation{
background:rgba(110,65,15,.7);
}

#orientation::after{
content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
color:#ffe29a;
}

}

</style>
</head>

<body>

<script>

window.addEventListener("error",function(e){

const box=document.createElement("div");

box.style.position="fixed";
box.style.left="10px";
box.style.right="10px";
box.style.top="10px";
box.style.zIndex="999999";
box.style.padding="15px";
box.style.background="rgba(110,0,0,.96)";
box.style.color="white";
box.style.fontSize="14px";
box.style.fontFamily="monospace";
box.style.borderRadius="12px";
box.style.whiteSpace="pre-wrap";
box.style.wordBreak="break-word";

box.textContent=
"ОШИБКА JAVASCRIPT:\n\n"+
e.message+
"\n\nФайл:\n"+
e.filename+
"\n\nСтрока: "+
e.lineno+
"\nКолонка: "+
e.colno;

document.body.appendChild(box);

});

</script>

<div id="title">
АЧИНСК
</div>

<div id="subtitle">
3D • REALISTIC CITY
</div>

<div id="orientation">
LANDSCAPE
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<div id="jump">
ПРЫЖОК
</div>

<div id="credit">
3D CITY • WEBGL
</div>

<script type="module">

import * as THREE
from "three";

import {
GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const CITY_SIZE=1200;

const MAX_PIXEL_RATIO=
Math.min(
window.devicePixelRatio || 1,
1.65
);


/* =========================================================
   СЦЕНА
========================================================= */

const scene=
new THREE.Scene();

scene.background=
new THREE.Color(0x263b50);

scene.fog=
new THREE.Fog(
0x263b50,
180,
850
);


/* =========================================================
   КАМЕРА
========================================================= */

const camera=
new THREE.PerspectiveCamera(
62,
innerWidth/innerHeight,
0.1,
1200
);


/* =========================================================
   RENDERER
========================================================= */

const renderer=
new THREE.WebGLRenderer({

antialias:true,

powerPreference:
"high-performance",

precision:
"highp"

});

renderer.setPixelRatio(
MAX_PIXEL_RATIO
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.outputColorSpace=
THREE.SRGBColorSpace;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
1.12;

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.body.appendChild(
renderer.domElement
);


/* =========================================================
   ВЕЧЕРНИЙ СВЕТ
========================================================= */

const skyLight=
new THREE.HemisphereLight(
0x9bb9d5,
0x171d19,
1.25
);

scene.add(
skyLight
);


const sun=
new THREE.DirectionalLight(
0xffa15d,
3.0
);

sun.position.set(
-260,
180,
-220
);

sun.castShadow=true;

sun.shadow.mapSize.width=1536;
sun.shadow.mapSize.height=1536;

sun.shadow.camera.left=-320;
sun.shadow.camera.right=320;
sun.shadow.camera.top=320;
sun.shadow.camera.bottom=-320;

sun.shadow.bias=-0.0005;

scene.add(
sun
);


/* =========================================================
   ДОПОЛНИТЕЛЬНЫЙ ХОЛОДНЫЙ ЗАПОЛНЯЮЩИЙ СВЕТ
========================================================= */

const fill=
new THREE.DirectionalLight(
0x6e9ac4,
0.65
);

fill.position.set(
180,
80,
240
);

scene.add(
fill
);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const MAT={};


MAT.grass=
new THREE.MeshStandardMaterial({

color:0x263c28,

roughness:1

});


MAT.asphalt=
new THREE.MeshStandardMaterial({

color:0x24272b,

roughness:.94,

metalness:.02

});


MAT.asphaltDark=
new THREE.MeshStandardMaterial({

color:0x1c1f22,

roughness:.97

});


MAT.concrete=
new THREE.MeshStandardMaterial({

color:0x777978,

roughness:.91

});


MAT.curb=
new THREE.MeshStandardMaterial({

color:0x9b9b96,

roughness:.84

});


MAT.white=
new THREE.MeshStandardMaterial({

color:0xd8d5c7,

roughness:.72

});


MAT.yellow=
new THREE.MeshStandardMaterial({

color:0xc6a849,

roughness:.65

});


MAT.window=
new THREE.MeshStandardMaterial({

color:0x182b39,

roughness:.22,

metalness:.2

});


MAT.windowWarm=
new THREE.MeshStandardMaterial({

color:0xffa447,

emissive:0xff6d1a,

emissiveIntensity:1.8,

roughness:.28

});


MAT.metal=
new THREE.MeshStandardMaterial({

color:0x33383b,

metalness:.75,

roughness:.38

});


MAT.wood=
new THREE.MeshStandardMaterial({

color:0x503725,

roughness:.88

});


MAT.leaf=
new THREE.MeshStandardMaterial({

color:0x254c2d,

roughness:.92

});


MAT.leafLight=
new THREE.MeshStandardMaterial({

color:0x37673a,

roughness:.9

});


MAT.brick=
new THREE.MeshStandardMaterial({

color:0x714d40,

roughness:.9

});


MAT.facade1=
new THREE.MeshStandardMaterial({

color:0x9a9185,

roughness:.88

});


MAT.facade2=
new THREE.MeshStandardMaterial({

color:0x858c8e,

roughness:.88

});


MAT.facade3=
new THREE.MeshStandardMaterial({

color:0xa49b8d,

roughness:.88

});


MAT.facade4=
new THREE.MeshStandardMaterial({

color:0x6d7476,

roughness:.9

});


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const ground=
new THREE.Mesh(

new THREE.PlaneGeometry(
CITY_SIZE,
CITY_SIZE
),

MAT.grass

);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(
ground
);


/* =========================================================
   ГРУППЫ ГОРОДА
========================================================= */

const roadsGroup=
new THREE.Group();

const buildingsGroup=
new THREE.Group();

const detailsGroup=
new THREE.Group();

const vegetationGroup=
new THREE.Group();

const lightsGroup=
new THREE.Group();

scene.add(
roadsGroup,
buildingsGroup,
detailsGroup,
vegetationGroup,
lightsGroup
);


/* =========================================================
   ДОРОГИ
========================================================= */

function createRoad(
width,
length,
x,
z,
rotation=0
){

const road=
new THREE.Mesh(

new THREE.BoxGeometry(
width,
.16,
length
),

MAT.asphalt

);

road.position.set(
x,
.08,
z
);

road.rotation.y=
rotation;

road.receiveShadow=true;

roadsGroup.add(
road
);


/* тротуары */

const sidewalkOffset=
width/2+4.4;

for(
let s=-1;
s<=1;
s+=2
){

const sidewalk=
new THREE.Mesh(

new THREE.BoxGeometry(
7.2,
.24,
length
),

MAT.concrete

);

sidewalk.position.set(

x+
Math.cos(rotation)*
sidewalkOffset*
s,

.18,

z+
Math.sin(rotation)*
sidewalkOffset*
s

);

sidewalk.rotation.y=
rotation;

sidewalk.receiveShadow=true;

roadsGroup.add(
sidewalk
);


/* бордюр */

const curb=
new THREE.Mesh(

new THREE.BoxGeometry(
.55,
.38,
length
),

MAT.curb

);

curb.position.set(

x+
Math.cos(rotation)*
(width/2+.32)*
s,

.25,

z+
Math.sin(rotation)*
(width/2+.32)*
s

);

curb.rotation.y=
rotation;

roadsGroup.add(
curb
);

}

}


/* главные дороги */

createRoad(
46,
1400,
0,
0
);

createRoad(
46,
1400,
0,
0,
Math.PI/2
);

createRoad(
28,
1050,
-190,
0
);

createRoad(
28,
1050,
190,
0
);

createRoad(
28,
1050,
0,
-190,
Math.PI/2
);

createRoad(
28,
1050,
0,
190,
Math.PI/2
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function createRoadMark(
x,
z,
sx,
sz,
rotation=0
){

const mark=
new THREE.Mesh(

new THREE.BoxGeometry(
sx,
.08,
sz
),

MAT.white

);

mark.position.set(
x,
.18,
z
);

mark.rotation.y=
rotation;

roadsGroup.add(
mark
);

}


/* главная вертикальная */

for(
let z=-650;
z<650;
z+=20
){

createRoadMark(
0,
z,
.34,
9
);

}


/* горизонтальная */

for(
let x=-650;
x<650;
x+=20
){

createRoadMark(
x,
0,
9,
.34
);

}


/* боковые */

for(
let z=-500;
z<500;
z+=20
){

createRoadMark(
-190,
z,
.24,
8
);

createRoadMark(
190,
z,
.24,
8
);

}


/* =========================================================
   ПЕШЕХОДНЫЕ ПЕРЕХОДЫ
========================================================= */

function createCrosswalk(
x,
z,
horizontal=true
){

for(
let i=-6;
i<=6;
i++
){

if(horizontal){

createRoadMark(
x+i*3,
z,
2,
10
);

}else{

createRoadMark(
x,
z+i*3,
10,
2
);

}

}

}


createCrosswalk(
0,
-27,
true
);

createCrosswalk(
0,
27,
true
);

createCrosswalk(
-27,
0,
false
);

createCrosswalk(
27,
0,
false
);


/* =========================================================
   ДОПОЛНИТЕЛЬНЫЕ ТРЕЩИНЫ АСФАЛЬТА
========================================================= */

function createCrack(
x,
z,
length,
rotation
){

const crack=
new THREE.Mesh(

new THREE.BoxGeometry(
.08,
.03,
length
),

MAT.asphaltDark

);

crack.position.set(
x,
.19,
z
);

crack.rotation.y=
rotation;

detailsGroup.add(
crack
);

}


for(
let i=0;
i<80;
i++
){

const x=
(Math.random()-.5)*1000;

const z=
(Math.random()-.5)*1000;

if(
Math.abs(x)<55 ||
Math.abs(z)<55
){

createCrack(
x,
z,
2+Math.random()*7,
Math.random()*Math.PI
);

}

}


/* =========================================================
   ОКНА
========================================================= */

function createWindow(
x,
y,
z,
rotation,
warm=false,
scale=1
){

const mesh=
new THREE.Mesh(

new THREE.BoxGeometry(
2.6*scale,
3.2*scale,
.16
),

warm?
MAT.windowWarm:
MAT.window

);

mesh.position.set(
x,
y,
z
);

mesh.rotation.y=
rotation;

buildingsGroup.add(
mesh
);

}


/* =========================================================
   БАЛКОН
========================================================= */

function createBalcony(
x,
y,
z,
rotation
){

const base=
new THREE.Mesh(

new THREE.BoxGeometry(
5.5,
.22,
2.2
),

MAT.concrete

);

base.position.set(
x,
y,
z
);

base.rotation.y=
rotation;

buildingsGroup.add(
base
);


const railMat=
MAT.metal;

for(
let i=-2;
i<=2;
i++
){

const rail=
new THREE.Mesh(

new THREE.CylinderGeometry(
.055,
.055,
1.25,
6
),

railMat

);

rail.position.set(
x+i*1.05,
y+.68,
z+1.0
);

buildingsGroup.add(
rail
);

}

}


/* =========================================================
   КОНДИЦИОНЕР
========================================================= */

function createAC(
x,
y,
z
){

const body=
new THREE.Mesh(

new THREE.BoxGeometry(
1.8,
1.1,
.55
),

MAT.metal

);

body.position.set(
x,
y,
z
);

buildingsGroup.add(
body
);


const front=
new THREE.Mesh(

new THREE.BoxGeometry(
1.45,
.7,
.08
),

MAT.window

);

front.position.set(
x,
y,
z-.32
);

buildingsGroup.add(
front
);

}


/* =========================================================
   ВХОД
========================================================= */

function createEntrance(
x,
y,
z,
rotation
){

const door=
new THREE.Mesh(

new THREE.BoxGeometry(
3.2,
4.8,
.18
),

MAT.window

);

door.position.set(
x,
y+2.4,
z
);

door.rotation.y=
rotation;

buildingsGroup.add(
door
);


const canopy=
new THREE.Mesh(

new THREE.BoxGeometry(
4.5,
.25,
2.4
),

MAT.metal

);

canopy.position.set(
x,
y+5.1,
z
);

canopy.rotation.y=
rotation;

buildingsGroup.add(
canopy
);

}


/* =========================================================
   ЗДАНИЕ
========================================================= */

function createBuilding(
x,
z,
seed
){

const rand=
()=>{

seed=
(seed*9301+49297)%233280;

return seed/233280;

};


const width=
42+
rand()*28;

const depth=
38+
rand()*26;

const floors=
3+
Math.floor(
rand()*8
);

const height=
floors*4.1;


const materials=[
MAT.facade1,
MAT.facade2,
MAT.facade3,
MAT.facade4,
MAT.brick
];


const material=
materials[
Math.floor(
rand()*materials.length
)
];


const building=
new THREE.Mesh(

new THREE.BoxGeometry(
width,
height,
depth
),

material

);

building.position.set(
x,
height/2,
z
);

building.castShadow=true;
building.receiveShadow=true;

buildingsGroup.add(
building
);


/* фундамент */

const foundation=
new THREE.Mesh(

new THREE.BoxGeometry(
width+.8,
1.1,
depth+.8
),

MAT.concrete

);

foundation.position.set(
x,
.55,
z
);

buildingsGroup.add(
foundation
);


/* крыша */

const roof=
new THREE.Mesh(

new THREE.BoxGeometry(
width+1.8,
.65,
depth+1.8
),

MAT.asphaltDark

);

roof.position.set(
x,
height+.32,
z
);

roof.castShadow=true;

buildingsGroup.add(
roof
);


/* окна */

const columns=
Math.max(
3,
Math.floor(
width/7
)
);

const rows=
floors;


for(
let row=0;
row<rows;
row++
){

const y=
3+
row*4.1;


for(
let col=0;
col<columns;
col++
){

const px=
x-width/2+
4+
col*
((width-8)/
Math.max(1,columns-1));


const warm=
rand()<.18;


/* перед */

createWindow(
px,
y,
z-depth/2-.10,
0,
warm
);


/* зад */

if(
rand()<.78
){

createWindow(
px,
y,
z+depth/2+.10,
Math.PI,
warm
);

}

}


/* боковые окна */

const sideRows=
Math.max(
2,
Math.floor(depth/8)
);

for(
let s=0;
s<sideRows;
s++
){

const pz=
z-depth/2+
4+
s*
((depth-8)/
Math.max(1,sideRows-1));


createWindow(
x-width/2-.1,
y,
pz,
Math.PI/2,
rand()<.12
);


createWindow(
x+width/2+.1,
y,
pz,
-Math.PI/2,
rand()<.12
);

}

}


/* балконы */

if(
floors>=4 &&
rand()<.7
){

const count=
2+
Math.floor(
rand()*3
);

for(
let i=0;
i<count;
i++
){

createBalcony(
x-width/2+7+
i*8,
5+i*8,
z-depth/2-1.4,
0
);

}

}


/* кондиционеры */

const acCount=
Math.floor(
floors*.45
);

for(
let i=0;
i<acCount;
i++
){

createAC(
x-width/2-.45,
3+
Math.floor(
rand()*floors
)*4.1,
z-depth/2-.5
);

}


/* вход */

createEntrance(
x,
0,
z-depth/2-.3,
0
);

}


/* =========================================================
   СЕТКА ЗДАНИЙ
========================================================= */

/*
   ВАЖНО:
   здания стоят только в кварталах.
   Центральная часть дорог остаётся свободной.
*/

let buildingSeed=71;

for(
let x=-500;
x<=500;
x+=92
){

for(
let z=-500;
z<=500;
z+=92
){

if(
Math.abs(x)<70 ||
Math.abs(z)<70
)
continue;


/* небольшой случайный сдвиг */

const px=
x+
(Math.random()-.5)*14;

const pz=
z+
(Math.random()-.5)*14;


/* защита от дороги */

const nearMainX=
Math.abs(px)<31;

const nearMainZ=
Math.abs(pz)<31;

const nearSideX=
Math.abs(Math.abs(px)-190)<21;

const nearSideZ=
Math.abs(Math.abs(pz)-190)<21;


if(
nearMainX ||
nearMainZ ||
nearSideX ||
nearSideZ
)
continue;


createBuilding(
px,
pz,
buildingSeed++
);

}

}


/* =========================================================
   ДЕРЕВО
========================================================= */

function createTree(
x,
z,
scale=1
){

const tree=
new THREE.Group();

tree.position.set(
x,
0,
z
);

tree.scale.setScalar(
scale
);

tree.rotation.y=
Math.random()*Math.PI*2;


/* ствол */

const trunk=
new THREE.Mesh(

new THREE.CylinderGeometry(
.35,
.62,
6.8,
9
),

MAT.wood

);

trunk.position.y=
3.4;

trunk.castShadow=true;

tree.add(
trunk
);


/* ветви */

for(
let i=0;
i<5;
i++
){

const branch=
new THREE.Mesh(

new THREE.CylinderGeometry(
.12,
.28,
3.5,
7

/* =========================================================

========================================================= */

const player=
new THREE.Group();

scene.add(
player
);

0,
0,
80
);


let characterModel=null;

let characterMixer=null;

let idleAction=null;
let walkAction=null;
let runAction=null;

let activeAction=null;


const characterLoader=
new GLTFLoader();


characterLoader.load(

"https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

function(gltf){

characterModel=
gltf.scene;

characterModel.scale.setScalar(
1.8
);

characterModel.traverse(
function(object){

if(object.isMesh){

object.castShadow=true;
object.receiveShadow=true;

if(object.material){

object.material.needsUpdate=true;

if(
"roughness"
in object.material
)
object.material.roughness=.78;

if(
"metalness"
in object.material
)
object.material.metalness=.02;

}

}

}
);

player.add(
characterModel
);


characterMixer=
new THREE.AnimationMixer(
characterModel
);


function findAnimation(
names
){

for(
const n of names
){

const clip=
gltf.animations.find(
a=>
a.name.toLowerCase()===
n.toLowerCase()
);

if(clip)
return clip;

}

return null;

}


const idleClip=
findAnimation([
"idle",
"Idle"
]);


const walkClip=
findAnimation([
"walk",
"walking",
"Walk",
"Walking"
]);


const runClip=
findAnimation([
"run",
"running",
"Run",
"Running"
]);


if(idleClip){

idleAction=
characterMixer.clipAction(
idleClip
);

idleAction.play();

activeAction=
idleAction;

}


if(walkClip){

walkAction=
characterMixer.clipAction(
walkClip
);

}


if(runClip){

runAction=
characterMixer.clipAction(
runClip
);

}

},

undefined,

function(error){

console.error(
"CHARACTER ERROR",
error
);

}

);


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function playCharacterAnimation(
action
){

if(!action)
return;

if(activeAction===action)
return;

const old=
activeAction;

activeAction=
action;

action.reset();

action.enabled=true;

action.setEffectiveWeight(1);

if(old){

action.crossFadeFrom(
old,
.16,
true
);

}

action.play();

}


function updateCharacterAnimation(
delta,
moving
){

if(!characterMixer)
return;

characterMixer.update(
delta
);

if(
moving &&
walkAction
){

playCharacterAnimation(
walkAction
);

}else if(
idleAction
){

playCharacterAnimation(
idleAction
);

}

}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);


let joystickPointerId=
null;

let joystickX=0;

let joystickY=0;

const joystickRadius=55;


function updateJoystick(
event
){

const rect=
joystick.getBoundingClientRect();

const centerX=
rect.left+
rect.width/2;

const centerY=
rect.top+
rect.height/2;


let dx=
event.clientX-
centerX;

let dy=
event.clientY-
centerY;


const distance=
Math.hypot(
dx,
dy
);


if(
distance>joystickRadius
){

dx=
dx/distance*
joystickRadius;

dy=
dy/distance*
joystickRadius;

}


/*
   ИСПРАВЛЕННАЯ СИСТЕМА:

   X вправо = +1
   X влево = -1

   Y вниз = +1
   Y вверх = -1
*/

joystickX=
dx/joystickRadius;

joystickY=
dy/joystickRadius;


stick.style.transform=
"translate("+
dx+
"px,"+
dy+
"px)";

}


function resetJoystick(){

joystickPointerId=
null;

joystickX=0;

joystickY=0;

stick.style.transform=
"translate(0px,0px)";

}


joystick.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

joystickPointerId=
e.pointerId;

joystick.setPointerCapture(
e.pointerId
);

updateJoystick(
e
);

},
{passive:false}
);


joystick.addEventListener(
"pointermove",
function(e){

if(
e.pointerId!==joystickPointerId
)
return;

e.preventDefault();

updateJoystick(
e
);

},
{passive:false}
);


joystick.addEventListener(
"pointerup",
function(e){

if(
e.pointerId===
joystickPointerId
)
resetJoystick();

}
);


joystick.addEventListener(
"pointercancel",
resetJoystick
);

joystick.addEventListener(
"lostpointercapture",
resetJoystick
);


/* =========================================================
   ПРЫЖОК
========================================================= */

let verticalVelocity=0;

let isJumping=false;


const jumpButton=
document.getElementById(
"jump"
);


function jump(){

if(isJumping)
return;

isJumping=true;

verticalVelocity=
8.5;

}


jumpButton.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

jump();

jumpButton.setPointerCapture(
e.pointerId
);

},
{passive:false}
);


/* =========================================================
   КАМЕРА
========================================================= */

let yaw=0;

let pitch=.42;

const distance=7;


let cameraPointerId=
null;

let cameraLastX=0;

let cameraLastY=0;


function isControlElement(
target
){

return(
target===joystick ||
joystick.contains(target) ||
target===jumpButton ||
jumpButton.contains(target)
);

}


document.addEventListener(
"pointerdown",
function(e){

if(
isControlElement(e.target)
)
return;

cameraPointerId=
e.pointerId;

cameraLastX=
e.clientX;

cameraLastY=
e.clientY;

},
{
passive:false,
capture:true
}
);


document.addEventListener(
"pointermove",
function(e){

if(
e.pointerId!==cameraPointerId
)
return;

const dx=
e.clientX-cameraLastX;

const dy=
e.clientY-cameraLastY;


yaw-=
dx*.008;

pitch+=
dy*.006;

pitch=
THREE.MathUtils.clamp(
pitch,
.14,
1.05
);


cameraLastX=
e.clientX;

cameraLastY=
e.clientY;

e.preventDefault();

},
{
passive:false,
capture:true
}
);


document.addEventListener(
"pointerup",
function(e){

if(
e.pointerId===
cameraPointerId
)
cameraPointerId=null;

},
{capture:true}
);


document.addEventListener(
"pointercancel",
function(e){

if(
e.pointerId===
cameraPointerId
)
cameraPointerId=null;

},
{capture:true}
);


window.addEventListener(
"blur",
function(){

cameraPointerId=null;

resetJoystick();

}
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

const keys=
{};


window.addEventListener(
"keydown",
function(e){

keys[e.key.toLowerCase()]=true;

if(
e.code==="Space"
)
jump();

}
);


window.addEventListener(
"keyup",
function(e){

keys[e.key.toLowerCase()]=false;

}
);


/* =========================================================
   ИГРОВАЯ ЛОГИКА
========================================================= */

const clock=
new THREE.Clock();


function update(){

const delta=
Math.min(
clock.getDelta(),
.05
);


/* клавиатура */

let inputX=
joystickX;

let inputY=
joystickY;


if(keys["a"]||keys["arrowleft"])
inputX=-1;

if(keys["d"]||keys["arrowright"])
inputX=1;

if(keys["w"]||keys["arrowup"])
inputY=-1;

if(keys["s"]||keys["arrowdown"])
inputY=1;


/*
   ГЛАВНОЕ ИСПРАВЛЕНИЕ ДИАГОНАЛИ

   forward:
   вверх джойстика = +forward

   side:
   вправо = +side
*/

let forward=
-inputY;

let side=
inputX;


const length=
Math.hypot(
forward,
side
);


const moving=
length>.08;


if(moving){

forward/=length;

side/=length;


const speed=
21*delta;


const sin=
Math.sin(yaw);

const cos=
Math.cos(yaw);


/*
   forward = направление камеры
   side = вправо относительно камеры
*/

const moveX=
sin*forward+
cos*side;

const moveZ=
cos*forward-
sin*side;


player.position.x+=
moveX*speed;

player.position.z+=
moveZ*speed;


/* ограничение города */

player.position.x=
THREE.MathUtils.clamp(
player.position.x,
-560,
560
);

player.position.z=
THREE.MathUtils.clamp(
player.position.z,
-560,
560
);


/* поворот персонажа */

player.rotation.y=
Math.atan2(
moveX,
moveZ
);

}


/* =========================================================
   ПРЫЖОК
========================================================= */

if(isJumping){

verticalVelocity-=
22*delta;

player.position.y+=
verticalVelocity*delta;


if(
player.position.y<=0
){

player.position.y=0;

verticalVelocity=0;

isJumping=false;

}

}


updateCharacterAnimation(
delta,
moving
);


/* =========================================================
   КАМЕРА
========================================================= */

const horizontal=
Math.cos(pitch)*
distance;

const vertical=
Math.sin(pitch)*
distance;


const target=
new THREE.Vector3(

player.position.x,

2.4+
player.position.y,

player.position.z

);


const wanted=
new THREE.Vector3(

player.position.x-
Math.sin(yaw)*
horizontal,

player.position.y+
vertical,

player.position.z-
Math.cos(yaw)*
horizontal

);


camera.position.lerp(
wanted,
.12
);

camera.lookAt(
target
);

}


/* =========================================================
   РЕНДЕР
========================================================= */

function animate(){

requestAnimationFrame(
animate
);

update();

renderer.render(
scene,
camera
);

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
function(){

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);

</script>
