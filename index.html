<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

/* =====================================================
   СЦЕНА
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8dbbd6);

scene.fog =
    new THREE.Fog(
        0x8dbbd6,
        140,
        720
    );


/* =====================================================
   КАМЕРА
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        0.1,
        1400
    );


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   СВЕТ
===================================================== */

const hemisphere =
    new THREE.HemisphereLight(
        0xd9efff,
        0x344d32,
        2.1
    );

scene.add(
    hemisphere
);


const sun =
    new THREE.DirectionalLight(
        0xfff4dc,
        3.2
    );

sun.position.set(
    140,
    220,
    110
);

sun.castShadow =
    true;

sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;

sun.shadow.camera.left =
    -350;

sun.shadow.camera.right =
    350;

sun.shadow.camera.top =
    350;

sun.shadow.camera.bottom =
    -350;

sun.shadow.bias =
    -0.0004;

scene.add(
    sun
);


/* =====================================================
   ЗЕМЛЯ
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            2200,
            2200
        ),

        new THREE.MeshStandardMaterial({
            color:0x527848,
            roughness:.95
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow =
    true;

scene.add(
    ground
);


/* =====================================================
   МАТЕРИАЛЫ
===================================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x303336,
        roughness:.92
    });

const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8b8e8d,
        roughness:.9
    });

const curbMaterial =
    new THREE.MeshStandardMaterial({
        color:0xb2b1a8,
        roughness:.8
    });

const whiteMaterial =
    new THREE.MeshStandardMaterial({
        color:0xf2eee0,
        roughness:.7
    });


/* =====================================================
   ДОРОГА
===================================================== */

function createRoad(
    width,
    length,
    x,
    z,
    rotation=0
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),

            roadMaterial
        );

    road.position.set(
        x,
        .06,
        z
    );

    road.rotation.y =
        rotation;

    road.receiveShadow =
        true;

    scene.add(
        road
    );


    /* тротуары */

    const sideOffset =
        width/2 + 4;


    for(
        const side of [-1,1]
    ){

        const sidewalk =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    7,
                    .22,
                    length
                ),

                sidewalkMaterial
            );

        sidewalk.position.set(
            x +
            Math.cos(rotation) *
            sideOffset *
            side,

            .13,

            z +
            Math.sin(rotation) *
            sideOffset *
            side
        );

        sidewalk.rotation.y =
            rotation;

        sidewalk.receiveShadow =
            true;

        scene.add(
            sidewalk
        );


        const curb =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .55,
                    .35,
                    length
                ),

                curbMaterial
            );

        curb.position.set(
            x +
            Math.cos(rotation) *
            (width/2 + .3) *
            side,

            .18,

            z +
            Math.sin(rotation) *
            (width/2 + .3) *
            side
        );

        curb.rotation.y =
            rotation;

        scene.add(
            curb
        );
    }
}


/* главные улицы */

createRoad(
    42,
    1400,
    0,
    0
);

createRoad(
    42,
    1400,
    0,
    0,
    Math.PI/2
);


/* боковые улицы */

createRoad(
    25,
    1050,
    -190,
    0
);

createRoad(
    25,
    1050,
    190,
    0
);

createRoad(
    25,
    1050,
    0,
    -190,
    Math.PI/2
);

createRoad(
    25,
    1050,
    0,
    190,
    Math.PI/2
);


/* =====================================================
   РАЗМЕТКА
===================================================== */

function createLaneMarks(){

    for(
        let i=-650;
        i<650;
        i+=18
    ){

        const mark =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .28,
                    .14,
                    8
                ),

                whiteMaterial
            );

        mark.position.set(
            0,
            .14,
            i
        );

        scene.add(
            mark
        );
    }


    for(
        let i=-650;
        i<650;
        i+=18
    ){

        const mark =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    8,
                    .14,
                    .28
                ),

                whiteMaterial
            );

        mark.position.set(
            i,
            .14,
            0
        );

        scene.add(
            mark
        );
    }
}

createLaneMarks();


/* =====================================================
   ЗДАНИЯ
===================================================== */

const buildingColors=[
    0xb8a98e,
    0xc6c8c4,
    0xaeb5b5,
    0xc39c7d,
    0xb3aea3,
    0x9ea7aa
];


function createWindow(
    x,
    y,
    z,
    rotation
){

    const windowMesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.6,
                3.4,
                .12
            ),

            new THREE.MeshStandardMaterial({
                color:0x263e50,
                roughness:.35,
                metalness:.15
            })
        );

    windowMesh.position.set(
        x,
        y,
        z
    );

    windowMesh.rotation.y =
        rotation;

    scene.add(
        windowMesh
    );
}


function createBuilding(
    x,
    z
){

    const width =
        45 +
        Math.random()*28;

    const depth =
        42 +
        Math.random()*25;

    const height =
        18 +
        Math.random()*42;


    const material =
        new THREE.MeshStandardMaterial({
            color:
                buildingColors[
                    Math.floor(
                        Math.random()*
                        buildingColors.length
                    )
                ],
            roughness:.82
        });


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow =
        true;

    building.receiveShadow =
        true;

    scene.add(
        building
    );


    /* крыша */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+1.5,
                .7,
                depth+1.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x55585a,
                roughness:.9
            })
        );

    roof.position.set(
        x,
        height+.35,
        z
    );

    roof.castShadow =
        true;

    scene.add(
        roof
    );


    /* окна на передней стороне */

    const columns =
        Math.max(
            2,
            Math.floor(
                width/9
            )
        );

    const rows =
        Math.max(
            2,
            Math.floor(
                height/8
            )
        );


    for(
        let col=0;
        col<columns;
        col++
    ){

        for(
            let row=0;
            row<rows;
            row++
        ){

            if(
                Math.random()<.12
            )
                continue;


            const wx =
                x -
                width/2 +
                5 +
                col *
                ((width-10)/
                Math.max(1,columns-1));


            const wy =
                6 +
                row*7;


            if(wy>height-4)
                continue;


            createWindow(
                wx,
                wy,
                z-depth/2-.08,
                0
            );
        }
    }
}


/* кварталы */

for(
    let x=-480;
    x<=480;
    x+=90
){

    for(
        let z=-480;
        z<=480;
        z+=90
    ){

        if(
            Math.abs(x)<65 ||

        createBuilding(

        );

/* =====================================================
   ДЕРЕВЬЯ
===================================================== */

function createTree(
    x,
    z,
    scale=1
){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .65*scale,
                .9*scale,
                6*scale,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x654329
            })
        );

    trunk.position.set(
        x,
        3*scale,
        z
    );

    trunk.castShadow=true;

    scene.add(
        trunk

    const crown =

                4.7*scale,
                1
            ),

            new THREE.MeshStandardMaterial({
                color:0x2d6a3c,
                roughness:.9
            })

    crown.position.set(

        z

for(
    let i=0;
    i<130;
    i++
){

    const x =
        (Math.random()-.5)*1100;

    const z =

    if(
        Math.abs(x)<55 &&
        Math.abs(z)<55
    )

        x,

/* =====================================================
   ФОНАРИ
===================================================== */

function createLamp(
    x,
    z
){

    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .12,
                .16,
                7,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x34383a,
                metalness:.7,
                roughness:.4
            })
        );

    pole.position.set(
        x,
        3.5,

    );

    scene.add(

    );

            ),

        );

        x+1,

    );

    scene.add(

    );


    const lamp =
        new THREE.Mesh(

            new THREE.SphereGeometry(

for(
    let z=-600;
    z<=600;
    z+=55
){

    createLamp(
        -27,
        z
    );

    createLamp(

        z
    );

/* =====================================================
   REAL HUMAN PLAYER — GLB CHARACTER
===================================================== */

const player = new THREE.Group();
scene.add(player);

player.position.set(0, 0, 80);

/* модель */
let characterModel = null;

/* анимация */
let characterMixer = null;
let idleAction = null;
let walkAction = null;
let runAction = null;
let activeAction = null;

/* загрузчик */
const characterLoader = new GLTFLoader();

/*
   Реальный humanoid персонаж.
   GLB содержит:
   - тело
   - скелет
   - материалы
   - текстуры
   - idle
   - walk
   - run
*/
characterLoader.load(
    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    function(gltf){

        characterModel = gltf.scene;

        /* -------------------------
           НАСТРОЙКА МОДЕЛИ
        ------------------------- */

        characterModel.position.set(0, 0, 0);

        /*
           Персонажи char-kit имеют
           метровую систему координат.
        */
        characterModel.scale.setScalar(1.8);

        characterModel.traverse(function(object){

            if(object.isMesh){

                object.castShadow = true;
                object.receiveShadow = true;

                /*
                   На мобильном браузере
                   сохраняем нормальную
                   производительность.
                */
                if(object.material){

                    object.material.needsUpdate = true;

                    if("roughness" in object.material){
                        object.material.roughness = 0.78;
                    }

                    if("metalness" in object.material){
                        object.material.metalness = 0.02;
                    }
                }
            }
        });

        player.add(characterModel);

        /* -------------------------
           ANIMATION MIXER
        ------------------------- */

        characterMixer =
            new THREE.AnimationMixer(characterModel);

        /*
           Ищем анимации независимо
           от регистра имени.
        */
        function findAnimation(names){

            for(const name of names){

                const clip =
                    gltf.animations.find(
                        animation =>
                            animation.name.toLowerCase() ===
                            name.toLowerCase()
                    );

                if(clip){
                    return clip;
                }
            }

            return null;
        }

        const idleClip =
            findAnimation([
                "idle",
                "Idle"
            ]);

        const walkClip =
            findAnimation([
                "walk",
                "walking",
                "Walk",
                "Walking"
            ]);

        const runClip =
            findAnimation([
                "run",
                "running",
                "Run",
                "Running"
            ]);

        if(idleClip){
            idleAction =
                characterMixer.clipAction(idleClip);

            idleAction.loop =
                THREE.LoopRepeat;

            idleAction.play();

            activeAction =
                idleAction;
        }

        if(walkClip){

            walkAction =
                characterMixer.clipAction(walkClip);

            walkAction.loop =
                THREE.LoopRepeat;
        }

        if(runClip){

            runAction =
                characterMixer.clipAction(runClip);

            runAction.loop =
                THREE.LoopRepeat;
        }

        console.log(
            "ЧЕЛОВЕК ЗАГРУЖЕН",
            gltf.animations.map(a => a.name)
        );

        console.log(
            "Idle:",
            !!idleClip,
            "Walk:",
            !!walkClip,
            "Run:",
            !!runClip
        );
    },

    function(progress){

        if(progress.total){

            console.log(
                "Загрузка персонажа:",
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                ) + "%"
            );
        }
    },

    function(error){

        console.error(
            "ОШИБКА ЗАГРУЗКИ ПЕРСОНАЖА:",
            error
        );
    }
);


/* =====================================================
   ПЕРЕКЛЮЧЕНИЕ АНИМАЦИЙ
===================================================== */

function playCharacterAnimation(action){

    if(!action) return;

    if(activeAction === action) return;

    const previousAction =
        activeAction;

    activeAction =
        action;

    action.reset();
    action.enabled = true;
    action.setEffectiveTimeScale(1);
    action.setEffectiveWeight(1);

    if(previousAction){

        action.crossFadeFrom(
            previousAction,
            0.18,
            true
        );
    }

    action.play();
}


/* =====================================================
   АНИМАЦИЯ ПЕРСОНАЖА
===================================================== */

function updateCharacterAnimation(
    delta,
    moving,
    running
){

    if(!characterMixer)
        return;

    characterMixer.update(delta);

    if(running && runAction){

        playCharacterAnimation(
            runAction
        );

    }else if(moving && walkAction){

        playCharacterAnimation(
            walkAction
        );

    }else if(idleAction){

        playCharacterAnimation(
            idleAction
        );
    }
}


/* =====================================================
   УПРАВЛЕНИЕ
===================================================== */

const controls = {

    forward:false,
    back:false,
    left:false,
    right:false

};


function bindButton(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            controls[key]=true;
        }
    );


    const release=()=>{

        controls[key]=false;
    };


    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}


bindButton(
    "forward",
    "forward"
);

bindButton(
    "back",
    "back"
);

bindButton(
    "left",
    "left"
);

bindButton(
    "right",
    "right"
);


/* =====================================================
   КЛАВИАТУРА
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            controls.forward=true;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            controls.back=true;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            controls.left=true;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            controls.right=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            controls.forward=false;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            controls.back=false;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            controls.left=false;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            controls.right=false;
    }
);


/* =====================================================
   КАМЕРА
===================================================== */

let yaw=0;

let pitch=.42;

let distance=7;


const cameraZone =
    document.getElementById(
        "camera"
    );


let dragging=false;

let lastX=0;

let lastY=0;


cameraZone.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

        cameraZone.setPointerCapture(
            e.pointerId
        );
    }
);


cameraZone.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;


        yaw -=
            dx*.008;


        pitch +=
            dy*.006;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.05
            );


        lastX=e.clientX;
        lastY=e.clientY;
    }
);


cameraZone.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


cameraZone.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =====================================================
   АНИМАЦИЯ
===================================================== */

const clock =
    new THREE.Clock();


let walkTime=0;

/* =====================================================
   ОБНОВЛЕНИЕ ИГРЫ
===================================================== */

function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    let forward =
        (controls.forward ? 1 : 0) -
        (controls.back ? 1 : 0);

    let side =
        (controls.left ? 1 : 0) -
        (controls.right ? 1 : 0);

    const length =
        Math.hypot(
            forward,
            side
        );

    const moving =
        length > 0;

    if(moving){

        forward /= length;
        side /= length;

        const speed =
            22 * delta;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const moveX =
            sin * forward +
            cos * side;

        const moveZ =
            cos * forward -
            sin * side;

        player.position.x +=
            moveX * speed;

        player.position.z +=
            moveZ * speed;

        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );

        walkTime +=
            delta * 10;
    }

    /* персонаж */

    updateCharacterAnimation(
        delta,
        moving,
        false
    );


    /* =================================================
       КАМЕРА
    ================================================= */

    const horizontal =
        Math.cos(pitch) *
        distance;

    const vertical =
        Math.sin(pitch) *
        distance;

    const target =
    new THREE.Vector3(
        player.position.x,
        2.4,
        player.position.z
    );

    const wanted =
        new THREE.Vector3(

            player.position.x -
            Math.sin(yaw) *
            horizontal,

            player.position.y +
            vertical,

            player.position.z -
            Math.cos(yaw) *
            horizontal
        );

    camera.position.lerp(
        wanted,
        .12
    );

    camera.lookAt(
        target
    );
}


/* =====================================================
   ЗАПУСК
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
