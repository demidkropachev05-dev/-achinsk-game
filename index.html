<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#202b32;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#182127;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    font-size:21px;
}

@media(orientation:portrait){
    #rotate{
        display:flex;
    }
    #gameUI{
        display:none;
    }
}

#gameUI{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:12px;
    left:15px;
    color:white;
    font-size:13px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:20px;
    width:132px;
    height:132px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.28);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.3);
    border:2px solid rgba(255,255,255,.5);
}

.button{
    position:absolute;
    pointer-events:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:11px;
    font-weight:bold;
    background:rgba(15,20,24,.65);
    border:1px solid rgba(255,255,255,.3);
}

#jump{
    width:72px;
    height:72px;
    right:22px;
    bottom:22px;
}

#run{
    width:57px;
    height:57px;
    right:112px;
    bottom:30px;
}

#run.active{
    background:rgba(40,120,65,.8);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
    <div style="font-size:45px">↻</div>
    <div>Поверни телефон<br>горизонтально</div>
</div>

<div id="gameUI">

    <div id="title">
        АЧИНСК 3D
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="run" class="button">
        БЕГ
    </div>

    <div id="jump" class="button">
        ПРЫЖОК
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(
        devicePixelRatio||1,
        2
    );

    canvas.width=
        Math.floor(W*DPR);

    canvas.height=
        Math.floor(H*DPR);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

resize();

addEventListener(
    "resize",
    resize
);


/* =========================================================
   КАРТА ГОРОДА
=========================================================

   # = здание
   . = дорога/земля
   T = дерево
*/

const MAP=[
"########################",
"#......................#",
"#..####.....####.......#",
"#..#..#.....#..#...T...#",
"#..#..#.....#..#.......#",
"#..####.....####.......#",
"#......................#",
"#......####............#",
"#......#..#............#",
"#......#..#.....####...#",
"#......####.....#..#...#",
"#...............#..#...#",
"#..T............####...#",
"#......................#",
"#....####..............#",
"#....#..#..............#",
"#....#..#........T.....#",
"#....####..............#",
"#......................#",
"#......####.....####...#",
"#......#..#.....#..#...#",
"#......#..#.....#..#...#",
"#......####.....####...#",
"########################"
];

const MAP_W=24;
const MAP_H=24;

const CELL=10;


/* =========================================================
   ОБЪЕКТЫ
========================================================= */

const objects=[];

for(let y=0;y<MAP_H;y++){

    for(let x=0;x<MAP_W;x++){

        const c=MAP[y][x];

        if(c==="#"){

            objects.push({
                x:x,
                y:y,
                type:"building",
                color:
                    ((x+y)%3===0)
                    ? "#77746e"
                    : ((x+y)%3===1)
                    ? "#8d877f"
                    : "#696d70"
            });
        }

        if(c==="T"){

            objects.push({
                x:x,
                y:y,
                type:"tree"
            });
        }
    }
}


/* =========================================================
   ИГРОК
========================================================= */

const player={

    x:3.5,
    y:12,

    angle:0,

    height:1.7,

    jump:0,
    jumpVelocity:0,

    grounded:true
};


/* =========================================================
   КАМЕРА
========================================================= */

const FOV=
    Math.PI/3;

const NUM_RAYS=420;

const MAX_DISTANCE=80;

const projectionScale=
    1/Math.tan(FOV/2);


/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */

let joyX=0;
let joyY=0;

let running=false;

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


function joystickMove(
    px,
    py
){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=
        px-cx;

    let dy=
        py-cy;

    const max=
        r.width*.33;

    const len=
        Math.hypot(dx,dy);

    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}


function joystickReset(){

    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(e.buttons)
            joystickMove(
                e.clientX,
                e.clientY
            );
    }
);

joystick.addEventListener(
    "pointerup",
    joystickReset
);

joystick.addEventListener(
    "pointercancel",
    joystickReset
);


/* =========================================================
   БЕГ
========================================================= */

const runButton=
    document.getElementById(
        "run"
    );

runButton.addEventListener(
    "pointerdown",
    ()=>{
        running=true;
        runButton.classList.add(
            "active"
        );
    }
);

function stopRunning(){

    running=false;

    runButton.classList.remove(
        "active"
    );
}

runButton.addEventListener(
    "pointerup",
    stopRunning
);

runButton.addEventListener(
    "pointercancel",
    stopRunning
);


/* =========================================================
   ПРЫЖОК
========================================================= */

document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    ()=>{

        if(player.grounded){

            player.jumpVelocity=
                5.8;

            player.grounded=false;
        }
    }
);


/* =========================================================
   ПОВОРОТ КАМЕРЫ
========================================================= */

let looking=false;
let lastLookX=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        looking=true;

        lastLookX=
            e.clientX;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(!looking)
            return;

        const dx=
            e.clientX-lastLookX;

        lastLookX=
            e.clientX;

        player.angle+=
            dx*.004;
    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{
        looking=false;
    }
);

canvas.addEventListener(
    "pointercancel",
    ()=>{
        looking=false;
    }
);


/* =========================================================
   КОЛЛИЗИЯ
========================================================= */

function solid(
    x,
    y
){

    if(
        x<0 ||
        y<0 ||
        x>=MAP_W ||
        y>=MAP_H
    )
        return true;

    return MAP[
        Math.floor(y)
    ][
        Math.floor(x)
    ]==="#";
}


function canMove(
    x,
    y
){

    const r=.22;

    return !(
        solid(x-r,y-r) ||
        solid(x+r,y-r) ||
        solid(x-r,y+r) ||
        solid(x+r,y+r)
    );
}


/* =========================================================
   RAYCAST
========================================================= */

function castRay(angle){

    const sin=
        Math.sin(angle);

    const cos=
        Math.cos(angle);

    let x=
        player.x;

    let y=
        player.y;

    let distance=0;

    const step=.055;

    while(
        distance<
        MAX_DISTANCE
    ){

        x+=cos*step;
        y+=sin*step;

        distance+=step;

        if(solid(x,y)){

            return {
                distance,
                x,
                y
            };
        }
    }

    return {
        distance:MAX_DISTANCE,
        x,
        y
    };
}


/* =========================================================
   НЕБО И ЗЕМЛЯ
========================================================= */

function drawSky(){

    const sky=
        ctx.createLinearGradient(
            0,0,
            0,H*.58
        );

    sky.addColorStop(
        0,
        "#4f6878"
    );

    sky.addColorStop(
        .55,
        "#91a2aa"
    );

    sky.addColorStop(
        1,
        "#c2c0b3"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H*.58
    );


    const ground=
        ctx.createLinearGradient(
            0,H*.48,
            0,H
        );

    ground.addColorStop(
        0,
        "#59615b"
    );

    ground.addColorStop(
        1,
        "#272b29"
    );

    ctx.fillStyle=ground;

    ctx.fillRect(
        0,
        H*.48,
        W,
        H*.52
    );
}


/* =========================================================
   РИСОВАНИЕ СТЕН
========================================================= */

function drawWalls(){

    const step=
        W/NUM_RAYS;

    const wallDepth=[];

    for(
        let ray=0;
        ray<NUM_RAYS;
        ray++
    ){

        const cameraX=
            ray/NUM_RAYS-.5;

        const rayAngle=
            player.angle+
            cameraX*FOV;

        const hit=
            castRay(rayAngle);

        let dist=
            hit.distance;

        /* устраняем fish-eye */

        dist*=
            Math.cos(
                rayAngle-player.angle
            );

        wallDepth[ray]=dist;

        const wallHeight=
            H/
            Math.max(
                .01,
                dist
            )*
            .92;


        const top=
            H*.5-
            wallHeight*
            (
                .48+
                player.jump*.08
            );


        const bottom=
            H*.5+
            wallHeight*
            (
                .52+
                player.jump*.08
            );


        let shade=
            1-
            dist/70;


        shade=
            Math.max(
                .25,
                Math.min(
                    1,
                    shade
                )
            );


        const mapX=
            Math.floor(hit.x);

        const mapY=
            Math.floor(hit.y);


        const obj=
            objects.find(
                o=>
                    o.x===mapX &&
                    o.y===mapY
            );


        let base=
            obj
            ? obj.color
            : "#777";


        if(
            hit.x-
            Math.floor(hit.x)
            <.04 ||
            hit.y-
            Math.floor(hit.y)
            <.04
        ){

            shade*=.82;
        }


        ctx.fillStyle=
            darken(
                base,
                shade
            );


        ctx.fillRect(
            ray*step,
            top,
            step+1,
            bottom-top
        );


        /* этажные линии */

        if(
            obj &&
            obj.type==="building"
        ){

            const floors=
                Math.max(
                    2,
                    Math.min(
                        6,
                        2+
                        ((mapX*7+
                          mapY*3)%5)
                    )
                );


            for(
                let f=1;
                f<floors;
                f++
            ){

                const yy=
                    top+
                    (bottom-top)*
                    f/floors;


                ctx.fillStyle=
                    "rgba(35,38,38,.2)";

                ctx.fillRect(
                    ray*step,
                    yy,
                    step+1,
                    1
                );
            }
        }
    }

    return wallDepth;
}


/* =========================================================
   ЦВЕТ
========================================================= */

function darken(
    hex,
    amount
){

    let c=
        hex.replace("#","");

    let r=
        parseInt(
            c.substring(0,2),
            16
        );

    let g=
        parseInt(
            c.substring(2,4),
            16
        );

    let b=
        parseInt(
            c.substring(4,6),
            16
        );

    r=Math.floor(r*amount);
    g=Math.floor(g*amount);
    b=Math.floor(b*amount);

    return `rgb(${r},${g},${b})`;
}


/* =========================================================
   ОКНА
========================================================= */

function drawWindows(){

    for(
        const o of objects
    ){

        if(
            o.type!=="building"
        )
            continue;

        const dx=
            o.x+.5-player.x;

        const dy=
            o.y+.5-player.y;

        const dist=
            Math.hypot(dx,dy);

        if(dist>24)
            continue;

        let angle=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;

        while(
            angle<-Math.PI
        )
            angle+=Math.PI*2;

        while(
            angle>Math.PI
        )
            angle-=Math.PI*2;

        if(
            Math.abs(angle)>
            FOV*.6
        )
            continue;

        const screenX=
            W/2+
            angle/FOV*W;

        const scale=
            H/(dist*8);

        const floors=
            3+
            ((o.x+
              o.y)%3);

        const cols=3;


        for(
            let f=0;
            f<floors;
            f++
        ){

            for(
                let c=0;
                c<cols;
                c++
            ){

                const wx=
                    screenX+
                    (c-1)*
                    scale*2.2;

                const wy=
                    H*.52-
                    f*
                    scale*2.7-
                    scale*2;


                const size=
                    Math.max(
                        2,
                        scale*1.35
                    );


                ctx.fillStyle=
                    (
                        (f+c+
                         Math.floor(o.x))
                        %4===0
                    )
                    ? "#d6bd72"
                    : "#405766";


                ctx.fillRect(
                    wx-size/2,
                    wy-size/2,
                    size,
                    size*1.2
                );
            }
        }
    }
}


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

function drawTrees(){

    for(
        const o of objects
    ){

        if(
            o.type!=="tree"
        )
            continue;

        const dx=
            o.x+.5-player.x;

        const dy=
            o.y+.5-player.y;

        const dist=
            Math.hypot(dx,dy);

        if(dist>35)
            continue;

        let angle=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;

        while(
            angle<-Math.PI
        )
            angle+=Math.PI*2;

        while(
            angle>Math.PI
        )
            angle-=Math.PI*2;

        if(
            Math.abs(angle)>
            FOV*.65
        )
            continue;

        const sx=
            W/2+
            angle/FOV*W;

        const size=
            H/(dist*1.8);


        const ground=
            H*.54+
            player.jump*8;


        /* ствол */

        ctx.fillStyle=
            "#4a3525";

        ctx.fillRect(
            sx-size*.09,
            ground-size*.62,
            size*.18,
            size*.62
        );


        /* крона */

        ctx.fillStyle=
            "#294e31";

        ctx.beginPath();

        ctx.arc(
            sx,
            ground-size*.7,
            size*.35,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle=
            "#37643b";

        ctx.beginPath();

        ctx.arc(
            sx-size*.16,
            ground-size*.82,
            size*.23,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* =========================================================
   ДОРОГА
========================================================= */

function drawRoadDetails(){

    const horizon=
        H*.5;

    ctx.strokeStyle=
        "rgba(225,220,195,.75)";

    ctx.lineWidth=2;


    for(
        let i=-8;
        i<=8;
        i++
    ){

        const x=
            W/2+
            i*W/9;

        ctx.beginPath();

        ctx.moveTo(
            W/2,
            horizon
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }
}


/* =========================================================
   МАШИНЫ
========================================================= */

function drawCars(){

    const cars=[
        {
            x:8.5,
            y:12.4,
            color:"#9b3936"
        },
        {
            x:14.2,
            y:12.7,
            color:"#34516b"
        }
    ];


    for(
        const car of cars
    ){

        const dx=
            car.x-player.x;

        const dy=
            car.y-player.y;

        const dist=
            Math.hypot(dx,dy);

        if(dist>30)
            continue;

        let a=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;

        while(a<-Math.PI)
            a+=Math.PI*2;

        while(a>Math.PI)
            a-=Math.PI*2;

        if(
            Math.abs(a)>
            FOV*.55
        )
            continue;

        const sx=
            W/2+
            a/FOV*W;

        const size=
            H/(dist*1.5);

        const ground=
            H*.57;


        ctx.fillStyle=
            car.color;

        ctx.fillRect(
            sx-size*.5,
            ground-size*.32,
            size,
            size*.3
        );

        ctx.fillStyle=
            "#202a2f";

        ctx.fillRect(
            sx-size*.32,
            ground-size*.5,
            size*.64,
            size*.2
        );
    }
}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

function drawPlayer(){

    /*
       Персонаж находится снизу экрана.
       Это временная модель.
       Дальше заменим её на полноценную
       3D-модель человека.
    */

    const bob=
        Math.sin(
            performance.now()/100
        )*
        (
            Math.abs(joyX)+
            Math.abs(joyY)
        )*
        2;


    const cx=
        W/2;

    const ground=
        H*.94+
        bob+
        player.jump*18;

    const s=
        Math.min(
            W,H
        )/500;


    /* тень */

    ctx.fillStyle=
        "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        ground,
        38*s,
        10*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ноги */

    ctx.fillStyle=
        "#1d2329";

    ctx.fillRect(
        cx-19*s,
        ground-75*s,
        15*s,
        72*s
    );

    ctx.fillRect(
        cx+4*s,
        ground-75*s,
        15*s,
        72*s
    );


    /* корпус */

    ctx.fillStyle=
        "#303942";

    ctx.fillRect(
        cx-30*s,
        ground-155*s,
        60*s,
        83*s
    );


    /* руки */

    ctx.fillStyle=
        "#303942";

    ctx.fillRect(
        cx-43*s,
        ground-148*s,
        13*s,
        67*s
    );

    ctx.fillRect(
        cx+30*s,
        ground-148*s,
        13*s,
        67*s
    );


    /* шея */

    ctx.fillStyle=
        "#bd8569";

    ctx.fillRect(
        cx-8*s,
        ground-174*s,
        16*s,
        24*s
    );


    /* голова */

    ctx.beginPath();

    ctx.arc(
        cx,
        ground-198*s,
        29*s,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#c58b6e";

    ctx.fill();


    /* волосы */

    ctx.beginPath();

    ctx.arc(
        cx,
        ground-210*s,
        29*s,
        Math.PI,
        Math.PI*2
    );

    ctx.fillStyle=
        "#24201d";

    ctx.fill();


    /* шов куртки */

    ctx.strokeStyle=
        "rgba(255,255,255,.12)";

    ctx.lineWidth=
        2*s;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        ground-153*s
    );

    ctx.lineTo(
        cx,
        ground-76*s
    );

    ctx.stroke();
}


/* =========================================================
   ПРИЦЕЛ / ЦЕНТР
========================================================= */

function drawCrosshair(){

    ctx.strokeStyle=
        "rgba(255,255,255,.3)";

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
        W/2-5,
        H/2
    );

    ctx.lineTo(
        W/2+5,
        H/2
    );

    ctx.moveTo(
        W/2,
        H/2-5
    );

    ctx.lineTo(
        W/2,
        H/2+5
    );

    ctx.stroke();
}


/* =========================================================
   ИГРОВОЙ ЦИКЛ
========================================================= */

let previous=
    performance.now();


function update(){

    const now=
        performance.now();

    const dt=
        Math.min(
            .05,
            (now-previous)/1000
        );

    previous=now;


    let x=
        joyX;

    let y=
        -joyY;


    const length=
        Math.hypot(x,y);

    if(length>1){

        x/=length;
        y/=length;
    }


    const speed=
        running
        ? 4.7
        : 2.7;


    const moveX=
        (
            Math.cos(
                player.angle
            )*x+
            Math.cos(
                player.angle+
                Math.PI/2
            )*y
        )*
        speed*
        dt;


    const moveY=
        (
            Math.sin(
                player.angle
            )*x+
            Math.sin(
                player.angle+
                Math.PI/2
            )*y
        )*
        speed*
        dt;


    const nx=
        player.x+
        moveX;

    const ny=
        player.y+
        moveY;


    if(canMove(nx,player.y))
        player.x=nx;

    if(canMove(player.x,ny))
        player.y=ny;


    /* прыжок */

    if(!player.grounded){

        player.jump+=
            player.jumpVelocity*
            dt;

        player.jumpVelocity-=
            15*
            dt;

        if(player.jump<=0){

            player.jump=0;

            player.jumpVelocity=0;

            player.grounded=true;
        }
    }
}


function render(){

    drawSky();

    drawWalls();

    drawRoadDetails();

    drawWindows();

    drawTrees();

    drawCars();

    drawPlayer();

    drawCrosshair();
}


function loop(){

    update();

    render();

    requestAnimationFrame(
        loop
    );
}

loop();

</script>

</body>
</html>
