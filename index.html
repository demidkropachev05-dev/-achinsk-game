<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>АЧИНСК 3D — Реальный район</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#172330;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    color:#fff;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
}

#subtitle{
    position:absolute;
    top:45px;
    left:max(15px,env(safe-area-inset-left));
    color:#dce8ee;
    font-size:11px;
    text-shadow:0 2px 5px rgba(0,0,0,.9);
}

#joystick{
    position:absolute;
    left:max(22px,env(safe-area-inset-left));
    bottom:max(22px,env(safe-area-inset-bottom));
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(8,13,18,.38);
    border:2px solid rgba(255,255,255,.20);
    box-shadow:
        0 8px 25px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.1);
    pointer-events:auto;
    touch-action:none;
    z-index:20;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:68px;
    height:68px;
    margin-left:-34px;
    margin-top:-34px;
    border-radius:50%;
    background:rgba(14,20,27,.88);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:
        0 5px 18px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.12);
    pointer-events:none;
    will-change:transform;
}

#jump{
    position:absolute;
    right:max(40px,calc(env(safe-area-inset-right) + 40px));
    bottom:max(38px,calc(env(safe-area-inset-bottom) + 38px));
    width:72px;
    height:72px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:900;
    background:rgba(8,13,18,.86);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    pointer-events:auto;
    user-select:none;
    touch-action:none;
    z-index:30;
}

#jump:active{
    transform:scale(.92);
}

#orientation{
    position:absolute;
    right:15px;
    top:15px;
    padding:7px 10px;
    border-radius:10px;
    color:#fff;
    font-size:10px;
    background:rgba(0,0,0,.28);
    text-shadow:0 1px 4px #000;
}

@media(max-width:700px) and (orientation:portrait){
    #orientation{
        background:rgba(120,70,0,.75);
    }
    #orientation::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe08a;
    }
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">АЧИНСК</div>

    <div id="subtitle">

    </div>

    <div id="orientation">
        LANDSCAPE
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

</div>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   ОШИБКИ
========================================================= */

window.addEventListener("error",function(e){

    console.error(e.error || e.message);

});


/* =========================================================
   СЦЕНА
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x253746);

scene.fog=new THREE.FogExp2(
    0x334553,
    0.0019
);


/* =========================================================
   КАМЕРА
========================================================= */

const camera=new THREE.PerspectiveCamera(
    62,
    innerWidth/innerHeight,
    .1,
    1600
);


/* =========================================================
   RENDERER
========================================================= */

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.7)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.82;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   ВЕЧЕРНИЙ СВЕТ
========================================================= */

const skyLight=
    new THREE.HemisphereLight(
        0x91a9c2,
        0x11191b,
        1.15
    );

scene.add(skyLight);


const sunset=
    new THREE.DirectionalLight(
        0xff9a62,
        2.0
    );

sunset.position.set(
    -220,
    100,
    260
);

sunset.castShadow=true;

sunset.shadow.mapSize.width=1536;
sunset.shadow.mapSize.height=1536;

sunset.shadow.camera.left=-500;
sunset.shadow.camera.right=500;
sunset.shadow.camera.top=500;
sunset.shadow.camera.bottom=-500;

sunset.shadow.bias=-.0005;

scene.add(sunset);


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const groundMaterial=
    new THREE.MeshStandardMaterial({
        color:0x46523f,
        roughness:.98
    });

const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1800,
            1800
        ),
        groundMaterial
    );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const roadMaterial=
    new THREE.MeshStandardMaterial({
        color:0x24282b,
        roughness:.94
    });

const sidewalkMaterial=
    new THREE.MeshStandardMaterial({
        color:0x777b79,
        roughness:.9
    });

const curbMaterial=
    new THREE.MeshStandardMaterial({
        color:0xa8aaa3,
        roughness:.82
    });

const asphaltDark=
    new THREE.MeshStandardMaterial({
        color:0x191d1f,
        roughness:.97
    });

const lineMaterial=
    new THREE.MeshStandardMaterial({
        color:0xd9d7c7,
        roughness:.8
    });


/* =========================================================
   ДОРОГИ
========================================================= */

const roadData=[];

function createRoad(
    name,
    width,
    length,
    x,
    z,
    rotation=0
){

    const road=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),
            roadMaterial
        );

    road.position.set(
        x,
        .06,
        z
    );

    road.rotation.y=rotation;

    road.receiveShadow=true;

    scene.add(road);


    const sidewalkWidth=4.5;

    const sideDistance=
        width/2+
        sidewalkWidth/2+
        .7;


    for(
        const side of [-1,1]
    ){

        const sx=
            x+
            Math.cos(rotation)*
            sideDistance*
            side;

        const sz=
            z+
            Math.sin(rotation)*
            sideDistance*
            side;


        const sidewalk=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    sidewalkWidth,
                    .18,
                    length
                ),
                sidewalkMaterial
            );

        sidewalk.position.set(
            sx,
            .09,
            sz
        );

        sidewalk.rotation.y=rotation;

        sidewalk.receiveShadow=true;

        scene.add(sidewalk);


        const curb=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .48,
                    .28,
                    length
                ),
                curbMaterial
            );

        curb.position.set(
            x+
            Math.cos(rotation)*
            (width/2+.22)*
            side,

            .14,

            z+
            Math.sin(rotation)*
            (width/2+.22)*
            side
        );

        curb.rotation.y=rotation;

        scene.add(curb);
    }


    roadData.push({
        name,
        width,
        length,
        x,
        z,
        rotation
    });
}


/*
    ОСНОВНЫЕ НАПРАВЛЕНИЯ
    5-й микрорайон / Лапенкова /
    Мира / Кравченко /
    Назарова / Свердлова
*/


createRoad(
    "Лапенкова",
    30,
    900,
    0,
    0
);

createRoad(
    "Мира",
    24,
    700,
    -180,
    0
);

createRoad(
    "Кравченко",
    24,
    720,
    180,
    0
);

createRoad(
    "Назарова",
    25,
    720,
    0,
    -185,
    Math.PI/2
);

createRoad(
    "Свердлова",
    25,
    720,
    0,
    185,
    Math.PI/2
);

createRoad(
    "Внутриквартальная",
    12,
    520,
    -90,
    0,
    Math.PI/2
);

createRoad(
    "Внутриквартальная 2",
    12,
    520,
    90,
    0,
    Math.PI/2
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function laneMarks(
    x,
    z,
    length,
    rotation
){

    for(
        let i=-length/2;
        i<length/2;
        i+=18
    ){

        const mark=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .13,
                    7
                ),
                lineMaterial
            );

        mark.position.set(
            x+
            Math.cos(rotation)*
            0,

            .14,

            z
        );

        if(rotation===0){

            mark.position.z+=i;

        }else{

            mark.position.x+=i;

        }

        mark.rotation.y=rotation;

        scene.add(mark);
    }
}


laneMarks(0,0,900,0);
laneMarks(-180,0,700,0);
laneMarks(180,0,720,0);

laneMarks(0,-185,720,Math.PI/2);
laneMarks(0,185,720,Math.PI/2);


/* =========================================================
   КОЛЛИЗИОННЫЕ ЗОНЫ
========================================================= */

const buildingColliders=[];


function addBuildingCollider(
    x,
    z,
    width,
    depth
){

    buildingColliders.push({
        minX:x-width/2,
        maxX:x+width/2,
        minZ:z-depth/2,
        maxZ:z+depth/2
    });
}


/* =========================================================
   ПРОВЕРКА — ДОРОГА
========================================================= */

function isOnRoad(
    x,
    z,
    padding=8
){

    for(
        const road of roadData
    ){

        const dx=x-road.x;
        const dz=z-road.z;

        const c=Math.cos(-road.rotation);
        const s=Math.sin(-road.rotation);

        const localX=
            dx*c-dz*s;

        const localZ=
            dx*s+dz*c;


        if(
            Math.abs(localX)<
            road.width/2+
            padding
            &&
            Math.abs(localZ)<
            road.length/2+
            padding
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   ЗДАНИЯ
========================================================= */

const buildingMaterials=[
    0x8f918f,
    0xa29d91,
    0xaaa69c,
    0x777e80,
    0xb1a18e,
    0x888f91,
    0x9b9689
];


function createWindow(
    parent,
    x,
    y,
    z,
    rotation,
    scaleX=1
){

    const frame=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.5*scaleX,
                3.8,
                .18
            ),
            new THREE.MeshStandardMaterial({
                color:0x202b32,
                roughness:.32,
                metalness:.12
            })
        );

    frame.position.set(
        x,
        y,
        z
    );

    frame.rotation.y=rotation;

    frame.castShadow=false;

    parent.add(frame);


    const glow=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.7*scaleX,
                3,
                .06
            ),
            new THREE.MeshStandardMaterial({
                color:0xd89b55,
                emissive:0x6c3510,
                emissiveIntensity:.45,
                roughness:.5
            })
        );

    glow.position.set(
        x,
        y,
        z-
        .1
    );

    glow.rotation.y=rotation;

    parent.add(glow);
}


function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    style=0
){

    /*
       Дополнительная защита:
       дом никогда не ставится
       на дорогу.
    */

    if(
        isOnRoad(
            x,
            z,
            Math.max(width,depth)/2+5
        )
    )
        return;


    const group=
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );


    const color=
        buildingMaterials[
            style%
            buildingMaterials.length
        ];


    const bodyMaterial=
        new THREE.MeshStandardMaterial({
            color,
            roughness:.84
        });


    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            bodyMaterial
        );

    body.position.y=
        height/2;

    body.castShadow=true;
    body.receiveShadow=true;

    group.add(body);


    /*
       Нижний цоколь
    */

    const base=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+.8,
                1.2,
                depth+.8
            ),
            new THREE.MeshStandardMaterial({
                color:0x5c6261,
                roughness:.9
            })
        );

    base.position.y=.6;

    base.castShadow=true;

    group.add(base);


    /*
       Верхняя архитектурная полоса
    */

    const top=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+1.2,
                .65,
                depth+1.2
            ),
            new THREE.MeshStandardMaterial({
                color:0x53595a,
                roughness:.85
            })
        );

    top.position.y=
        height+.32;

    top.castShadow=true;

    group.add(top);


    /*
       Балконы / вертикальные элементы
    */

    const columns=
        Math.max(
            3,
            Math.floor(width/7)
        );

    const rows=
        Math.max(
            2,
            Math.floor(height/7)
        );


    for(
        let col=0;
        col<columns;
        col++
    ){

        for(
            let row=0;
            row<rows;
            row++
        ){

            const px=
                -width/2+
                4+
                col*
                (
                    (width-8)/
                    Math.max(
                        1,
                        columns-1
                    )
                );

            const py=
                4.2+
                row*6.7;


            if(
                py>
                height-3
            )
                continue;


            /*
               Передняя сторона
            */

            createWindow(
                group,
                px,
                py,
                -depth/2-.11,
                0,
                1
            );


            /*
               Задняя сторона
            */

            if(
                row%2===0
            ){

                createWindow(
                    group,
                    px,
                    py,
                    depth/2+.11,
                    Math.PI,
                    1
                );
            }
        }
    }


    /*
       Боковые окна
    */

    const sideRows=
        Math.max(
            2,
            Math.floor(depth/9)
        );


    for(
        let row=0;
        row<sideRows;
        row++
    ){

        const pz=
            -depth/2+
            5+
            row*
            (
                (depth-10)/
                Math.max(
                    1,
                    sideRows-1
                )
            );


        if(
            width>38
        ){

            createWindow(
                group,
                -width/2-.11,
                5+row*7,
                pz,
                Math.PI/2,
                .8
            );

            createWindow(
                group,
                width/2+.11,
                5+row*7,
                pz,
                -Math.PI/2,
                .8
            );
        }
    }


    /*
       Подъезд
    */

    const entrance=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                Math.min(
                    height*.72,
                    18
                ),
                1.8
            ),
            new THREE.MeshStandardMaterial({
                color:0x55585a,
                roughness:.9
            })
        );

    entrance.position.set(
        0,
        Math.min(
            height*.36,
            9
        ),
        -depth/2-.9
    );

    group.add(entrance);


    /*
       Дверь
    */

    const door=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                3.2,
                .08
            ),
            new THREE.MeshStandardMaterial({
                color:0x1e2529,
                roughness:.4,
                metalness:.3
            })
        );

    door.position.set(
        0,
        1.7,
        -depth/2-1.85
    );

    group.add(door);


    /*
       Крыша
    */

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+2,
                .5,
                depth+2
            ),
            new THREE.MeshStandardMaterial({
                color:0x3c4244,
                roughness:.94
            })
        );

    roof.position.y=
        height+.65;

    roof.castShadow=true;

    group.add(roof);


    scene.add(group);


    /*
       Физический прямоугольник здания.
    */

    addBuildingCollider(
        x,
        z,
        width+2.4,
        depth+2.4
    );
}


/* =========================================================
   РЕАЛИСТИЧНАЯ СЕТКА КВАРТАЛОВ
========================================================= */

/*
   Здесь дома стоят ВНУТРИ кварталов,
   а не поверх дорог.
*/


const blocks=[
    {
        x:-105,
        z:-90,
        count:4
    },
    {
        x:105,
        z:-90,
        count:4
    },
    {
        x:-105,
        z:90,
        count:4
    },
    {
        x:105,
        z:90,
        count:4
    },

    {
        x:-285,
        z:-90,
        count:3
    },

    {
        x:285,
        z:90,
        count:3
    },

    {
        x:-285,
        z:250,
        count:3
    },

    {
        x:285,
        z:-250,
        count:3
    }
];


for(
    const block of blocks
){

    const offsets=[
        [-25,-24],
        [25,-24],
        [-25,24],
        [25,24]
    ];


    for(
        let i=0;
        i<block.count;
        i++
    ){

        const o=
            offsets[i];


        const w=
            28+
            Math.random()*8;

        const d=
            18+
            Math.random()*7;

        const h=
            24+
            Math.random()*17;


        createBuilding(
            block.x+o[0],
            block.z+o[1],
            w,
            d,
            h,
            i+
            Math.floor(
                block.x
            )
        );
    }
}


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

const trunkMaterial=
    new THREE.MeshStandardMaterial({
        color:0x493126,
        roughness:.95
    });

const leafMaterial=
    new THREE.MeshStandardMaterial({
        color:0x294d31,
        roughness:.92
    });

const leafLight=
    new THREE.MeshStandardMaterial({
        color:0x456f3e,
        roughness:.9
    });


function createTree(
    x,
    z,
    scale=1
){

    /*
       Не ставим дерево
       на дорогу.
    */

    if(
        isOnRoad(
            x,
            z,
            3
        )
    )
        return;


    const tree=
        new THREE.Group();

    tree.position.set(
        x,
        0,
        z
    );

    tree.scale.setScalar(
        scale
    );


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .28,
                .48,
                5.8,
                8
            ),
            trunkMaterial
        );

    trunk.position.y=2.9;

    trunk.castShadow=true;

    tree.add(trunk);


    const crownPositions=[
        [-1.5,6,0,1.8],
        [1.4,6.2,0,1.9],
        [0,7.3,0,2.2],
        [-.8,8.3,.3,1.7],
        [.9,8.2,-.3,1.7]
    ];


    for(
        const p of crownPositions
    ){

        const crown=
            new THREE.Mesh(
                new THREE.IcosahedronGeometry(
                    p[3],
                    1
                ),
                Math.random()<.45
                ?
                leafMaterial
                :
                leafLight
            );

        crown.position.set(
            p[0],
            p[1],
            p[2]
        );

        crown.scale.y=.9;

        crown.castShadow=true;

        tree.add(crown);
    }


    scene.add(tree);
}


/*
   Дворовые зелёные зоны
*/

const treeSpots=[
    [-65,-60],
    [-45,-45],
    [-25,-65],
    [-65,55],
    [-42,72],
    [-18,58],

    [65,-60],
    [45,-45],
    [25,-65],
    [65,55],
    [42,72],
    [18,58],

    [-270,-55],
    [-300,-45],
    [-270,55],
    [-300,70],

    [270,55],
    [300,45],
    [270,-55],
    [300,-70],

    [-250,240],
    [-300,245],
    [250,-240],
    [300,-245]
];


for(
    const p of treeSpots
){

    createTree(
        p[0],
        p[1],
        .85+
        Math.random()*.35
    );
}


/* =========================================================
   ФОНАРИ
========================================================= */

function createLamp(
    x,
    z
){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );


    const pole=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .11,
                .17,
                7,

/* =========================================================
   ПЕРСОНАЖ
========================================================= */

const player=
    new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    125
);


let characterModel=null;

let characterMixer=null;

let idleAction=null;
let walkAction=null;
let runAction=null;
let activeAction=null;


const loader=
    new GLTFLoader();


loader.load(

    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    function(gltf){

        characterModel=
            gltf.scene;

        characterModel.scale.setScalar(
            1.8
        );


        characterModel.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;
                    object.receiveShadow=true;
                }
            }
        );


        player.add(
            characterModel
        );


        characterMixer=
            new THREE.AnimationMixer(
                characterModel
            );


        function findAnimation(
            names
        ){

            for(
                const n of names
            ){

                const clip=
                    gltf.animations.find(
                        a=>
                        a.name.toLowerCase()===
                        n.toLowerCase()
                    );

                if(clip)
                    return clip;
            }

            return null;
        }


        const idleClip=
            findAnimation([
                "idle"
            ]);

        const walkClip=
            findAnimation([
                "walk",
                "walking"
            ]);

        const runClip=
            findAnimation([
                "run",
                "running"
            ]);


        if(idleClip){

            idleAction=
                characterMixer.clipAction(
                    idleClip
                );

            idleAction.play();

            activeAction=
                idleAction;
        }


        if(walkClip)
            walkAction=
                characterMixer.clipAction(
                    walkClip
                );


        if(runClip)
            runAction=
                characterMixer.clipAction(
                    runClip
                );
    },

    undefined,

    function(error){

        console.error(
            "Персонаж:",
            error
        );
    }
);


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function playAction(
    action
){

    if(
        !action ||
        activeAction===action
    )
        return;


    const previous=
        activeAction;

    activeAction=
        action;

    action.reset();
    action.enabled=true;
    action.setEffectiveWeight(1);


    if(previous){

        action.crossFadeFrom(
            previous,
            .16,
            true
        );
    }

    action.play();
}


function updateAnimation(
    delta,
    moving
){

    if(!characterMixer)
        return;


    characterMixer.update(delta);


    if(
        moving &&
        walkAction
    ){

        playAction(
            walkAction
        );

    }else if(
        idleAction
    ){

        playAction(
            idleAction
        );
    }
}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


let joystickPointerId=null;

let joystickX=0;
let joystickY=0;

const joystickRadius=55;


function updateJoystick(e){

    const rect=
        joystick.getBoundingClientRect();


    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;


    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;


    const len=
        Math.hypot(dx,dy);


    if(
        len>
        joystickRadius
    ){

        dx=
            dx/len*
            joystickRadius;

        dy=
            dy/len*
            joystickRadius;
    }


    joystickX=
        dx/
        joystickRadius;

    joystickY=
        dy/
        joystickRadius;


    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickPointerId=null;

    joystickX=0;
    joystickY=0;

    stick.style.transform=
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystickPointerId=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId!==
            joystickPointerId
        )
            return;

        e.preventDefault();

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            joystickPointerId
        )
            resetJoystick();
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


joystick.addEventListener(
    "lostpointercapture",
    resetJoystick
);


/* =========================================================
   ПРЫЖОК
========================================================= */

const jumpButton=
    document.getElementById(
        "jump"
    );

let verticalVelocity=0;

let isJumping=false;


function jump(){

    if(isJumping)
        return;

    isJumping=true;

    verticalVelocity=8.5;
}


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();

        jumpButton.setPointerCapture(
            e.pointerId
        );
    },
    {
        passive:false
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let yaw=0;

let pitch=.43;

let distance=7;

let cameraPointerId=null;

let cameraLastX=0;

let cameraLastY=0;


function isControl(
    target
){

    return(
        target===joystick ||
        joystick.contains(target) ||
        target===jumpButton ||
        jumpButton.contains(target)
    );
}


document.addEventListener(
    "pointerdown",
    function(e){

        if(
            isControl(e.target)
        )
            return;


        cameraPointerId=
            e.pointerId;

        cameraLastX=e.clientX;
        cameraLastY=e.clientY;
    },
    {
        capture:true
    }
);


document.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId!==
            cameraPointerId
        )
            return;


        const dx=
            e.clientX-
            cameraLastX;

        const dy=
            e.clientY-
            cameraLastY;


        yaw-=
            dx*.008;


        pitch+=
            dy*.006;


        pitch=
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.02
            );


        cameraLastX=
            e.clientX;

        cameraLastY=
            e.clientY;
    }
);


document.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        )
            cameraPointerId=null;
    }
);


/* =========================================================
   КОЛЛИЗИЯ ПЕРСОНАЖА
========================================================= */

/*
   Радиус персонажа.

   Благодаря этому он не касается
   стены центром тела, а упирается
   всем корпусом.
*/

const playerRadius=1.65;


function collides(
    x,
    z
){

    for(
        const box of buildingColliders
    ){

        const closestX=
            Math.max(
                box.minX,
                Math.min(
                    x,
                    box.maxX
                )
            );


        const closestZ=
            Math.max(
                box.minZ,
                Math.min(
                    z,
                    box.maxZ
                )
            );


        const dx=
            x-
            closestX;

        const dz=
            z-
            closestZ;


        if(
            dx*dx+
            dz*dz
            <
            playerRadius*
            playerRadius
        ){

            return true;
        }
    }

    return false;
}


/*
   Двигаем отдельно по X и Z.

   Благодаря этому персонаж
   не застревает в стене,
   а может скользить вдоль неё.
*/

function movePlayer(
    dx,
    dz
){

    const nextX=
        player.position.x+
        dx;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;
    }


    const nextZ=
        player.position.z+
        dz;

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;
    }
}


/* =========================================================
   ИГРА
========================================================= */

const clock=
    new THREE.Clock();


function update(){

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    /*
       ВАЖНО:

       joystickX НЕ переворачиваем.

       Вправо на джойстике =
       вправо в мире.

       Диагонали тоже сохраняются.
    */

    let forward=
        -joystickY;

    let side=
        joystickX;


    const length=
        Math.hypot(
            forward,
            side
        );


    const moving=
        length>.08;


    if(moving){

        forward/=length;
        side/=length;


        const speed=
            21*
            delta;


        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);


        const moveX=
            sin*forward+
            cos*side;


        const moveZ=
            cos*forward-
            sin*side;


        movePlayer(
            moveX*speed,
            moveZ*speed
        );


        if(
            Math.abs(moveX)+
            Math.abs(moveZ)>
            .001
        ){

            player.rotation.y=
                Math.atan2(
                    moveX,
                    moveZ
                );
        }
    }


    /* =====================================================
       ПРЫЖОК
    ===================================================== */

    if(isJumping){

        verticalVelocity-=
            22*
            delta;


        player.position.y+=
            verticalVelocity*
            delta;


        if(
            player.position.y<=0
        ){

            player.position.y=0;

            verticalVelocity=0;

            isJumping=false;
        }
    }


    updateAnimation(
        delta,
        moving
    );


    /* =====================================================
       КАМЕРА
    ===================================================== */

    const horizontal=
        Math.cos(pitch)*
        distance;


    const vertical=
        Math.sin(pitch)*
        distance;


    const target=
        new THREE.Vector3(
            player.position.x,
            2.35+
            player.position.y,
            player.position.z
        );


    const wanted=
        new THREE.Vector3(

            player.position.x-
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z-
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();

        camera.aspect=

        camera.updateProjectionMatrix();

        renderer.setSize(

        );
    }
);
