<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Ачинск 3D — Evening</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#171d32;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));

    color:#fff;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.8),
        0 0 18px rgba(255,130,50,.15);
}

#subtitle{
    position:absolute;
    top:45px;
    left:max(15px,env(safe-area-inset-left));

    color:#d7d9e3;
    font-size:12px;

    text-shadow:0 2px 5px rgba(0,0,0,.8);
}

#joystick{
    position:absolute;

    left:max(
        22px,
        env(safe-area-inset-left)
    );

    bottom:max(
        22px,
        env(safe-area-inset-bottom)
    );

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            rgba(8,12,20,.46)
        );

    border:
        2px solid rgba(255,255,255,.22);

    box-shadow:
        0 8px 28px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.13);

    pointer-events:auto;
    touch-action:none;
    z-index:20;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:68px;
    height:68px;

    margin-left:-34px;
    margin-top:-34px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #53606b,
            #17202a 70%
        );

    border:
        1px solid rgba(255,255,255,.35);

    box-shadow:
        0 6px 20px rgba(0,0,0,.55),
        inset 0 2px rgba(255,255,255,.13);

    pointer-events:none;
}

#jump{
    position:absolute;

    right:max(
        40px,
        calc(env(safe-area-inset-right) + 40px)
    );

    bottom:max(
        38px,
        calc(env(safe-area-inset-bottom) + 38px)
    );

    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:12px;
    font-weight:900;
    letter-spacing:.5px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #596572,
            #111923 72%
        );

    border:
        1px solid rgba(255,255,255,.32);

    box-shadow:
        0 7px 24px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.12);

    pointer-events:auto;
    user-select:none;
    touch-action:none;

    z-index:30;
}

#jump:active{
    transform:scale(.92);
}

#orientation{
    position:absolute;

    right:15px;
    top:15px;

    padding:7px 10px;

    border-radius:10px;

    color:#fff;
    font-size:11px;

    background:rgba(0,0,0,.28);

    z-index:40;
}

@media(orientation:portrait){

    #orientation{
        background:rgba(110,65,0,.72);
    }

    #orientation::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe09a;
    }
}

<script>

window.addEventListener(
    "error",
    function(e){

        const box=document.createElement("div");

        box.style.position="fixed";
        box.style.left="10px";
        box.style.right="10px";
        box.style.top="10px";
        box.style.zIndex="999999";
        box.style.padding="15px";
        box.style.background="rgba(120,0,0,.95)";
        box.style.color="white";
        box.style.fontSize="14px";
        box.style.fontFamily="monospace";
        box.style.borderRadius="12px";
        box.style.whiteSpace="pre-wrap";

        box.textContent=
            "ОШИБКА JAVASCRIPT:\n\n"+
            e.message+
            "\n\nСтрока: "+
            e.lineno;

        document.body.appendChild(box);
    }
);

window.addEventListener(
    "unhandledrejection",
    function(e){

        const box=document.createElement("div");

        box.style.position="fixed";
        box.style.left="10px";
        box.style.right="10px";
        box.style.top="10px";
        box.style.zIndex="999999";
        box.style.padding="15px";
        box.style.background="rgba(120,0,0,.95)";
        box.style.color="white";
        box.style.fontSize="14px";
        box.style.fontFamily="monospace";
        box.style.borderRadius="12px";
        box.style.whiteSpace="pre-wrap";

        box.textContent=
            "ОШИБКА PROMISE:\n\n"+
            String(e.reason);

        document.body.appendChild(box);
    }
);

</script>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   СЦЕНА
========================================================= */

const scene=
    new THREE.Scene();


/* вечернее небо */

scene.background=
    new THREE.Color(
        0x252b49
    );


scene.fog=
    new THREE.Fog(
        0x252b49,
        170,
        720
    );


/* =========================================================
   КАМЕРА
========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        62,
        innerWidth/innerHeight,
        .1,
        1400
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace=
    THREE.SRGBColorSpace;


renderer.toneMapping=
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure=
    .95;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   ВЕЧЕРНЕЕ ОСВЕЩЕНИЕ
========================================================= */

const hemisphere=
    new THREE.HemisphereLight(
        0x596fa3,
        0x182318,
        1.15
    );

scene.add(
    hemisphere
);


/* солнце на закате */

const sunsetSun=
    new THREE.DirectionalLight(
        0xff8c55,
        3.0
    );


sunsetSun.position.set(
    -260,
    75,
    180
);


sunsetSun.castShadow=true;


/*
   Не 2048 — специально уменьшаем
   нагрузку на телефон.
*/

sunsetSun.shadow.mapSize.width=1024;
sunsetSun.shadow.mapSize.height=1024;


sunsetSun.shadow.camera.left=-250;
sunsetSun.shadow.camera.right=250;
sunsetSun.shadow.camera.top=250;
sunsetSun.shadow.camera.bottom=-250;


sunsetSun.shadow.bias=-.0005;


scene.add(
    sunsetSun
);


/* =========================================================
   ДОПОЛНИТЕЛЬНЫЙ ТЁПЛЫЙ СВЕТ ГОРИЗОНТА
========================================================= */

const sunsetGlow=
    new THREE.DirectionalLight(
        0xffb06c,
        .75
    );


sunsetGlow.position.set(
    -100,
    35,
    400
);


scene.add(
    sunsetGlow
);


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const groundMaterial=
    new THREE.MeshStandardMaterial({
        color:0x40583c,
        roughness:1
    });


const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            2200,
            2200
        ),
        groundMaterial
    );


ground.rotation.x=
    -Math.PI/2;


ground.receiveShadow=true;


scene.add(
    ground
);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const roadMaterial=
    new THREE.MeshStandardMaterial({
        color:0x25282c,
        roughness:.94
    });


const sidewalkMaterial=
    new THREE.MeshStandardMaterial({
        color:0x777b7d,
        roughness:.92
    });


const curbMaterial=
    new THREE.MeshStandardMaterial({
        color:0x9b9c98,
        roughness:.88
    });


const lineMaterial=
    new THREE.MeshStandardMaterial({
        color:0xe9e4d6,
        roughness:.7
    });


const grassMaterial=
    new THREE.MeshStandardMaterial({
        color:0x4c7040,
        roughness:1
    });


/* =========================================================
   ДОРОГИ
========================================================= */

function road(
    width,
    length,
    x,
    z,
    rotation=0
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),
            roadMaterial
        );


    mesh.position.set(
        x,
        .06,
        z
    );


    mesh.rotation.y=
        rotation;


    mesh.receiveShadow=true;


    scene.add(
        mesh
    );


    /*
       Тротуары располагаем
       снаружи дороги.
    */

    for(
        const side of [-1,1]
    ){

        const offset=
            width/2+4.2;


        const sx=
            x+
            Math.cos(rotation)*
            offset*
            side;


        const sz=
            z+
            Math.sin(rotation)*
            offset*
            side;


        const sidewalk=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    7,
                    .24,
                    length
                ),
                sidewalkMaterial
            );


        sidewalk.position.set(
            sx,
            .12,
            sz
        );


        sidewalk.rotation.y=
            rotation;


        sidewalk.receiveShadow=true;


        scene.add(
            sidewalk
        );


        const curb=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .5,
                    .32,
                    length
                ),
                curbMaterial
            );


        curb.position.set(
            x+
            Math.cos(rotation)*
            (width/2+.3)*
            side,

            .17,

            z+
            Math.sin(rotation)*
            (width/2+.3)*
            side
        );


        curb.rotation.y=
            rotation;


        scene.add(
            curb
        );
    }
}


/* центральные улицы */

road(
    46,
    1400,
    0,
    0
);

road(
    46,
    1400,
    0,
    0,
    Math.PI/2
);


/* второстепенные улицы */

road(
    26,
    1100,
    -190,
    0
);

road(
    26,
    1100,
    190,
    0
);

road(
    26,
    1100,
    0,
    -190,
    Math.PI/2
);

road(
    26,
    1100,
    0,
    190,
    Math.PI/2
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function laneLineZ(
    x,
    start,
    end
){

    for(
        let z=start;
        z<end;
        z+=20
    ){

        const mark=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .22,
                    .13,
                    9
                ),
                lineMaterial
            );


        mark.position.set(
            x,
            .14,
            z
        );


        scene.add(
            mark
        );
    }
}


function laneLineX(
    z,
    start,
    end
){

    for(
        let x=start;
        x<end;
        x+=20
    ){

        const mark=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    9,
                    .13,
                    .22
                ),
                lineMaterial
            );


        mark.position.set(
            x,
            .14,
            z
        );


        scene.add(
            mark
        );
    }
}


laneLineZ(
    0,
    -650,
    650
);

laneLineX(
    0,
    -650,
    650
);


/* =========================================================
   ЗДАНИЯ
========================================================= */

const buildingMaterials=[
    new THREE.MeshStandardMaterial({
        color:0x9d9187,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0xb1aaa0,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0x858d91,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0xaaa08d,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0x737d83,
        roughness:.86
    })
];


const windowDark=
    new THREE.MeshStandardMaterial({
        color:0x182b3d,
        roughness:.35,
        metalness:.08
    });


const windowWarm=
    new THREE.MeshStandardMaterial({
        color:0xffb85c,
        emissive:0xff7b22,
        emissiveIntensity:.7,
        roughness:.32
    });


const roofMaterial=
    new THREE.MeshStandardMaterial({
        color:0x393b3e,
        roughness:.9
    });


/*
   Один общий материал окон.
   Это уменьшает количество ресурсов.
*/

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    style
){

    const group=
        new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );


    /* основной корпус */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            buildingMaterials[
                style %
                buildingMaterials.length
            ]
        );


    body.position.y=
        height/2;


    body.castShadow=true;
    body.receiveShadow=true;


    group.add(
        body
    );


    /* верхняя часть */

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+1,
                .55,
                depth+1
            ),
            roofMaterial
        );


    roof.position.y=
        height+.28;


    roof.castShadow=true;


    group.add(
        roof
    );


    /*
       Вертикальные архитектурные
       элементы.
    */

    if(
        style===1 ||
        style===3
    ){

        const columnMaterial=
            buildingMaterials[
                (style+1) %
                buildingMaterials.length
            ];


        const columns=
            Math.max(
                2,
                Math.floor(
                    width/10
                )
            );


        for(
            let i=0;
            i<columns;
            i++
        ){

            const px=
                -width/2+
                5+
                i*
                (
                    (width-10)/
                    Math.max(
                        1,
                        columns-1
                    )
                );


            const column=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .8,
                        height,
                        .65
                    ),
                    columnMaterial
                );


            column.position.set(
                px,
                height/2,
                depth/2+.35
            );


            column.castShadow=true;


            group.add(
                column
            );
        }
    }


    /*
       Окна.

       Создаём только на фасадах,
       а не вокруг каждого здания.
    */

    const columns=
        Math.max(
            3,
            Math.floor(
                width/8
            )
        );


    const rows=
        Math.max(
            2,
            Math.floor(
                height/7
            )
        );


    const gapX=
        (width-8)/
        Math.max(
            1,
            columns-1
        );


    for(
        let row=0;
        row<rows;
        row++
    ){

        const wy=
            5+
            row*7;


        if(
            wy>height-3
        )
            continue;


        for(
            let col=0;
            col<columns;
            col++
        ){

            if(
                (row+col+style)%5===0
            )
                continue;


            const wx=
                -width/2+
                4+
                col*gapX;


            const lit=
                (row+
                 col+
                 style)%4===0;


            const material=
                lit
                ?windowWarm
                :windowDark;


            const window=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        2.8,
                        3.2,
                        .10
                    ),
                    material
                );


            window.position.set(
                wx,
                wy,
                depth/2+.08
            );


            group.add(
                window
            );
        }
    }


    /*
       Боковые окна —
       меньше количества,
       чтобы сохранить FPS.
    */

    if(
        depth>45
    ){

        for(
            let row=0;
            row<rows;
            row+=2
        ){

            const wy=
                6+
                row*7;


            const window=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        2.6,
                        3,
                        .10
                    ),
                    windowDark
                );


            window.rotation.y=
                Math.PI/2;


            window.position.set(
                width/2+.08,
                wy,
                0
            );


            group.add(
                window
            );
        }
    }


    scene.add(
        group
    );
}


/* =========================================================
   КВАРТАЛЫ
========================================================= */

/*
   Дома начинаются только после
   зоны тротуаров.

   Поэтому здания не стоят
   на дороге.
*/

const buildingPositions=[
    [-105,-105],
    [-35,-115],
    [45,-112],
    [120,-108],

    [-110,-35],
    [110,-35],

    [-115,45],
    [115,45],

    [-105,115],
    [-35,120],
    [45,115],
    [120,110],

    [-300,-105],
    [-390,-105],
    [300,-105],
    [390,-105],

    [-300,105],
    [-390,105],
    [300,105],
    [390,105],

    [-105,-300],
    [-105,-390],
    [105,-300],
    [105,-390],

    [-105,300],
    [-105,390],
    [105,300],
    [105,390]
];


buildingPositions.forEach(
    function(p,i){

        const x=p[0];
        const z=p[1];


        const width=
            42+
            (i%3)*10;


        const depth=
            38+
            (i%4)*8;


        const height=
            25+
            (i%5)*7;


        createBuilding(
            x,
            z,
            width,
            depth,
            height,
            i%5
        );
    }
);


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

const trunkMaterial=
    new THREE.MeshStandardMaterial({
        color:0x493326,
        roughness:.95
    });


const leafMaterials=[
    new THREE.MeshStandardMaterial({
        color:0x315b37,
        roughness:.95
    }),

    new THREE.MeshStandardMaterial({
        color:0x3e7041,
        roughness:.95
    })
];


function createTree(
    x,
    z,
    scale=1
){

    const group=
        new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );


    group.scale.setScalar(
        scale
    );


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .55,
                6,
                8
            ),
            trunkMaterial
        );


    trunk.position.y=3;


    trunk.castShadow=true;


    group.add(
        trunk
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        const crown=
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.3+
                    i*.25,
                    10,
                    8
                ),
                leafMaterials[
                    i%2
                ]
            );


        crown.position.set(
            (i-1.5)*1.35,
            6.4+
            (i%2)*1.2,
            (i%3-1)*.8
        );


        crown.scale.y=.85;


        crown.castShadow=true;


        group.add(
            crown
        );
    }


    scene.add(
        group
    );
}


/* деревья в зелёных зонах */

const treePositions=[
    [-145,-145],
    [-75,-150],
    [75,-150],
    [145,-145],

    [-150,150],
    [-75,145],
    [75,145],
    [150,150],

    [-150,-75],
    [-150,75],
    [150,-75],
    [150,75],

    [-280,-145],
    [-350,-145],
    [280,-145],
    [350,-145],

    [-280,145],
    [-350,145],
    [280,145],
    [350,145]
];


treePositions.forEach(
    function(p,i){

        createTree(
            p[0],
            p[1],
            .8+
            (i%3)*.12
        );
    }
);


/* =========================================================
   ФОНАРИ
========================================================= */

const lampPoleMaterial=
    new THREE.MeshStandardMaterial({
        color:0x292d31,
        metalness:.7,
        roughness:.38
    });


const lampGlowMaterial=
    new THREE.MeshStandardMaterial({
        color:0xffd58a,
        emissive:0xff8a24,
        emissiveIntensity:2.4,
        roughness:.3
    });


function createLamp(
    x,
    z
){

    const group=
        new THREE.Group();


    group.position.set(
        x,
        0,
        z
    );


    const pole=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .18,
                7,
                8
            ),
            lampPoleMaterial
        );


    pole.position.y=3.5;


    pole.castShadow=true;


    group.add(
        pole
    );


    const arm=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .13,
                .13
            ),
            lampPoleMaterial
        );


    arm.position.set(
        .95,
        6.8,
        0
    );


    group.add(
        arm
    );


    const lamp=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                8,
                8
            ),
            lampGlowMaterial
        );


    lamp.position.set(
        2,
        6.65,
        0
    );


    group.add(
        lamp
    );


    scene.add(
        group
    );
}

/* =========================================================
   НЕБОЛЬШИЕ КУСТЫ

const bushMaterial=
    new THREE.MeshStandardMaterial({
        color:0x315a35,
        roughness:1
    });


function createBush(
    x,
    z
){

    const bush=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.4,
                8,
                6
            ),
            bushMaterial
        );


    bush.position.set(

    );

[
    [-135,-130],

/* =========================================================
   ПЕРСОНАЖ
========================================================= */

const player=
    new THREE.Group();


scene.add(
    player
);


player.position.set(
    0,
    0,
    80
);


let characterModel=null;
let characterMixer=null;

let idleAction=null;
let walkAction=null;
let runAction=null;

let activeAction=null;


const characterLoader=
    new GLTFLoader();


characterLoader.load(

    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    function(gltf){

        characterModel=
            gltf.scene;


        characterModel.scale.setScalar(
            1.8
        );


        characterModel.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;
                    object.receiveShadow=true;


                    if(
                        object.material
                    ){

                        object.material.needsUpdate=true;


                        if(
                            "roughness"
                            in object.material
                        )
                            object.material.roughness=.78;


                        if(
                            "metalness"
                            in object.material
                        )
                            object.material.metalness=.02;
                    }
                }
            }
        );


        player.add(
            characterModel
        );


        characterMixer=
            new THREE.AnimationMixer(
                characterModel
            );


        function findAnimation(
            names
        ){

            for(
                const name of names
            ){

                const clip=
                    gltf.animations.find(
                        animation =>
                            animation.name
                            .toLowerCase()===
                            name.toLowerCase()
                    );


                if(
                    clip
                )
                    return clip;
            }


            return null;
        }


        const idleClip=
            findAnimation([
                "idle",
                "Idle"
            ]);


        const walkClip=
            findAnimation([
                "walk",
                "walking",
                "Walk",
                "Walking"
            ]);


        const runClip=
            findAnimation([
                "run",
                "running",
                "Run",
                "Running"
            ]);


        if(
            idleClip
        ){

            idleAction=
                characterMixer.clipAction(
                    idleClip
                );

            idleAction.play();

            activeAction=
                idleAction;
        }


        if(
            walkClip
        ){

            walkAction=
                characterMixer.clipAction(
                    walkClip
                );
        }


        if(
            runClip
        ){

            runAction=
                characterMixer.clipAction(
                    runClip
                );
        }
    }
);


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function playAnimation(
    action
){

    if(
        !action ||
        activeAction===action
    )
        return;


    const previous=
        activeAction;


    activeAction=
        action;


    action.reset();
    action.play();


    if(
        previous
    ){

        action.crossFadeFrom(
            previous,
            .18,
            true
        );
    }
}


function updateCharacter(
    delta,
    moving
){

    if(
        !characterMixer
    )
        return;


    characterMixer.update(
        delta
    );


    if(
        moving &&
        walkAction
    ){

        playAnimation(
            walkAction
        );

    }else if(
        idleAction
    ){

        playAnimation(
            idleAction
        );
    }
}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );


const stick=
    document.getElementById(
        "stick"
    );


let joystickPointerId=null;

let joystickX=0;
let joystickY=0;


const joystickRadius=55;


function updateJoystick(
    event
){

    const rect=
        joystick.getBoundingClientRect();


    const centerX=
        rect.left+
        rect.width/2;


    const centerY=
        rect.top+
        rect.height/2;


    let dx=
        event.clientX-
        centerX;


    let dy=
        event.clientY-
        centerY;


    const length=
        Math.hypot(
            dx,
            dy
        );


    if(
        length>
        joystickRadius
    ){

        dx=
            dx/length*
            joystickRadius;

        dy=
            dy/length*
            joystickRadius;
    }


    joystickX=
        dx/
        joystickRadius;


    joystickY=
        dy/
        joystickRadius;


    stick.style.transform=
        "translate("+
        dx+
        "px,"+
        dy+
        "px)";
}


function resetJoystick(){

    joystickPointerId=null;

    joystickX=0;
    joystickY=0;


    stick.style.transform=
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystickPointerId=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        e.preventDefault();

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            joystickPointerId
        )
            resetJoystick();
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


joystick.addEventListener(
    "lostpointercapture",
    resetJoystick
);


/* =========================================================
   ПРЫЖОК
========================================================= */

const jumpButton=
    document.getElementById(
        "jump"
    );


let verticalVelocity=0;
let isJumping=false;


function jump(){

    if(
        isJumping
    )
        return;


    isJumping=true;

    verticalVelocity=
        8.5;
}


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    },
    {
        passive:false
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let yaw=0;

let pitch=.42;

let distance=7;


let cameraPointerId=null;

let cameraLastX=0;
let cameraLastY=0;


function isControlElement(
    target
){

    return(
        target===joystick ||
        joystick.contains(target) ||
        target===jumpButton ||
        jumpButton.contains(target)
    );
}


document.addEventListener(
    "pointerdown",
    function(e){

        if(
            isControlElement(
                e.target
            )
        )
            return;


        cameraPointerId=
            e.pointerId;


        cameraLastX=
            e.clientX;

        cameraLastY=
            e.clientY;

        e.preventDefault();
    },
    {
        passive:false,
        capture:true
    }
);


document.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            cameraPointerId
        )
            return;


        const dx=
            e.clientX-
            cameraLastX;


        const dy=
            e.clientY-
            cameraLastY;


        yaw-=
            dx*.008;


        pitch+=
            dy*.006;


        pitch=
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.05
            );


        cameraLastX=
            e.clientX;

        cameraLastY=
            e.clientY;


        e.preventDefault();
    },
    {
        passive:false,
        capture:true
    }
);


document.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        )
            cameraPointerId=null;
    },
    {
        capture:true
    }
);


document.addEventListener(
    "pointercancel",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        )
            cameraPointerId=null;
    },
    {
        capture:true
    }
);


window.addEventListener(
    "blur",
    function(){

        cameraPointerId=null;

        resetJoystick();
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            joystickY=-1;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            joystickY=1;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            joystickX=-1;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            joystickX=1;


        if(
            e.code==="Space"
        )
            jump();
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key==="w" ||
            e.key==="ArrowUp" ||
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            joystickY=0;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft" ||
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            joystickX=0;
    }
);


/* =========================================================
   ИГРА
========================================================= */

const clock=
    new THREE.Clock();


function update(){

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    /* движение */

    let forward=
        -joystickY;


    let side=
        joystickX;


    const length=
        Math.hypot(
            forward,
            side
        );


    const moving=
        length>.08;


    if(
        moving
    ){

        forward/=length;
        side/=length;


        const speed=
            22*delta;


        const sin=
            Math.sin(yaw);


        const cos=
            Math.cos(yaw);


        const moveX=
            sin*forward+
            cos*side;


        const moveZ=
            cos*forward-
            sin*side;


        player.position.x+=
            moveX*speed;


        player.position.z+=
            moveZ*speed;


        player.rotation.y=
            Math.atan2(
                moveX,
                moveZ
            );
    }


    /* прыжок */

    if(
        isJumping
    ){

        verticalVelocity-=
            22*delta;


        player.position.y+=
            verticalVelocity*delta;


        if(
            player.position.y<=0
        ){

            player.position.y=0;

            verticalVelocity=0;

            isJumping=false;
        }
    }


    updateCharacter(
        delta,
        moving
    );


    /* камера */

    const horizontal=
        Math.cos(pitch)*
        distance;


    const vertical=
        Math.sin(pitch)*
        distance;


    const target=
        new THREE.Vector3(
            player.position.x,
            2.4+
            player.position.y,
            player.position.z
        );


    const wanted=
        new THREE.Vector3(

            player.position.x-
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z-
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );
}


animate();

   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
