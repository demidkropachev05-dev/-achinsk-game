<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10151b;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#111820;
    color:white;
    font-size:22px;
    letter-spacing:1px;
}

#loading small{
    margin-top:10px;
    opacity:.6;
    font-size:13px;
}

#portrait{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:#10151b;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:20px;
}

#hud{
    position:fixed;
    left:15px;
    top:15px;
    z-index:20;
    color:white;
    font-size:13px;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

#joystick{
    position:fixed;
    left:
        max(18px, env(safe-area-inset-left));
    bottom:
        max(20px, env(safe-area-inset-bottom));
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.22);
    box-shadow:
        inset 0 0 25px rgba(0,0,0,.35),
        0 5px 20px rgba(0,0,0,.35);
    z-index:30;
}

#stick{
    position:absolute;
    width:67px;
    height:67px;
    left:50%;
    top:50%;
    margin-left:-33.5px;
    margin-top:-33.5px;
    border-radius:50%;
    background:rgba(255,255,255,.30);
    border:2px solid rgba(255,255,255,.55);
    box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.button{
    position:fixed;
    z-index:30;
    border:1px solid rgba(255,255,255,.3);
    color:white;
    background:rgba(20,25,30,.55);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

#jump{
    right:
        max(25px, env(safe-area-inset-right));
    bottom:
        max(25px, env(safe-area-inset-bottom));
    width:78px;
    height:78px;
    font-size:16px;
}

#run{
    right:
        max(118px, calc(env(safe-area-inset-right) + 118px));
    bottom:
        max(25px, env(safe-area-inset-bottom));
    width:62px;
    height:62px;
    font-size:11px;
}

#run.active{
    background:rgba(50,160,80,.7);
}

#cameraHint{
    position:fixed;
    right:20px;
    top:20px;
    z-index:20;
    color:rgba(255,255,255,.65);
    font-size:11px;
    pointer-events:none;
}

@media (orientation:portrait){

    #portrait{
        display:flex;
    }

    #game,
    #hud,
    #joystick,
    #jump,
    #run,
    #cameraHint{
        display:none;
    }
}

@media (max-width:700px) and (orientation:landscape){

    #joystick{
        width:130px;
        height:130px;
    }

    #stick{
        width:60px;
        height:60px;
        margin-left:-30px;
        margin-top:-30px;
    }

    #jump{
        width:70px;
        height:70px;
    }

    #run{
        right:105px;
        width:57px;
        height:57px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    АЧИНСК 3D
    <small>Загрузка города...</small>
</div>

<div id="portrait">
    Поверни телефон горизонтально<br><br>
    ↻
</div>

<div id="hud">
    АЧИНСК 3D
</div>

<div id="cameraHint">
    Проводи пальцем по экрану — камера
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="run" class="button">
    БЕГ
</div>

<div id="jump" class="button">
    ПРЫЖОК
</div>

<!-- Three.js без module -->
<script src="https://unpkg.com/three@0.180.0/build/three.min.js"></script>

<script>

(function(){

"use strict";

/* =========================================================
   ПРОВЕРКА THREE.JS
========================================================= */

if(typeof THREE === "undefined"){
    document.getElementById("loading").innerHTML =
        "ОШИБКА ЗАГРУЗКИ<br><small>Three.js не загрузился</small>";
    return;
}


/* =========================================================
   ОСНОВА
========================================================= */

const game = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x788894);

scene.fog = new THREE.FogExp2(
    0x788894,
    0.0018
);


const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1800
);


const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.05;

game.appendChild(renderer.domElement);


/* =========================================================
   СВЕТ
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xb9c7d2,
    0x3d454c,
    2.2
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffe4c2,
    3
);

sun.position.set(
    -250,
    350,
    180
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -400;
sun.shadow.camera.right = 400;
sun.shadow.camera.top = 400;
sun.shadow.camera.bottom = -400;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 1000;

scene.add(sun);


/* =========================================================
   МАТЕРИАЛЫ
========================================================= */

const matGround =
    new THREE.MeshStandardMaterial({
        color:0x3e4547,
        roughness:1
    });

const matGrass =
    new THREE.MeshStandardMaterial({
        color:0x394a3d,
        roughness:1
    });

const matRoad =
    new THREE.MeshStandardMaterial({
        color:0x26292c,
        roughness:.95
    });

const matSidewalk =
    new THREE.MeshStandardMaterial({
        color:0x8a8984,
        roughness:.9
    });

const matWhite =
    new THREE.MeshStandardMaterial({
        color:0xe2dfd6,
        roughness:.8
    });

const matYellow =
    new THREE.MeshStandardMaterial({
        color:0xd3a934,
        roughness:.7
    });

const matWindow =
    new THREE.MeshStandardMaterial({
        color:0x9bb8c7,
        roughness:.25,
        metalness:.15
    });

const matDarkWindow =
    new THREE.MeshStandardMaterial({
        color:0x263a46,
        roughness:.25
    });

const matTree =
    new THREE.MeshStandardMaterial({
        color:0x1d3d28,
        roughness:1
    });

const matTreeLight =
    new THREE.MeshStandardMaterial({
        color:0x315c35,
        roughness:1
    });

const matTrunk =
    new THREE.MeshStandardMaterial({
        color:0x493426,
        roughness:1
    });

const matCar =
    new THREE.MeshStandardMaterial({
        color:0x8b3430,
        roughness:.45,
        metalness:.2
    });

const matCar2 =
    new THREE.MeshStandardMaterial({
        color:0x31516c,
        roughness:.45,
        metalness:.2
    });

const matCar3 =
    new THREE.MeshStandardMaterial({
        color:0x777777,
        roughness:.4,
        metalness:.25
    });


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1400,
            1400
        ),
        matGrass
    );

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ДОРОГИ
========================================================= */

function box(
    w,
    h,
    d,
    material,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


const roadSize = 30;


/* главные дороги */

box(
    1100,
    .08,
    roadSize,
    matRoad,
    0,
    .04,
    0
);

box(
    roadSize,
    .08,
    1100,
    matRoad,
    0,
    .045,
    0
);


/* дополнительные дороги */

const roadPositions = [
    -180,
    -90,
    90,
    180
];

for(const p of roadPositions){

    box(
        900,
        .07,
        22,
        matRoad,
        0,
        .04,
        p
    );

    box(
        22,
        .07,
        900,
        matRoad,
        p,
        .045,
        0
    );
}


/* =========================================================
   ТРОТУАРЫ
========================================================= */

function sidewalkHorizontal(z){

    box(
        900,
        .18,
        4,
        matSidewalk,
        0,
        .12,
        z - 17
    );

    box(
        900,
        .18,
        4,
        matSidewalk,
        0,
        .12,
        z + 17
    );
}

function sidewalkVertical(x){

    box(
        4,
        .18,
        900,
        matSidewalk,
        x - 17,
        .12,
        0
    );

    box(
        4,
        .18,
        900,
        matSidewalk,
        x + 17,
        .12,
        0
    );
}

sidewalkHorizontal(0);
sidewalkVertical(0);

for(const p of roadPositions){
    sidewalkHorizontal(p);
    sidewalkVertical(p);
}


/* =========================================================
   ДОРОЖНАЯ РАЗМЕТКА
========================================================= */

function stripe(x,y,z,w,d){

    box(
        w,
        .035,
        d,
        matWhite,
        x,
        y,
        z
    );
}


/* горизонтальная */

for(let x=-520;x<=520;x+=36){

    stripe(
        x,
        .09,
        0,
        16,
        .35
    );
}


/* вертикальная */

for(let z=-520;z<=520;z+=36){

    stripe(
        0,
        .095,
        z,
        .35,
        16
    );
}


/* =========================================================
   ЗДАНИЯ
========================================================= */

const buildings = [];

function createBuilding(
    x,
    z,
    w,
    d,
    h,
    color
){

    const material =
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.82
        });

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    building.position.set(
        x,
        h/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push({
        x,
        z,
        w,
        d
    });


    /* крыша */

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w+.25,
                .25,
                d+.25
            ),
            new THREE.MeshStandardMaterial({
                color:0x343536,
                roughness:.8
            })
        );

    roof.position.set(
        x,
        h+.12,
        z
    );

    roof.castShadow = true;

    scene.add(roof);


    /* окна */

    const floors =
        Math.max(
            1,
            Math.floor(h/4)
        );

    const cols =
        Math.max(
            2,
            Math.floor(w/4)
        );

    for(
        let floor=0;
        floor<floors;
        floor++
    ){

        for(
            let col=0;
            col<cols;
            col++
        ){

            if(
                Math.random()<.10
            ) continue;

            const wx =
                x -
                w/2 +
                2.1 +
                col*4;

            const wy =
                2.2 +
                floor*4;

            const front =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.7,
                        1.7,
                        .08
                    ),
                    Math.random()<.5
                    ? matWindow
                    : matDarkWindow
                );

            front.position.set(
                wx,
                wy,
                z-d/2-.045
            );

            scene.add(front);


            const back =
                front.clone();

            back.position.z =
                z+d/2+.045;

            scene.add(back);
        }
    }

    return building;
}


/* кварталы */

const colors = [
    0xb3aaa0,
    0x918f8b,
    0xc0b6a7,
    0x777b7c,
    0xa99b8e,
    0x73777b
];


const blocks = [
    [-130,-130],
    [130,-130],
    [-130,130],
    [130,130],

    [-300,-130],
    [300,-130],
    [-300,130],
    [300,130],

    [-130,-300],
    [130,-300],
    [-130,300],
    [130,300],

    [-300,-300],
    [300,-300],
    [-300,300],
    [300,300]
];


let bi=0;

for(const [bx,bz] of blocks){

    createBuilding(
        bx-18,
        bz,
        32,
        42,
        14+Math.random()*12,
        colors[bi%colors.length]
    );

    createBuilding(
        bx+28,
        bz+12,
        30,
        34,
        10+Math.random()*22,
        colors[(bi+2)%colors.length]
    );

    createBuilding(
        bx,
        bz+48,
        45,
        26,
        8+Math.random()*18,
        colors[(bi+3)%colors.length]
    );

    bi++;
}


/* =========================================================
   ДЕРЕВЬЯ
========================================================= */

function createTree(x,z,scale=1){

    const group =
        new THREE.Group();

    group.position.set(x,0,z);
    group.scale.setScalar(scale);


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,
                .6,
                5,
                8
            ),
            matTrunk
        );

    trunk.position.y=2.5;
    trunk.castShadow=true;

    group.add(trunk);


    const crown =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                3.2,
                10,
                8
            ),
            matTree
        );

    crown.position.y=6;
    crown.castShadow=true;

    group.add(crown);


    const crown2 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                9,
                7
            ),
            matTreeLight
        );

    crown2.position.set(
        1,
        7.7,
        -.4
    );

    crown2.castShadow=true;

    group.add(crown2);


    scene.add(group);
}


/* аллеи */

for(let i=-450;i<=450;i+=35){

    if(Math.abs(i)<55) continue;

    createTree(
        i,
        24,
        .8+Math.random()*.35
    );

    createTree(
        i,
        -24,
        .8+Math.random()*.35
    );

    createTree(
        24,
        i,
        .8+Math.random()*.35
    );

    createTree(
        -24,
        i,
        .8+Math.random()*.35
    );
}


/* =========================================================
   ФОНАРИ
========================================================= */

function createLamp(x,z){

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .17,
                7,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x25292b,
                roughness:.65
            })
        );

    pole.position.set(
        x,
        3.5,
        z
    );

    pole.castShadow=true;

    scene.add(pole);


    const lamp =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .3,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd78b,
                emissive:0xffa83d,
                emissiveIntensity:2
            })
        );

    lamp.position.set(
        x,
        7,
        z
    );

    scene.add(lamp);


    const light =
        new THREE.PointLight(
            0xffc36b,
            1.4,
            35
        );

    light.position.set(
        x,
        7,
        z
    );

    scene.add(light);
}


for(let i=-450;i<=450;i+=60){

    createLamp(
        i,
        22
    );

    createLamp(
        i,
        -22
    );
}


/* =========================================================
   МАШИНЫ
========================================================= */

function createCar(
    x,
    z,
    rotation,
    material
){

    const car =
        new THREE.Group();

    car.position.set(
        x,
        .8,
        z
    );

    car.rotation.y =
        rotation;


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.8,
                1.1,
                7
            ),
            material
        );

    body.castShadow=true;

    car.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.1,
                1.15,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:0x1c252b,
                roughness:.2,
                metalness:.2
            })
        );

    cabin.position.y=.9;
    cabin.position.z=-.3;

    cabin.castShadow=true;

    car.add(cabin);


    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color:0x17191a,
            roughness:1
        });


    for(const wx of [-1.8,1.8]){

        for(const wz of [-2.2,2.2]){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .65,
                        .65,
                        .45,
                        12
                    ),
                    wheelMaterial
                );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                wx,
                -.35,
                wz
            );

            car.add(wheel);
        }
    }


    scene.add(car);
}


const carMats=[
    matCar,
    matCar2,
    matCar3
];


for(let i=0;i<22;i++){

    const horizontal =
        i%2===0;

    const p =
        -420 +
        (i*79)%840;

    if(horizontal){

        createCar(
            p,
            8,
            0,
            carMats[i%3]
        );

    }else{

        createCar(
            -8,
            p,
            Math.PI/2,
            carMats[i%3]
        );
    }
}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    60
);

scene.add(player);


/* ноги */

function createLimb(
    width,
    height,
    depth,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.castShadow=true;

    return mesh;
}


const skin =
    new THREE.MeshStandardMaterial({
        color:0xc78e6e,
        roughness:.75
    });

const shirt =
    new THREE.MeshStandardMaterial({
        color:0x303842,
        roughness:.8
    });

const pants =
    new THREE.MeshStandardMaterial({
        color:0x20242a,
        roughness:.9
    });

const shoes =
    new THREE.MeshStandardMaterial({
        color:0x121416,
        roughness:1
    });


const leftLeg =
    createLimb(
        .48,
        2.4,
        .55,
        pants
    );

leftLeg.position.set(
    -.38,
    1.2,
    0
);

player.add(leftLeg);


const rightLeg =
    createLimb(
        .48,
        2.4,
        .55,
        pants
    );

rightLeg.position.set(
    .38,
    1.2,
    0
);

player.add(rightLeg);


const leftShoe =
    createLimb(
        .55,
        .28,
        .9,
        shoes
    );

leftShoe.position.set(
    -.38,
    .12,
    -.18
);

player.add(leftShoe);


const rightShoe =
    createLimb(
        .55,
        .28,
        .9,
        shoes
    );

rightShoe.position.set(
    .38,
    .12,
    -.18
);

player.add(rightShoe);


/* корпус */

const torso =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.55,
            2.2,
            .9
        ),
        shirt
    );

torso.position.y=3.35;

torso.castShadow=true;

player.add(torso);


/* голова */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            16,
            12
        ),
        skin
    );

head.position.y=5.05;

head.castShadow=true;

player.add(head);


/* волосы */

const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .68,
            16,
            8,
            0,
            Math.PI*2,
            0,
            Math.PI*.45
        ),
        new THREE.MeshStandardMaterial({
            color:0x202020,
            roughness:1
        })
    );

hair.position.y=5.2;

player.add(hair);


/* руки */

const leftArm =
    createLimb(
        .42,
        1.9,
        .48,
        shirt
    );

leftArm.position.set(
    -1.02,
    3.35,
    0
);

player.add(leftArm);


const rightArm =
    createLimb(
        .42,
        1.9,
        .48,
        shirt
    );

rightArm.position.set(
    1.02,
    3.35,
    0
);

player.add(rightArm);


/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */

let joyX=0;
let joyY=0;

let joyActive=false;
let joyPointer=null;

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();

    const cx =
        rect.left +
        rect.width/2;

    const cy =
        rect.top +
        rect.height/2;

    let dx =
        clientX-cx;

    let dy =
        clientY-cy;

    const max =
        rect.width*.34;

    const len =
        Math.hypot(dx,dy);

    if(len>max){

        dx =
            dx/len*max;

        dy =
            dy/len*max;
    }

    joyX =
        dx/max;

    joyY =
        dy/max;

    stick.style.transform =
        "translate("+
        dx+"px,"+
        dy+"px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joyActive=true;
        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            !joyActive ||
            e.pointerId!==joyPointer
        ) return;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


function releaseJoystick(){

    joyActive=false;
    joyPointer=null;

    joyX=0;
    joyY=0;

    stick.style.transform =
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerup",
    releaseJoystick
);

joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);


/* =========================================================
   БЕГ
========================================================= */

let running=false;

const runButton =
    document.getElementById("run");


runButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        running=true;

        runButton.classList.add(
            "active"
        );
    }
);


function stopRun(){

    running=false;

    runButton.classList.remove(
        "active"
    );
}


runButton.addEventListener(
    "pointerup",
    stopRun
);

runButton.addEventListener(
    "pointercancel",
    stopRun
);


/* =========================================================
   ПРЫЖОК
========================================================= */

let velocityY=0;
let grounded=true;

const jumpButton =
    document.getElementById("jump");


jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        if(grounded){

            velocityY=14;
            grounded=false;
        }
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let cameraYaw=0;
let cameraPitch=.35;

let cameraPointer=null;
let cameraActive=false;

let lastX=0;
let lastY=0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest &&
            e.target.closest(
                "#joystick,#jump,#run"
            )
        ) return;

        cameraActive=true;
        cameraPointer=e.pointerId;

        lastX=e.clientX;
        lastY=e.clientY;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(e){

        if(
            !cameraActive ||
            e.pointerId!==cameraPointer
        ) return;

        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        cameraYaw -= dx*.006;

        cameraPitch -= dy*.004;

        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                .12,
                .9
            );
    }
);


function endCamera(){

    cameraActive=false;
    cameraPointer=null;
}


renderer.domElement.addEventListener(
    "pointerup",
    endCamera
);

renderer.domElement.addEventListener(
    "pointercancel",
    endCamera
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;

        if(e.code==="ShiftLeft")
            running=true;

        if(
            e.code==="Space" &&
            grounded
        ){

            velocityY=14;
            grounded=false;
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[e.code]=false;

        if(e.code==="ShiftLeft")
            running=false;
    }
);


/* =========================================================
   ДВИЖЕНИЕ
========================================================= */

const clock =
    new THREE.Clock();

let walkTime=0;


function movePlayer(dt){

    let x=joyX;
    let y=-joyY;


    /* клавиатура */

    if(keys["KeyA"] ||
       keys["ArrowLeft"])
        x=-1;

    if(keys["KeyD"] ||
       keys["ArrowRight"])
        x=1;

    if(keys["KeyW"] ||
       keys["ArrowUp"])
        y=1;

    if(keys["KeyS"] ||
       keys["ArrowDown"])
        y=-1;


    const length =
        Math.hypot(x,y);

    if(length>1){

        x/=length;
        y/=length;
    }


    if(
        Math.abs(x)>.02 ||
        Math.abs(y)>.02
    ){

        /*
           ВАЖНО:

           y = движение ВПЕРЁД/НАЗАД
           x = движение ВЛЕВО/ВПРАВО

           При камере сзади:

           ВВЕРХ джойстика = вперёд
           ВПРАВО = вправо
        */

        const sin =
            Math.sin(cameraYaw);

        const cos =
            Math.cos(cameraYaw);


        const forwardX=sin;
        const forwardZ=-cos;

        const rightX=cos;
        const rightZ=sin;


        let moveX =
            forwardX*y +
            rightX*x;

        let moveZ =
            forwardZ*y +
            rightZ*x;


        const speed =
            13 *
            (running ? 1.65 : 1);


        player.position.x +=
            moveX*speed*dt;

        player.position.z +=
            moveZ*speed*dt;


        /*
           персонаж смотрит туда,
           куда идёт
        */

        const targetRotation =
            Math.atan2(
                moveX,
                moveZ
            );

        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                Math.min(
                    1,
                    dt*10
                )
            );


        walkTime +=
            dt *
            speed;


        const swing =
            Math.sin(walkTime*1.5)*.25;

        leftLeg.rotation.x =
            swing;

        rightLeg.rotation.x =
            -swing;

        leftArm.rotation.x =
            -swing;

        rightArm.rotation.x =
            swing;

    }else{

        leftLeg.rotation.x *= .85;
        rightLeg.rotation.x *= .85;

        leftArm.rotation.x *= .85;
        rightArm.rotation.x *= .85;
    }


    /* =====================================================
       ГРАНИЦЫ ГОРОДА
    ===================================================== */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -520,
            520
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -520,
            520
        );


    /* =====================================================
       ПРЫЖОК
    ===================================================== */

    velocityY -=
        38*dt;

    player.position.y +=
        velocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }
}


/* =========================================================
   КАМЕРА
========================================================= */

function updateCamera(){

    const distance=13;

    const height=5.8;


    const horizontal =
        Math.cos(cameraPitch) *
        distance;

    const vertical =
        Math.sin(cameraPitch) *
        distance;


    const offsetX =
        Math.sin(cameraYaw) *
        horizontal;

    const offsetZ =
        Math.cos(cameraYaw) *
        horizontal;


    camera.position.set(

        player.position.x +
        offsetX,

        player.position.y +
        height +
        vertical,

        player.position.z +
        offsetZ
    );


    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y+3,
            player.position.z
        );


    camera.lookAt(target);
}


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    movePlayer(dt);

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    camera.aspect =
        w/h;

    camera.updateProjectionMatrix();


    renderer.setSize(
        w,
        h
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );
}


window.addEventListener(
    "resize",
    resize
);

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resize,
            250
        );
    }
);


/* =========================================================
   СТАРТ
========================================================= */

resize();

updateCamera();

animate();


setTimeout(
    function(){

        const loading =
            document.getElementById(
                "loading"
            );

        if(loading)
            loading.style.display="none";

    },
    800
);

})();

</script>
