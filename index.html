<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#171d32;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    color:white;
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 2px 6px rgba(0,0,0,.9);
}

#subtitle{
    position:absolute;
    top:45px;
    left:max(15px,env(safe-area-inset-left));
    color:#d9dbe4;
    font-size:12px;
    text-shadow:0 2px 5px rgba(0,0,0,.9);
}

#joystick{
    position:absolute;
    left:max(22px,env(safe-area-inset-left));
    bottom:max(22px,env(safe-area-inset-bottom));

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.09),
            rgba(8,12,20,.55)
        );

    border:2px solid rgba(255,255,255,.22);

    box-shadow:
        0 8px 28px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.13);

    pointer-events:auto;
    touch-action:none;
    z-index:20;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:68px;
    height:68px;

    margin-left:-34px;
    margin-top:-34px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #66717d,
            #17202a 70%
        );

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 6px 20px rgba(0,0,0,.6),
        inset 0 2px rgba(255,255,255,.13);

    pointer-events:none;
}

#jump{
    position:absolute;

    right:max(
        40px,
        calc(env(safe-area-inset-right) + 40px)
    );

    bottom:max(
        38px,
        calc(env(safe-area-inset-bottom) + 38px)
    );

    width:72px;
    height:72px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:11px;
    font-weight:900;

    background:
        radial-gradient(
            circle at 35% 30%,
            #687481,
            #111923 72%
        );

    border:1px solid rgba(255,255,255,.32);

    box-shadow:
        0 7px 24px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.12);

    pointer-events:auto;
    user-select:none;
    touch-action:none;

    z-index:30;
}

#jump:active{
    transform:scale(.92);
}

#orientation{
    position:absolute;

    right:15px;
    top:15px;

    padding:7px 10px;

    border-radius:10px;

    color:white;
    font-size:11px;

    background:rgba(0,0,0,.28);

    z-index:40;
}

@media(orientation:portrait){

    #orientation{
        background:rgba(110,65,0,.72);
    }

    #orientation::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe09a;
    }
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">
        АЧИНСК
    </div>

    <div id="subtitle">
        вечерний город • 3D
    </div>

    <div id="orientation">
        LANDSCAPE
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="jump">
        ПРЫЖОК
    </div>

</div>

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   ОШИБКИ
========================================================= */

window.addEventListener(
    "error",
    function(e){

        const box=document.createElement("div");

        box.style.position="fixed";
        box.style.left="10px";
        box.style.right="10px";
        box.style.top="10px";
        box.style.zIndex="999999";
        box.style.padding="15px";
        box.style.background="rgba(120,0,0,.95)";
        box.style.color="white";
        box.style.fontFamily="monospace";
        box.style.borderRadius="12px";
        box.style.whiteSpace="pre-wrap";

        box.textContent=
            "ОШИБКА JAVASCRIPT:\n\n"+
            e.message+
            "\n\nСтрока: "+
            e.lineno;

        document.body.appendChild(box);
    }
);


/* =========================================================
   СЦЕНА
========================================================= */

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(
        0x242a48
    );

scene.fog=
    new THREE.Fog(
        0x242a48,
        180,
        760
    );


/* =========================================================
   КАМЕРА
========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        62,
        innerWidth/innerHeight,
        .1,
        1400
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    .95;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   СВЕТ
========================================================= */

const hemisphere=
    new THREE.HemisphereLight(
        0x6579ae,
        0x182318,
        1.2
    );

scene.add(
    hemisphere
);


const sunsetSun=
    new THREE.DirectionalLight(
        0xff8750,
        3.1
    );

sunsetSun.position.set(
    -260,
    85,
    180
);

sunsetSun.castShadow=true;

sunsetSun.shadow.mapSize.width=1024;
sunsetSun.shadow.mapSize.height=1024;

sunsetSun.shadow.camera.left=-260;
sunsetSun.shadow.camera.right=260;
sunsetSun.shadow.camera.top=260;
sunsetSun.shadow.camera.bottom=-260;

sunsetSun.shadow.bias=-.0005;

scene.add(
    sunsetSun
);


const sunsetGlow=
    new THREE.DirectionalLight(
        0xffb36b,
        .75
    );

sunsetGlow.position.set(
    -100,
    40,
    400
);

scene.add(
    sunsetGlow
);


/* =========================================================
   ЗЕМЛЯ
========================================================= */

const groundMaterial=
    new THREE.MeshStandardMaterial({
        color:0x40573c,
        roughness:1
    });

const ground=
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            2200,
            2200
        ),
        groundMaterial
    );

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

scene.add(
    ground
);


/* =========================================================
   МАТЕРИАЛЫ ГОРОДА
========================================================= */

const roadMaterial=
    new THREE.MeshStandardMaterial({
        color:0x25282c,
        roughness:.94
    });

const sidewalkMaterial=
    new THREE.MeshStandardMaterial({
        color:0x777b7d,
        roughness:.92
    });

const curbMaterial=
    new THREE.MeshStandardMaterial({
        color:0x999b98,
        roughness:.88
    });

const lineMaterial=
    new THREE.MeshStandardMaterial({
        color:0xe7e0d1,
        roughness:.7
    });

const grassMaterial=
    new THREE.MeshStandardMaterial({
        color:0x4c7040,
        roughness:1
    });


/* =========================================================
   ДОРОГИ
========================================================= */

function road(
    width,
    length,
    x,
    z,
    rotation=0
){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),
            roadMaterial
        );

    mesh.position.set(
        x,
        .06,
        z
    );

    mesh.rotation.y=
        rotation;

    mesh.receiveShadow=true;

    scene.add(
        mesh
    );


    for(
        const side of [-1,1]
    ){

        const offset=
            width/2+4.2;

        const sx=
            x+
            Math.cos(rotation)*
            offset*
            side;

        const sz=
            z+
            Math.sin(rotation)*
            offset*
            side;


        const sidewalk=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    7,
                    .24,
                    length
                ),
                sidewalkMaterial
            );

        sidewalk.position.set(
            sx,
            .12,
            sz
        );

        sidewalk.rotation.y=
            rotation;

        sidewalk.receiveShadow=true;

        scene.add(
            sidewalk
        );


        const curb=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .5,
                    .32,
                    length
                ),
                curbMaterial
            );

        curb.position.set(
            x+
            Math.cos(rotation)*
            (width/2+.3)*
            side,

            .17,

            z+
            Math.sin(rotation)*
            (width/2+.3)*
            side
        );

        curb.rotation.y=
            rotation;

        scene.add(
            curb
        );
    }
}


/* главные улицы */

road(
    46,
    1400,
    0,
    0
);

road(
    46,
    1400,
    0,
    0,
    Math.PI/2
);


/* второстепенные */

road(
    26,
    1100,
    -190,
    0
);

road(
    26,
    1100,
    190,
    0
);

road(
    26,
    1100,
    0,
    -190,
    Math.PI/2
);

road(
    26,
    1100,
    0,
    190,
    Math.PI/2
);


/* =========================================================
   РАЗМЕТКА
========================================================= */

function laneLineZ(
    x,
    start,
    end
){

    for(
        let z=start;
        z<end;
        z+=20
    ){

        const mark=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .22,
                    .13,
                    9
                ),
                lineMaterial
            );

        mark.position.set(
            x,
            .14,
            z
        );

        scene.add(
            mark
        );
    }
}


function laneLineX(
    z,
    start,
    end
){

    for(
        let x=start;
        x<end;
        x+=20
    ){

        const mark=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    9,
                    .13,
                    .22
                ),
                lineMaterial
            );

        mark.position.set(
            x,
            .14,
            z
        );

        scene.add(
            mark
        );
    }
}

laneLineZ(
    0,
    -650,
    650
);

laneLineX(
    0,
    -650,
    650
);


/* =========================================================
   МАТЕРИАЛЫ ЗДАНИЙ
========================================================= */

const buildingMaterials=[

    new THREE.MeshStandardMaterial({
        color:0x9d9187,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0xb1aaa0,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0x858d91,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0xaaa08d,
        roughness:.84
    }),

    new THREE.MeshStandardMaterial({
        color:0x737d83,
        roughness:.86
    }),

    new THREE.MeshStandardMaterial({
        color:0x927d72,
        roughness:.86
    })
];


const windowDark=
    new THREE.MeshStandardMaterial({
        color:0x172a3c,
        roughness:.32,
        metalness:.08
    });


const windowWarm=
    new THREE.MeshStandardMaterial({
        color:0xffbd64,
        emissive:0xff7420,
        emissiveIntensity:.85,
        roughness:.3
    });


const roofMaterial=
    new THREE.MeshStandardMaterial({
        color:0x373a3e,
        roughness:.88
    });


/* =========================================================
   ДЕТАЛЬНОЕ ЗДАНИЕ
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    style
){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );


    const bodyMat=
        buildingMaterials[
            style%
            buildingMaterials.length
        ];


    /* основной корпус */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            bodyMat
        );

    body.position.y=
        height/2;

    body.castShadow=true;
    body.receiveShadow=true;

    group.add(
        body
    );


    /* цоколь */

    const base=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+.8,
                .9,
                depth+.8
            ),
            roofMaterial
        );

    base.position.y=
        .45;

    base.castShadow=true;

    group.add(
        base
    );


    /* этажные пояса */

    const floors=
        Math.max(
            3,
            Math.floor(
                height/5.8
            )
        );


    for(
        let f=1;
        f<floors;
        f++
    ){

        const band=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width+.35,
                    .18,
                    depth+.35
                ),
                roofMaterial
            );

        band.position.y=
            f*
            (height/floors);

        group.add(
            band
        );
    }


    /* крыша */

    const roof=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+1.4,
                .65,
                depth+1.4
            ),
            roofMaterial
        );

    roof.position.y=
        height+.32;

    roof.castShadow=true;

    group.add(
        roof
    );


    /* верхняя декоративная часть */

    const parapet=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width+1.8,
                1.15,
                depth+1.8
            ),
            buildingMaterials[
                (style+2)%
                buildingMaterials.length
            ]
        );

    parapet.position.y=
        height+.82;

    group.add(
        parapet
    );


    /* фасадные вертикальные пилоны */

    const facadeCols=
        Math.max(
            3,
            Math.floor(
                width/9
            )
        );


    for(
        let i=0;
        i<facadeCols;
        i++
    ){

        const px=
            -width/2+
            3+
            i*
            (
                (width-6)/
                Math.max(
                    1,
                    facadeCols-1
                )
            );


        const pillar=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .42,
                    height-.8,
                    .5
                ),
                buildingMaterials[
                    (style+1)%
                    buildingMaterials.length
                ]
            );

        pillar.position.set(
            px,
            (height-.8)/2,
            depth/2+.28
        );

        group.add(
            pillar
        );
    }


    /* =====================================================
       ОКНА ФАСАДА
    ===================================================== */

    const winCols=
        Math.max(
            3,
            Math.floor(
                width/7
            )
        );

    const winRows=
        Math.max(
            3,
            Math.floor(
                height/5.8
            )
        );


    const winW=
        Math.min(
            3.8,
            Math.max(
                2.5,
                (width-7)/winCols
            )
        );


    const winH=
        Math.min(
            3.4,
            Math.max(
                2.4,
                height/(winRows+2)
            )
        );


    for(
        let row=0;
        row<winRows;
        row++
    ){

        const wy=
            3.1+
            row*
            (
                (height-5.2)/
                Math.max(
                    1,
                    winRows-1
                )
            );


        for(
            let col=0;
            col<winCols;
            col++
        ){

            if(
                (row+col+style)%6===0
            )
                continue;


            const wx=
                -width/2+
                3.5+
                col*
                (
                    (width-7)/
                    Math.max(
                        1,
                        winCols-1
                    )
                );


            const lit=
                (row*3+
                 col+
                 style)%5===0;


            const material=
                lit
                ?windowWarm
                :windowDark;


            /* рама */

            const frame=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        winW+.55,
                        winH+.55,
                        .16
                    ),
                    roofMaterial
                );

            frame.position.set(
                wx,
                wy,
                depth/2+.17
            );

            group.add(
                frame
            );


            /* стекло */

            const glass=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        winW,
                        winH,
                        .12
                    ),
                    material
                );

            glass.position.set(
                wx,
                wy,
                depth/2+.27
            );

            group.add(
                glass
            );


            /* вертикальное деление */

            const mullion=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .12,
                        winH,
                        .08
                    ),
                    roofMaterial
                );

            mullion.position.set(
                wx,
                wy,
                depth/2+.35
            );

            group.add(
                mullion
            );


            /* горизонтальное деление */

            const cross=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        winW,
                        .10,
                        .08
                    ),
                    roofMaterial
                );

            cross.position.set(
                wx,
                wy,
                depth/2+.35
            );

            group.add(
                cross
            );


            /* задний фасад */

            const rearFrame=
                frame.clone();

            rearFrame.position.z=
                -depth/2-.17;

            group.add(
                rearFrame
            );


            const rearGlass=
                glass.clone();

            rearGlass.position.z=
                -depth/2-.27;

            group.add(
                rearGlass
            );
        }
    }


    /* =====================================================
       БОКОВЫЕ ОКНА
    ===================================================== */

    const sideRows=
        Math.max(
            2,
            Math.floor(
                height/7
            )
        );


    const sideCols=
        Math.max(
            2,
            Math.floor(
                depth/9
            )
        );


    for(
        let row=0;
        row<sideRows;
        row++
    ){

        const wy=
            4+
            row*
            (
                (height-6)/
                Math.max(
                    1,
                    sideRows-1
                )
            );


        for(
            let col=0;
            col<sideCols;
            col++
        ){

            if(
                (row+col+style)%4===0
            )
                continue;


            const wz=
                -depth/2+
                4+
                col*
                (
                    (depth-8)/
                    Math.max(
                        1,
                        sideCols-1
                    )
                );


            const glass=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .12,
                        2.7,
                        3.1
                    ),
                    (row+col+style)%5===0
                    ?windowWarm
                    :windowDark
                );


            glass.position.set(
                width/2+.2,
                wy,
                wz
            );

            group.add(
                glass
            );


            const glass2=
                glass.clone();

            glass2.position.x=
                -width/2-.2;

            group.add(
                glass2
            );
        }
    }


    /* =====================================================
       БАЛКОНЫ
    ===================================================== */

    if(
        style===0 ||
        style===2 ||
        style===4
    ){

        const balconyRows=
            Math.min(
                5,
                Math.floor(
                    height/7
                )
            );


        for(
            let r=1;
            r<balconyRows;
            r+=2
        ){

            const by=
                r*6.8;


            const slab=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        Math.min(
                            7,
                            width*.28
                        ),
                        .22,
                        2
                    ),
                    curbMaterial
                );

            slab.position.set(
                0,
                by,
                depth/2+1
            );

            slab.castShadow=true;

            group.add(
                slab
            );


            for(
                let k=-1;
                k<=1;
                k++
            ){

                const rail=
                    new THREE.Mesh(
                        new THREE.BoxGeometry(
                            .12,
                            1,
                            2
                        ),
                        roofMaterial
                    );

                rail.position.set(
                    k*
                    Math.min(
                        3,
                        width*.12
                    ),

                    by+.58,

                    depth/2+1.75
                );

                group.add(
                    rail
                );
            }


            const topRail=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        Math.min(
                            7,
                            width*.28
                        ),
                        .12,
                        .12
                    ),
                    roofMaterial
                );

            topRail.position.set(
                0,
                by+1.08,
                depth/2+1.75
            );

            group.add(
                topRail
            );
        }
    }


    /* =====================================================
       ВХОД
    ===================================================== */

    const doorMat=
        new THREE.MeshStandardMaterial({
            color:0x172125,
            roughness:.28,
            metalness:.25
        });


    const door=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                4.2,
                .22
            ),
            doorMat
        );

    door.position.set(
        0,
        2.1,
        depth/2+.34
    );

    group.add(
        door
    );


    /* козырёк */

    const canopy=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5.8,
                .24,
                2.3
            ),
            roofMaterial
        );

    canopy.position.set(
        0,
        4.35,
        depth/2+1.05
    );

    canopy.rotation.x=
        -.12;

    canopy.castShadow=true;

    group.add(
        canopy
    );


    /* =====================================================
       ВИТРИНЫ ПЕРВОГО ЭТАЖА
    ===================================================== */

    const shopCount=
        Math.max(
            2,
            Math.floor(
                width/11
            )
        );


    for(
        let i=0;

let characterModel=null;
let characterMixer=null;

let idleAction=null;
let walkAction=null;

let activeAction=null;


const characterLoader=
    new GLTFLoader();


characterLoader.load(

    "https://raw.githubusercontent.com/MMWilliams/char-kit/master/characters/mh_3183.glb",

    function(gltf){

        characterModel=
            gltf.scene;

        characterModel.scale.setScalar(
            1.8
        );


        characterModel.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow=true;
                    object.receiveShadow=true;

                    if(
                        object.material
                    ){

                        object.material.needsUpdate=true;

                        if(
                            "roughness"
                            in object.material
                        )
                            object.material.roughness=.78;

                        if(
                            "metalness"
                            in object.material
                        )
                            object.material.metalness=.02;
                    }
                }
            }
        );


        player.add(
            characterModel
        );


        characterMixer=
            new THREE.AnimationMixer(
                characterModel
            );


        function findAnimation(
            names
        ){

            for(
                const name of names
            ){

                const clip=
                    gltf.animations.find(
                        animation =>
                            animation.name
                            .toLowerCase()
                            ===
                            name.toLowerCase()
                    );

                if(
                    clip
                )
                    return clip;
            }

            return null;
        }


        const idleClip=
            findAnimation([
                "idle",
                "Idle"
            ]);


        const walkClip=
            findAnimation([
                "walk",
                "walking",
                "Walk",
                "Walking"
            ]);


        if(
            idleClip
        ){

            idleAction=
                characterMixer.clipAction(
                    idleClip
                );

            idleAction.play();

            activeAction=
                idleAction;
        }


        if(
            walkClip
        ){

            walkAction=
                characterMixer.clipAction(
                    walkClip
                );
        }

    }
);


/* =========================================================
   АНИМАЦИЯ
========================================================= */

function playAnimation(
    action
){

    if(
        !action ||
        activeAction===action
    )
        return;


    const previous=
        activeAction;

    activeAction=
        action;

    action.reset();

    action.play();


    if(
        previous
    ){

        action.crossFadeFrom(
            previous,
            .18,
            true
        );
    }
}


function updateCharacter(
    delta,
    moving
){

    if(
        !characterMixer
    )
        return;


    characterMixer.update(
        delta
    );


    if(
        moving &&
        walkAction
    ){

        playAnimation(
            walkAction
        );

    }else if(
        idleAction
    ){

        playAnimation(
            idleAction
        );
    }
}


/* =========================================================
   ДЖОЙСТИК
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


let joystickPointerId=null;

let joystickX=0;
let joystickY=0;

const joystickRadius=55;


function updateJoystick(
    event
){

    const rect=
        joystick.getBoundingClientRect();


    const centerX=
        rect.left+
        rect.width/2;

    const centerY=
        rect.top+
        rect.height/2;


    let dx=
        event.clientX-
        centerX;

    let dy=
        event.clientY-
        centerY;


    const length=
        Math.hypot(
            dx,
            dy
        );


    if(
        length>
        joystickRadius
    ){

        dx=
            dx/length*
            joystickRadius;

        dy=
            dy/length*
            joystickRadius;
    }


    joystickX=
        dx/
        joystickRadius;

    joystickY=
        dy/
        joystickRadius;


    stick.style.transform=
        "translate("+
        dx+
        "px,"+
        dy+
        "px)";
}


function resetJoystick(){

    joystickPointerId=
        null;

    joystickX=0;
    joystickY=0;

    stick.style.transform=
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystickPointerId=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;

        e.preventDefault();

        updateJoystick(e);
    },
    {
        passive:false
    }
);


joystick.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            joystickPointerId
        )
            resetJoystick();
    }
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


joystick.addEventListener(
    "lostpointercapture",
    resetJoystick
);

/* =========================================================
   КАМЕРА
========================================================= */

let yaw=0;

let pitch=.42;

let distance=7;


let cameraPointerId=null;

let cameraLastX=0;
let cameraLastY=0;


function isControlElement(
    target
){

    return(
        target===joystick ||
        joystick.contains(target) ||
        target===jumpButton ||
        jumpButton.contains(target)
    );
}


document.addEventListener(
    "pointerdown",
    function(e){

        if(
            isControlElement(
                e.target
            )
        )
            return;


        cameraPointerId=
            e.pointerId;

        cameraLastX=
            e.clientX;

        cameraLastY=
            e.clientY;

        e.preventDefault();
    },
    {
        passive:false,
        capture:true
    }
);


document.addEventListener(
    "pointermove",
    function(e){

        if(
            e.pointerId !==
            cameraPointerId
        )
            return;


        const dx=
            e.clientX-
            cameraLastX;

        const dy=
            e.clientY-
            cameraLastY;


        yaw-=
            dx*.008;

        pitch+=
            dy*.006;


        pitch=
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.05
            );


        cameraLastX=
            e.clientX;

        cameraLastY=
            e.clientY;

        e.preventDefault();
    },
    {
        passive:false,
        capture:true
    }
);


document.addEventListener(
    "pointerup",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        )
            cameraPointerId=null;
    },
    {
        capture:true
    }
);


document.addEventListener(
    "pointercancel",
    function(e){

        if(
            e.pointerId===
            cameraPointerId
        )
            cameraPointerId=null;
    },
    {
        capture:true
    }
);


window.addEventListener(
    "blur",
    function(){

        cameraPointerId=null;

        resetJoystick();
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            joystickY=-1;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            joystickY=1;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            joystickX=-1;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            joystickX=1;


        if(
            e.code==="Space"
        )
            jump();
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key==="w" ||
            e.key==="ArrowUp" ||
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            joystickY=0;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft" ||
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            joystickX=0;
    }
);


/* =========================================================
   ИГРА
========================================================= */

const clock=
    new THREE.Clock();


function update(){

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    /* =====================================================
       ДВИЖЕНИЕ

       ВАЖНО:
       X специально инвертирован.
       Это исправляет диагональные направления
       на текущей версии джойстика.
    ===================================================== */

    let forward=
        -joystickY;

    let side=
        -joystickX;


    const length=
        Math.hypot(
            forward,
            side
        );


    const moving=
        length>.08;


    if(
        moving
    ){

        forward/=length;
        side/=length;


        const speed=
            22*delta;


        const sin=
            Math.sin(
                yaw
            );

        const cos=
            Math.cos(
                yaw
            );


        const moveX=
            sin*forward+
            cos*side;


        const moveZ=
            cos*forward-
            sin*side;


        player.position.x+=
            moveX*speed;

        player.position.z+=
            moveZ*speed;


        player.rotation.y=
            Math.atan2(
                moveX,
                moveZ
            );
    }


    /* =====================================================
       ПРЫЖОК
    ===================================================== */

    if(
        isJumping
    ){

        verticalVelocity-=
            22*delta;

        player.position.y+=
            verticalVelocity*
            delta;


        if(
            player.position.y<=0
        ){

            player.position.y=0;

            verticalVelocity=0;

            isJumping=false;
        }
    }


    updateCharacter(
        delta,
        moving
    );


    /* =====================================================
       КАМЕРА
    ===================================================== */

    const horizontal=
        Math.cos(pitch)*
        distance;

    const vertical=
        Math.sin(pitch)*
        distance;


    const target=
        new THREE.Vector3(
            player.position.x,
            2.4+
            player.position.y,
            player.position.z
        );


    const wanted=
        new THREE.Vector3(

            player.position.x-
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z-
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();

        camera.aspect=

        camera.updateProjectionMatrix();
