<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101820;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    background:#101820;
    font-size:25px;
    letter-spacing:2px;
}

#loading small{
    margin-top:12px;
    opacity:.6;
    font-size:12px;
    letter-spacing:0;
}

#portrait{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background:#101820;
    font-size:20px;
}

#hud{
    position:fixed;
    left:15px;
    top:12px;
    z-index:20;
    color:white;
    font-size:13px;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

#joystick{
    position:fixed;
    left:max(18px,env(safe-area-inset-left));
    bottom:max(18px,env(safe-area-inset-bottom));
    width:140px;
    height:140px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.09);
    z-index:30;
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    left:37px;
    top:37px;
    border-radius:50%;
    background:rgba(255,255,255,.32);
    border:2px solid rgba(255,255,255,.55);
}

.button{
    position:fixed;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:white;
    font-weight:bold;
    background:rgba(20,25,30,.65);
    border:1px solid rgba(255,255,255,.3);
    user-select:none;
}

#jump{
    right:max(22px,env(safe-area-inset-right));
    bottom:max(22px,env(safe-area-inset-bottom));
    width:76px;
    height:76px;
}

#run{
    right:max(115px,calc(env(safe-area-inset-right) + 115px));
    bottom:max(30px,env(safe-area-inset-bottom));
    width:58px;
    height:58px;
    font-size:11px;
}

#run.active{
    background:rgba(40,130,70,.75);
}

@media(orientation:portrait){

    #portrait{
        display:flex;
    }

    #game,
    #hud,
    #joystick,
    #jump,
    #run{
        display:none;
    }
}

@media(max-width:700px) and (orientation:landscape){

    #joystick{
        width:128px;
        height:128px;
    }

    #stick{
        width:58px;
        height:58px;
        left:33px;
        top:33px;
    }

    #jump{
        width:68px;
        height:68px;
    }

    #run{
        right:102px;
        width:54px;
        height:54px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    АЧИНСК 3D
    <small>Запуск города...</small>
</div>

<div id="portrait">
    Поверни телефон горизонтально<br><br>
    ↻
</div>

<div id="hud">
    АЧИНСК 3D
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="run" class="button">
    БЕГ
</div>

<div id="jump" class="button">
    ПРЫЖОК
</div>


<script>
"use strict";


/* =========================================================
   CANVAS
========================================================= */

const game =
    document.getElementById("game");

const canvas =
    document.createElement("canvas");

game.appendChild(canvas);

const ctx =
    canvas.getContext("2d");


if(!ctx){

    document.getElementById("loading").innerHTML =
        "ОШИБКА<br><small>Canvas не поддерживается</small>";

    throw new Error("Canvas unavailable");
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(
            innerWidth*dpr
        );

    canvas.height =
        Math.floor(
            innerHeight*dpr
        );

    canvas.style.width =
        innerWidth+"px";

    canvas.style.height =
        innerHeight+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);

window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(resize,200);
    }
);


/* =========================================================
   3D МАТЕМАТИКА
========================================================= */

function rotatePoint(
    x,
    y,
    z,
    yaw,
    pitch
){

    const cy =
        Math.cos(yaw);

    const sy =
        Math.sin(yaw);

    let x1 =
        x*cy -
        z*sy;

    let z1 =
        x*sy +
        z*cy;

    const cp =
        Math.cos(pitch);

    const sp =
        Math.sin(pitch);

    let y1 =
        y*cp -
        z1*sp;

    let z2 =
        y*sp +
        z1*cp;

    return {
        x:x1,
        y:y1,
        z:z2
    };
}


function project(
    x,
    y,
    z
){

    const camera =
        rotatePoint(
            x-player.x,
            y-player.y-cameraHeight,
            z-player.z,
            -cameraYaw,
            -cameraPitch
        );

    if(camera.z <= .2)
        return null;

    const scale =
        focal /
        camera.z;

    return {
        x:
            screenW/2 +
            camera.x*scale,

        y:
            screenH/2 -
            camera.y*scale,

        z:camera.z,

        scale:scale
    };
}


/* =========================================================
   НАСТРОЙКИ
========================================================= */

let screenW =
    innerWidth;

let screenH =
    innerHeight;

let focal =
    620;

let cameraYaw =
    0;

let cameraPitch =
    .32;

let cameraHeight =
    5.5;


/* =========================================================
   ИГРОК
========================================================= */

const player = {

    x:0,
    y:0,
    z:55,

    yaw:0,

    velocityY:0,

    grounded:true

};


/* =========================================================
   ОБЪЕКТЫ
========================================================= */

const objects=[];


function addBox(
    x,
    y,
    z,
    w,
    h,
    d,
    color,
    type="building"
){

    objects.push({

        x,
        y,
        z,

        w,
        h,
        d,

        color,

        type

    });
}


/* =========================================================
   ГОРОД
========================================================= */

function createCity(){

    /* земля */

    addBox(
        0,
        -1,
        0,
        1100,
        2,
        1100,
        "#405044",
        "ground"
    );


    /* дороги */

    addBox(
        0,
        .01,
        0,
        1100,
        .15,
        30,
        "#272b2e",
        "road"
    );

    addBox(
        0,
        .02,
        0,
        30,
        .16,
        1100,
        "#272b2e",
        "road"
    );


    const roads=[
        -180,
        -90,
        90,
        180
    ];


    for(
        const p of roads
    ){

        addBox(
            0,
            .02,
            p,
            900,
            .15,
            22,
            "#292d30",
            "road"
        );

        addBox(
            p,
            .02,
            0,
            22,
            .15,
            900,
            "#292d30",
            "road"
        );
    }


    /* тротуары */

    for(
        const p of [
            -180,
            -90,
            0,
            90,
            180
        ]
    ){

        addBox(
            0,
            .12,
            p-17,
            900,
            .2,
            3,
            "#85837d",
            "sidewalk"
        );

        addBox(
            0,
            .12,
            p+17,
            900,
            .2,
            3,
            "#85837d",
            "sidewalk"
        );

        addBox(
            p-17,
            .12,
            0,
            3,
            .2,
            900,
            "#85837d",
            "sidewalk"
        );

        addBox(
            p+17,
            .12,
            0,
            3,
            .2,
            900,
            "#85837d",
            "sidewalk"
        );
    }


    /* здания */

    const colors=[
        "#807970",
        "#9b948a",
        "#6f7477",
        "#a69a8b",
        "#73777a",
        "#918a82"
    ];


    const blocks=[
        [-130,-130],
        [130,-130],
        [-130,130],
        [130,130],

        [-300,-130],
        [300,-130],
        [-300,130],
        [300,130],

        [-130,-300],
        [130,-300],
        [-130,300],
        [130,300],

        [-300,-300],
        [300,-300],
        [-300,300],
        [300,300]
    ];


    blocks.forEach(
        (b,i)=>{

            addBox(
                b[0]-20,
                9,
                b[1],
                35,
                18,
                42,
                colors[i%colors.length],
                "building"
            );


            addBox(
                b[0]+25,
                12,
                b[1]+12,
                32,
                24,
                35,
                colors[(i+2)%colors.length],
                "building"
            );


            addBox(
                b[0],
                7,
                b[1]+47,
                46,
                14,
                26,
                colors[(i+3)%colors.length],
                "building"
            );
        }
    );


    /* деревья */

    for(
        let i=-480;
        i<=480;
        i+=32
    ){

        if(
            Math.abs(i)<55
        )
            continue;


        addTree(
            i,
            25
        );

        addTree(
            i,
            -25
        );

        addTree(
            25,
            i
        );

        addTree(
            -25,
            i
        );
    }


    /* машины */

    for(
        let i=0;
        i<24;
        i++
    ){

        const p =
            -430 +
            (i*73)%860;

        if(i%2===0){

            addCar(
                p,
                7,
                0
            );

        }else{

            addCar(
                7,
                p,
                Math.PI/2
            );
        }
    }
}


function addTree(
    x,
    z
){

    addBox(
        x,
        3,
        z,
        1,
        6,
        1,
        "#513a28",
        "treeTrunk"
    );

    addBox(
        x,
        7,
        z,
        5,
        5,
        5,
        "#285331",
        "tree"
    );
}


function addCar(
    x,
    z,
    rotation
){

    objects.push({

        x,
        y:1,
        z,

        w:3.8,
        h:1.5,
        d:7,

        color:
            ["#8d3531",
             "#345675",
             "#73777a",
             "#b3b0a5"]
            [
                Math.floor(
                    Math.random()*4
                )
            ],

        type:"car",

        rotation
    });
}


createCity();


/* =========================================================
   ДОРОЖНАЯ РАЗМЕТКА
========================================================= */

const markings=[];


for(
    let i=-500;
    i<=500;
    i+=35
){

    markings.push({
        x:i,
        y:.12,
        z:0,
        w:14,
        d:.3
    });

    markings.push({
        x:0,
        y:.13,
        z:i,
        w:.3,
        d:14
    });
}


/* =========================================================
   РЕНДЕР КУБА
========================================================= */

function cubeCorners(o){

    const x=o.x;
    const y=o.y;
    const z=o.z;

    const w=o.w/2;
    const h=o.h/2;
    const d=o.d/2;

    return [

        [x-w,y-h,z-d],
        [x+w,y-h,z-d],
        [x+w,y+h,z-d],
        [x-w,y+h,z-d],

        [x-w,y-h,z+d],
        [x+w,y-h,z+d],
        [x+w,y+h,z+d],
        [x-w,y+h,z+d]

    ];
}


const faces=[
    [0,1,2,3],
    [5,4,7,6],
    [4,0,3,7],
    [1,5,6,2],
    [3,2,6,7],
    [4,5,1,0]
];


function shadeColor(
    color,
    amount
){

    let c =
        color.replace("#","");

    let r =
        parseInt(
            c.substring(0,2),
            16
        );

    let g =
        parseInt(
            c.substring(2,4),
            16
        );

    let b =
        parseInt(
            c.substring(4,6),
            16
        );


    r=Math.max(
        0,
        Math.min(
            255,
            r*amount
        )
    );

    g=Math.max(
        0,
        Math.min(
            255,
            g*amount
        )
    );

    b=Math.max(
        0,
        Math.min(
            255,
            b*amount
        )
    );


    return `rgb(
        ${r|0},
        ${g|0},
        ${b|0}
    )`;
}


function drawObject(
    o
){

    const corners =
        cubeCorners(o);

    const pts =
        corners.map(
            p=>project(
                p[0],
                p[1],
                p[2]
            )
        );


    if(
        pts.some(
            p=>p===null
        )
    )
        return;


    const faceData=[];


    faces.forEach(
        (f,index)=>{

            const p0=pts[f[0]];
            const p1=pts[f[1]];
            const p2=pts[f[2]];


            const depth =
                (
                    p0.z+
                    p1.z+
                    p2.z+
                    pts[f[3]].z
                )/4;


            faceData.push({
                f,
                depth,
                shade:
                    [
                        .65,
                        .78,
                        .55,
                        .72,
                        1.0,
                        .58
                    ][index]
            });
        }
    );


    faceData.sort(
        (a,b)=>
            b.depth-a.depth
    );


    for(
        const face
        of faceData
    ){

        const f=
            face.f;


        ctx.beginPath();

        ctx.moveTo(
            pts[f[0]].x,
            pts[f[0]].y
        );


        for(
            let i=1;
            i<f.length;
            i++
        ){

            ctx.lineTo(
                pts[f[i]].x,
                pts[f[i]].y
            );
        }


        ctx.closePath();

        ctx.fillStyle =
            shadeColor(
                o.color,
                face.shade
            );

        ctx.fill();


        ctx.strokeStyle =
            "rgba(0,0,0,.12)";

        ctx.lineWidth=1;

        ctx.stroke();
    }


    /* окна */

    if(
        o.type==="building" &&
        o.h>8
    ){

        drawWindows(o);
    }


    /* деревья */

    if(
        o.type==="tree"
    ){

        drawTreeDetail(o);
    }


    /* машина */

    if(
        o.type==="car"
    ){

        drawCarDetail(o);
    }
}


/* =========================================================
   ОКНА
========================================================= */

function drawWindows(o){

    const floors =
        Math.floor(
            o.h/4
        );

    const cols =
        Math.max(
            2,
            Math.floor(
                o.w/4
            )
        );


    for(
        let floor=0;
        floor<floors;
        floor++
    ){

        for(
            let col=0;
            col<cols;
            col++
        ){

            if(
                (floor+col)%7===0
            )
                continue;


            const x =
                o.x-
                o.w/2+
                2+
                col*4;


            const y =
                floor*4+
                2.2;


            const p =
                project(
                    x,
                    y,
                    o.z-o.d/2-.06
                );


            if(!p)
                continue;


            const size =
                Math.max(
                    2,
                    10/p.z*100
                );


            ctx.fillStyle =
                (floor+col)%3===0
                ? "#273b46"
                : "#7695a3";


            ctx.fillRect(
                p.x-size/2,
                p.y-size/2,
                size,
                size
            );
        }
    }
}


/* =========================================================
   ДЕРЕВО ДЕТАЛИ
========================================================= */

function drawTreeDetail(o){

    const p =
        project(
            o.x,
            o.y+2,
            o.z
        );

    if(!p)
        return;


    const r =
        Math.max(
            3,
            5/p.z*180
        );


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#315f38";

    ctx.fill();
}


/* =========================================================
   МАШИНА ДЕТАЛЬ
========================================================= */

function drawCarDetail(o){

    const p =
        project(
            o.x,
            o.y+1,
            o.z
        );

    if(!p)
        return;


    const s =
        Math.max(
            3,
            12/p.z*100
        );


    ctx.fillStyle=
        "#20272c";


    ctx.fillRect(
        p.x-s*.55,
        p.y-s*.35,
        s*1.1,
        s*.25
    );
}


/* =========================================================
   РАЗМЕТКА
========================================================= */

function drawMarkings(){

    for(
        const m
        of markings
    ){

        const p =
            project(
                m.x,
                m.y,
                m.z
            );

        if(!p)
            continue;


        const p2 =
            project(
                m.x+m.w,
                m.y,
                m.z+m.d
            );

        if(!p2)
            continue;


        ctx.fillStyle=
            "rgba(235,232,210,.8)";


        ctx.fillRect(
            p.x,
            p.y,
            Math.max(
                2,
                Math.abs(
                    p2.x-p.x
                )
            ),
            Math.max(
                1,
                Math.abs(
                    p2.y-p.y
                )
            )
        );
    }
}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

function drawPlayer(){

    const base =
        project(
            player.x,
            player.y,
            player.z
        );

    if(!base)
        return;


    const scale =
        230/base.z;


    const h =
        4.8*scale;


    /* тень */

    ctx.beginPath();

    ctx.ellipse(
        base.x,
        base.y,
        16*scale,
        7*scale,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,0,0,.35)";

    ctx.fill();


    /* ноги */

    ctx.fillStyle=
        "#20242b";


    ctx.fillRect(
        base.x-11*scale,
        base.y-h*.42,
        9*scale,
        h*.43
    );


    ctx.fillRect(
        base.x+2*scale,
        base.y-h*.42,
        9*scale,
        h*.43
    );


    /* корпус */

    ctx.fillStyle=
        "#303943";


    ctx.fillRect(
        base.x-17*scale,
        base.y-h*.80,
        34*scale,
        h*.42
    );


    /* руки */

    ctx.fillStyle=
        "#303943";


    ctx.fillRect(
        base.x-25*scale,
        base.y-h*.77,
        7*scale,
        28*scale
    );


    ctx.fillRect(
        base.x+18*scale,
        base.y-h*.77,
        7*scale,
        28*scale
    );


    /* голова */

    ctx.beginPath();

    ctx.arc(
        base.x,
        base.y-h*.92,
        12*scale,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#c58e70";

    ctx.fill();


    /* волосы */

    ctx.beginPath();

    ctx.arc(
        base.x,
        base.y-h*1.0,
        12*scale,
        Math.PI,
        Math.PI*2
    );

    ctx.fillStyle=
        "#202020";

    ctx.fill();
}


/* =========================================================
   СОРТИРОВКА
========================================================= */

function render(){

    screenW=
        innerWidth;

    screenH=
        innerHeight;


    ctx.clearRect(
        0,
        0,
        screenW,
        screenH
    );


    /* небо */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            screenH
        );


    gradient.addColorStop(
        0,
        "#687b89"
    );

    gradient.addColorStop(
        .55,
        "#9ba7ab"
    );

    gradient.addColorStop(
        1,
        "#59665f"
    );


    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        screenW,
        screenH
    );


    /* дальний туман */

    const sorted =
        objects
        .map(
            o=>{

                const dx=
                    o.x-player.x;

                const dz=
                    o.z-player.z;

                return {
                    object:o,
                    depth:
                        dx*dx+
                        dz*dz
                };
            }
        )
        .sort(
            (a,b)=>
                b.depth-a.depth
        );


    drawMarkings();


    for(
        const item
        of sorted
    ){

        drawObject(
            item.object
        );
    }


    drawPlayer();


    /* виньетка */

    const vignette =
        ctx.createRadialGradient(
            screenW/2,
            screenH/2,
            screenH*.15,
            screenW/2,
            screenH/2,
            screenH*.8
        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.35)"
    );


    ctx.fillStyle=
        vignette;

    ctx.fillRect(
        0,
        0,
        screenW,
        screenH
    );
}


/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */

let joystickX=0;
let joystickY=0;

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


function updateJoystick(
    x,
    y
){

    const r=
        joystick.getBoundingClientRect();


    const cx=
        r.left+
        r.width/2;


    const cy=
        r.top+
        r.height/2;


    let dx=
        x-cx;

    let dy=
        y-cy;


    const max=
        r.width*.34;


    const length=
        Math.hypot(
            dx,
            dy
        );


    if(length>max){

        dx=
            dx/length*
            max;

        dy=
            dy/length*
            max;
    }


    joystickX=
        dx/max;

    joystickY=
        dy/max;


    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

    joystickX=0;
    joystickY=0;

    stick.style.transform=
        "translate(0,0)";
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(e.buttons)
            updateJoystick(
                e.clientX,
                e.clientY
            );
    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   БЕГ
========================================================= */

let running=false;

const runButton=
    document.getElementById(
        "run"
    );


runButton.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        running=true;

        runButton.classList.add(
            "active"
        );
    }
);


function stopRun(){

    running=false;

    runButton.classList.remove(
        "active"
    );
}


runButton.addEventListener(
    "pointerup",
    stopRun
);

runButton.addEventListener(
    "pointercancel",
    stopRun
);


/* =========================================================
   ПРЫЖОК
========================================================= */

document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(
            player.grounded
        ){

            player.velocityY=
                12;

            player.grounded=
                false;
        }
    }
);


/* =========================================================
   КАМЕРА
========================================================= */

let cameraTouch=false;

let lastX=0;
let lastY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        cameraTouch=true;

        lastX=e.clientX;
        lastY=e.clientY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!cameraTouch)
            return;


        const dx=
            e.clientX-lastX;

        const dy=
            e.clientY-lastY;


        lastX=e.clientX;
        lastY=e.clientY;


        cameraYaw-=
            dx*.006;


        cameraPitch-=
            dy*.004;


        cameraPitch=
            Math.max(
                .12,
                Math.min(
                    .8,
                    cameraPitch
                )
            );
    }
);


canvas.addEventListener(
    "pointerup",
    ()=>{
        cameraTouch=false;
    }
);


canvas.addEventListener(
    "pointercancel",
    ()=>{
        cameraTouch=false;
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="ShiftLeft"
        )
            running=true;


        if(
            e.code==="Space" &&
            player.grounded
        ){

            player.velocityY=
                12;

            player.grounded=
                false;
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[e.code]=false;

        if(
            e.code==="ShiftLeft"
        )
            running=false;
    }
);


/* =========================================================
   ФИЗИКА
========================================================= */

let previous=
    performance.now();


function update(){

    const now=
        performance.now();


    const dt=
        Math.min(
            (now-previous)/1000,
            .05
        );


    previous=now;


    let x=
        joystickX;

    let y=
        -joystickY;


    if(
        keys.KeyA ||
        keys.ArrowLeft
    )
        x=-1;


    if(
        keys.KeyD ||
        keys.ArrowRight
    )
        x=1;


    if(
        keys.KeyW ||
        keys.ArrowUp
    )
        y=1;


    if(
        keys.KeyS ||
        keys.ArrowDown
    )
        y=-1;


    const len=
        Math.hypot(
            x,
            y
        );


    if(len>1){

        x/=len;
        y/=len;
    }


    /* движение относительно камеры */

    const sin=
        Math.sin(
            cameraYaw
        );

    const cos=
        Math.cos(
            cameraYaw
        );


    const forwardX=
        sin;

    const forwardZ=
        -cos;


    const rightX=
        cos;

    const rightZ=
        sin;


    const moveX=
        forwardX*y+
        rightX*x;


    const moveZ=
        forwardZ*y+
        rightZ*x;


    const speed=
        running
        ? 22
        : 13;


    player.x+=
        moveX*
        speed*
        dt;


    player.z+=
        moveZ*
        speed*
        dt;


    if(
        len>.05
    ){

        player.yaw=
            Math.atan2(
                moveX,
                moveZ
            );
    }


    /* границы */

    player.x=
        Math.max(
            -520,
            Math.min(
                520,
                player.x
            )
        );


    player.z=
        Math.max(
            -520,
            Math.min(
                520,
                player.z
            )
        );


    /* прыжок */

    player.velocityY-=
        32*dt;


    player.y+=
        player.velocityY*
        dt;


    if(
        player.y<=0
    ){

        player.y=0;

        player.velocityY=0;

        player.grounded=
            true;
    }
}


/* =========================================================
   ЗАПУСК
========================================================= */

setTimeout(
    ()=>{
        document
        .getElementById(
            "loading"
        )
        .style.display=
            "none";
    },
    700
);


function loop(){

    update();

    render();

    requestAnimationFrame(
        loop
    );
}


loop();

</script>
