<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8dbbd6;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    color:#fff;
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,.75);
}

#subtitle{
    position:absolute;
    top:45px;
    left:max(15px,env(safe-area-inset-left));
    color:#fff;
    font-size:12px;
    text-shadow:0 2px 5px rgba(0,0,0,.7);
}

#controls{
    position:absolute;
    left:max(18px,env(safe-area-inset-left));
    bottom:max(18px,env(safe-area-inset-bottom));
    width:190px;
    height:150px;
}

.button{
    position:absolute;
    width:60px;
    height:60px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    color:#fff;
    font-size:25px;
    font-weight:bold;

    background:rgba(12,18,25,.78);

    border:1px solid rgba(255,255,255,.3);

    box-shadow:
        0 5px 18px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.12);

    pointer-events:auto;
    user-select:none;
}

.button:active{
    transform:scale(.92);
    background:rgba(38,62,78,.9);
}

#forward{
    left:65px;
    top:0;
}

#back{
    left:65px;
    bottom:0;
}

#left{
    left:0;
    top:45px;
}

#right{
    right:0;
    top:45px;
}

#camera{
    position:absolute;

    right:max(20px,env(safe-area-inset-right));
    bottom:max(20px,env(safe-area-inset-bottom));

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(0,0,0,.10);

    border:1px solid rgba(255,255,255,.22);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:rgba(255,255,255,.65);

    font-size:11px;

    pointer-events:auto;

    user-select:none;
}

#orientation{
    position:absolute;
    right:15px;
    top:15px;

    padding:7px 10px;

    border-radius:10px;

    color:#fff;

    font-size:11px;

    background:rgba(0,0,0,.3);
}

@media(orientation:portrait){

    #orientation{
        background:rgba(100,65,0,.7);
    }

    #orientation::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe08a;
    }
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">АЧИНСК</div>

    <div id="subtitle">
        3D • городская версия
    </div>

    <div id="orientation">
        LANDSCAPE
    </div>

    <div id="controls">

        <div class="button" id="forward">▲</div>

        <div class="button" id="left">◀</div>

        <div class="button" id="right">▶</div>

        <div class="button" id="back">▼</div>

    </div>

    <div id="camera">
        СВАЙП<br>КАМЕРОЙ
    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   СЦЕНА
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8dbbd6);

scene.fog =
    new THREE.Fog(
        0x8dbbd6,
        140,
        720
    );


/* =====================================================
   КАМЕРА
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        62,
        innerWidth / innerHeight,
        0.1,
        1400
    );


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   СВЕТ
===================================================== */

const hemisphere =
    new THREE.HemisphereLight(
        0xd9efff,
        0x344d32,
        2.1
    );

scene.add(
    hemisphere
);


const sun =
    new THREE.DirectionalLight(
        0xfff4dc,
        3.2
    );

sun.position.set(
    140,
    220,
    110
);

sun.castShadow =
    true;

sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;

sun.shadow.camera.left =
    -350;

sun.shadow.camera.right =
    350;

sun.shadow.camera.top =
    350;

sun.shadow.camera.bottom =
    -350;

sun.shadow.bias =
    -0.0004;

scene.add(
    sun
);


/* =====================================================
   ЗЕМЛЯ
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            2200,
            2200
        ),

        new THREE.MeshStandardMaterial({
            color:0x527848,
            roughness:.95
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow =
    true;

scene.add(
    ground
);


/* =====================================================
   МАТЕРИАЛЫ
===================================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x303336,
        roughness:.92
    });

const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8b8e8d,
        roughness:.9
    });

const curbMaterial =
    new THREE.MeshStandardMaterial({
        color:0xb2b1a8,
        roughness:.8
    });

const whiteMaterial =
    new THREE.MeshStandardMaterial({
        color:0xf2eee0,
        roughness:.7
    });


/* =====================================================
   ДОРОГА
===================================================== */

function createRoad(
    width,
    length,
    x,
    z,
    rotation=0
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .12,
                length
            ),

            roadMaterial
        );

    road.position.set(
        x,
        .06,
        z
    );

    road.rotation.y =
        rotation;

    road.receiveShadow =
        true;

    scene.add(
        road
    );


    /* тротуары */

    const sideOffset =
        width/2 + 4;


    for(
        const side of [-1,1]
    ){

        const sidewalk =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    7,
                    .22,
                    length
                ),

                sidewalkMaterial
            );

        sidewalk.position.set(
            x +
            Math.cos(rotation) *
            sideOffset *
            side,

            .13,

            z +
            Math.sin(rotation) *
            sideOffset *
            side
        );

        sidewalk.rotation.y =
            rotation;

        sidewalk.receiveShadow =
            true;

        scene.add(
            sidewalk
        );


        const curb =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .55,
                    .35,
                    length
                ),

                curbMaterial
            );

        curb.position.set(
            x +
            Math.cos(rotation) *
            (width/2 + .3) *
            side,

            .18,

            z +
            Math.sin(rotation) *
            (width/2 + .3) *
            side
        );

        curb.rotation.y =
            rotation;

        scene.add(
            curb
        );
    }
}


/* главные улицы */

createRoad(
    42,
    1400,
    0,
    0
);

createRoad(
    42,
    1400,
    0,
    0,
    Math.PI/2
);


/* боковые улицы */

createRoad(
    25,
    1050,
    -190,
    0
);

createRoad(
    25,
    1050,
    190,
    0
);

createRoad(
    25,
    1050,
    0,
    -190,
    Math.PI/2
);

createRoad(
    25,
    1050,
    0,
    190,
    Math.PI/2
);


/* =====================================================
   РАЗМЕТКА
===================================================== */

function createLaneMarks(){

    for(
        let i=-650;
        i<650;
        i+=18
    ){

        const mark =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .28,
                    .14,
                    8
                ),

                whiteMaterial
            );

        mark.position.set(
            0,
            .14,
            i
        );

        scene.add(
            mark
        );
    }


    for(
        let i=-650;
        i<650;
        i+=18
    ){

        const mark =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    8,
                    .14,
                    .28
                ),

                whiteMaterial
            );

        mark.position.set(
            i,
            .14,
            0
        );

        scene.add(
            mark
        );
    }
}

createLaneMarks();


/* =====================================================
   ЗДАНИЯ
===================================================== */

const buildingColors=[
    0xb8a98e,
    0xc6c8c4,
    0xaeb5b5,
    0xc39c7d,
    0xb3aea3,
    0x9ea7aa
];


function createWindow(
    x,
    y,
    z,
    rotation
){

    const windowMesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.6,
                3.4,
                .12
            ),

            new THREE.MeshStandardMaterial({
                color:0x263e50,
                roughness:.35,
                metalness:.15
            })
        );

    windowMesh.position.set(
        x,
        y,
        z
    );

    windowMesh.rotation.y =
        rotation;

    scene.add(
        windowMesh
    );
}


function createBuilding(
    x,
    z
){

    const width =
        45 +
        Math.random()*28;

    const depth =
        42 +
        Math.random()*25;

    const height =
        18 +
        Math.random()*42;


    const material =
        new THREE.MeshStandardMaterial({
            color:
                buildingColors[
                    Math.floor(
                        Math.random()*
                        buildingColors.length
                    )
                ],
            roughness:.82
        });


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow =
        true;

    building.receiveShadow =
        true;

    scene.add(
        building
    );


    /* крыша */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+1.5,
                .7,
                depth+1.5
            ),

            new THREE.MeshStandardMaterial({
                color:0x55585a,
                roughness:.9
            })
        );

    roof.position.set(
        x,
        height+.35,
        z
    );

    roof.castShadow =
        true;

    scene.add(
        roof
    );


    /* окна на передней стороне */

    const columns =
        Math.max(
            2,
            Math.floor(
                width/9
            )
        );

    const rows =
        Math.max(
            2,
            Math.floor(
                height/8
            )
        );


    for(
        let col=0;
        col<columns;
        col++
    ){

        for(
            let row=0;
            row<rows;
            row++
        ){

            if(
                Math.random()<.12
            )
                continue;


            const wx =
                x -
                width/2 +
                5 +
                col *
                ((width-10)/
                Math.max(1,columns-1));


            const wy =
                6 +
                row*7;


            if(wy>height-4)
                continue;


            createWindow(
                wx,
                wy,
                z-depth/2-.08,
                0
            );
        }
    }
}


/* кварталы */

for(
    let x=-480;
    x<=480;
    x+=90
){

    for(
        let z=-480;
        z<=480;
        z+=90
    ){

        if(
            Math.abs(x)<65 ||
            Math.abs(z)<65
        )
            continue;


        createBuilding(

            x+
            (Math.random()-.5)*15,

            z+
            (Math.random()-.5)*15

        );
    }
}


/* =====================================================
   ДЕРЕВЬЯ
===================================================== */

function createTree(
    x,
    z,
    scale=1
){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .65*scale,
                .9*scale,
                6*scale,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x654329
            })
        );

    trunk.position.set(
        x,
        3*scale,
        z
    );

    trunk.castShadow=true;

    scene.add(
        trunk
    );


    const crown =
        new THREE.Mesh(

            new THREE.IcosahedronGeometry(
                4.7*scale,
                1
            ),

            new THREE.MeshStandardMaterial({
                color:0x2d6a3c,
                roughness:.9
            })
        );

    crown.position.set(
        x,
        8*scale,
        z
    );

    crown.castShadow=true;

    scene.add(
        crown
    );
}


for(
    let i=0;
    i<130;
    i++
){

    const x =
        (Math.random()-.5)*1100;

    const z =
        (Math.random()-.5)*1100;


    if(
        Math.abs(x)<55 &&
        Math.abs(z)<55
    )
        continue;


    createTree(
        x,
        z,
        .8+
        Math.random()*.5
    );
}


/* =====================================================
   ФОНАРИ
===================================================== */

function createLamp(
    x,
    z
){

    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .12,
                .16,
                7,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x34383a,
                metalness:.7,
                roughness:.4
            })
        );

    pole.position.set(
        x,
        3.5,
        z
    );

    pole.castShadow=true;

    scene.add(
        pole
    );


    const arm =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.2,
                .12,
                .12
            ),

            pole.material
        );

    arm.position.set(
        x+1,
        7,
        z
    );

    scene.add(
        arm
    );


    const lamp =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .28,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0xffe6a0,
                emissive:0xffb52e,
                emissiveIntensity:1.5
            })
        );

    lamp.position.set(
        x+2,
        6.8,
        z
    );

    scene.add(
        lamp
    );
}


for(
    let z=-600;
    z<=600;
    z+=55
){

    createLamp(
        -27,
        z
    );

    createLamp(
        27,
        z
    );
}


/* =====================================================
   ПЕРСОНАЖ — НОВАЯ 3D МОДЕЛЬ
===================================================== */

const player = new THREE.Group();
scene.add(player);


/* =====================================================
   МАТЕРИАЛЫ ПЕРСОНАЖА
===================================================== */

const skinMaterial =
    new THREE.MeshStandardMaterial({
        color:0xc98262,
        roughness:.72,
        metalness:0
    });

const skinLightMaterial =
    new THREE.MeshStandardMaterial({
        color:0xd89472,
        roughness:.7,
        metalness:0
    });

const hairMaterial =
    new THREE.MeshStandardMaterial({
        color:0x171311,
        roughness:.88
    });

const shirtMaterial =
    new THREE.MeshStandardMaterial({
        color:0x202936,
        roughness:.82
    });

const jacketMaterial =
    new THREE.MeshStandardMaterial({
        color:0x303d4c,
        roughness:.76
    });

const pantsMaterial =
    new THREE.MeshStandardMaterial({
        color:0x161b22,
        roughness:.9
    });

const shoeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x111315,
        roughness:.62,
        metalness:.08
    });

const eyeWhiteMaterial =
    new THREE.MeshStandardMaterial({
        color:0xf2eee8,
        roughness:.5
    });

const eyeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x16110d,
        roughness:.35
    });

const mouthMaterial =
    new THREE.MeshStandardMaterial({
        color:0x55251f,
        roughness:.8
    });


/* =====================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
===================================================== */

function addMesh(
    geometry,
    material,
    position,
    scale=null
){

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        position.x,
        position.y,
        position.z
    );

    if(scale){
        mesh.scale.set(
            scale.x,
            scale.y,
            scale.z
        );
    }

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    player.add(mesh);

    return mesh;
}


/* =====================================================
   ТАЗ
===================================================== */

const pelvis =
    addMesh(

        new THREE.CapsuleGeometry(
            .43,
            .42,
            8,
            16
        ),

        pantsMaterial,

        {
            x:0,
            y:1.42,
            z:0
        },

        {
            x:1.15,
            y:.9,
            z:.82
        }
    );


/* =====================================================
   ТУЛОВИЩЕ
===================================================== */

const torso =
    addMesh(

        new THREE.CapsuleGeometry(
            .55,
            .95,
            10,
            20
        ),

        jacketMaterial,

        {
            x:0,
            y:2.18,
            z:0
        },

        {
            x:1.02,
            y:1,
            z:.66
        }
    );


/* грудь */

const chest =
    addMesh(

        new THREE.SphereGeometry(
            1,
            20,
            16
        ),

        shirtMaterial,

        {
            x:0,
            y:2.28,

        },

        {
            x:.53,
            y:.56,
            z:.34
        }
    );


/* =====================================================
   ШЕЯ
===================================================== */

const neck =
    addMesh(

            .19,

            .38,
            16
        ),

        skinMaterial,

        {
            x:0,

            z:0
        }
    );


/* =====================================================
   ГОЛОВА
===================================================== */

const headGroup =
    new THREE.Group();

headGroup.position.set(
    0,
    3.48,
    0
);

player.add(

);


/* основа головы */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .5,

    );

head.scale.set(
    .91,

    .88

head.receiveShadow=true;

headGroup.add(

/* =====================================================
   УШИ
===================================================== */

function createEar(x){

    ear.position.set(

createEar(-.46);
createEar(.46);


/* =====================================================
   ВОЛОСЫ
===================================================== */

const hairTop =
    new THREE.Mesh(

        new THREE.SphereGeometry(

    .17;

);

/* боковые волосы */

for(

){

        new THREE.Mesh(

            ),

        );

        .03,
        .02
    );

    sideHair.castShadow=true;

    );

/* =====================================================
   БРОВИ
===================================================== */

function createBrow(x){

    const brow =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .22,
                .055,
                .055
            ),

            hairMaterial
        );

    brow.position.set(
        x,

createBrow(-.17);
createBrow(.17);


/* =====================================================
   ГЛАЗА
===================================================== */

function createEye(x){

    const eyeGroup =
        new THREE.Group();

    eyeGroup.position.set(
        x,
        .0,
        -.425
    );

    headGroup.add(
        eyeGroup
    );


    const white =

            new THREE.SphereGeometry(

    );

        pupil

}

createEye(-.17);
createEye(.17);

   НОС
===================================================== */

const nose =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .075,
            .22,
            5,

        ),

        skinLightMaterial
    );

nose.position.set(
    0,
    -.04,
    -.46
);

nose.rotation.x =

nose.castShadow=true;

headGroup.add(

/* =====================================================
   АНИМАЦИЯ ЧАСТЕЙ
===================================================== */

function animateCharacter(
    time,
    moving
){

    if(moving){

        const swing =
            Math.sin(time)*.55;

        const opposite =
            Math.sin(time+Math.PI)*.55;


        /* ноги */

        leftLeg.hip.rotation.x =
            swing;

        rightLeg.hip.rotation.x =
            opposite;


        leftLeg.knee.rotation.x =
            Math.max(
                0,
                -swing
            )*.55;

        rightLeg.knee.rotation.x =
            Math.max(
                0,
                -opposite
            )*.55;


        /* руки */

        leftArm.upper.rotation.x =
            opposite*.72;

        rightArm.upper.rotation.x =
            swing*.72;


        leftArm.elbow.rotation.x =
            Math.max(
                0,
                swing
            )*.35;

        rightArm.elbow.rotation.x =
            Math.max(
                0,
                opposite
            )*.35;

    }else{

        leftLeg.hip.rotation.x *= .82;
        rightLeg.hip.rotation.x *= .82;

        leftLeg.knee.rotation.x *= .82;
        rightLeg.knee.rotation.x *= .82;

        leftArm.upper.rotation.x *= .82;
        rightArm.upper.rotation.x *= .82;

        leftArm.elbow.rotation.x *= .82;
        rightArm.elbow.rotation.x *= .82;
    }
}


/* =====================================================
   УПРАВЛЕНИЕ
===================================================== */

const controls = {

    forward:false,
    back:false,
    left:false,
    right:false

};


function bindButton(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            controls[key]=true;
        }
    );


    const release=()=>{

        controls[key]=false;
    };


    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}


bindButton(
    "forward",
    "forward"
);

bindButton(
    "back",
    "back"
);

bindButton(
    "left",
    "left"
);

bindButton(
    "right",
    "right"
);


/* =====================================================
   КЛАВИАТУРА
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            controls.forward=true;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            controls.back=true;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            controls.left=true;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            controls.right=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        )
            controls.forward=false;


        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        )
            controls.back=false;


        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        )
            controls.left=false;


        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        )
            controls.right=false;
    }
);


/* =====================================================
   КАМЕРА
===================================================== */

let yaw=0;

let pitch=.42;

let distance=10;


const cameraZone =
    document.getElementById(
        "camera"
    );


let dragging=false;

let lastX=0;

let lastY=0;


cameraZone.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

        cameraZone.setPointerCapture(
            e.pointerId
        );
    }
);


cameraZone.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;


        yaw -=
            dx*.008;


        pitch +=
            dy*.006;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                .14,
                1.05
            );


        lastX=e.clientX;
        lastY=e.clientY;
    }
);


cameraZone.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


cameraZone.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =====================================================
   АНИМАЦИЯ
===================================================== */

const clock =
    new THREE.Clock();


let walkTime=0;


function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    let forward =
        (controls.forward?1:0) -
        (controls.back?1:0);


    let side =
        (controls.left?1:0) -
        (controls.right?1:0);


    const length =
        Math.hypot(
            forward,
            side
        );


    if(length>0){

        forward/=length;
        side/=length;


        const speed =
            22*delta;


        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);


        const moveX =
            sin*forward +
            cos*side;


        const moveZ =
            cos*forward -
            sin*side;


        player.position.x +=
            moveX*speed;

        player.position.z +=
            moveZ*speed;


        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );


        walkTime +=
            delta*10;


        /* ходьба */

animateCharacter(
    walkTime,
    true
);
    }else{

    animateCharacter(
        walkTime,
        false
    );
}


    /* камера */

    const horizontal =
        Math.cos(pitch)*
        distance;


    const vertical =
        Math.sin(pitch)*
        distance;


    const target =
        new THREE.Vector3(
            player.position.x,
            2.15,
            player.position.z
        );


    const wanted =
        new THREE.Vector3(

            player.position.x -
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z -
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .12
    );


    camera.lookAt(
        target
    );
}


/* =====================================================
   ЗАПУСК
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
