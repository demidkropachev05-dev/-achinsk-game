<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ачинск 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b5d1;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#title{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    color:white;
    font-size:22px;
    font-weight:900;
    text-shadow:0 2px 5px #000;
}

#subtitle{
    position:absolute;
    top:43px;
    left:max(15px,env(safe-area-inset-left));
    color:white;
    font-size:12px;
    text-shadow:0 2px 5px #000;
}

#controls{
    position:absolute;
    left:max(18px,env(safe-area-inset-left));
    bottom:max(18px,env(safe-area-inset-bottom));
    width:190px;
    height:150px;
    pointer-events:none;
}

.button{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:25px;
    font-weight:bold;
    background:rgba(15,20,28,.78);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    pointer-events:auto;
    user-select:none;
}

.button:active{
    transform:scale(.92);
}

#forward{
    left:65px;
    top:0;
}

#back{
    left:65px;
    bottom:0;
}

#left{
    left:0;
    top:45px;
}

#right{
    right:0;
    top:45px;
}

#camera{
    position:absolute;
    right:max(20px,env(safe-area-inset-right));
    bottom:max(20px,env(safe-area-inset-bottom));
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(0,0,0,.12);
    border:1px solid rgba(255,255,255,.2);
    color:rgba(255,255,255,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    pointer-events:auto;
}

#rotate{
    position:absolute;
    right:15px;
    top:15px;
    color:white;
    font-size:11px;
    padding:7px 10px;
    border-radius:10px;
    background:rgba(0,0,0,.35);
}

@media(orientation:portrait){
    #rotate::after{
        content:" • ПОВЕРНИТЕ ТЕЛЕФОН";
        color:#ffe08a;
    }
}
</style>
</head>

<body>

<div id="ui">

<div id="title">АЧИНСК</div>

<div id="subtitle">
3D • первая версия города
</div>

<div id="rotate">
LANDSCAPE
</div>

<div id="controls">

<div class="button" id="forward">▲</div>
<div class="button" id="left">◀</div>
<div class="button" id="right">▶</div>
<div class="button" id="back">▼</div>

</div>

<div id="camera">
СВАЙП<br>КАМЕРОЙ
</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ==============================
   СЦЕНА
============================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87b5d1);

scene.fog =
    new THREE.Fog(
        0x87b5d1,
        100,
        650
    );


/* ==============================
   КАМЕРА
============================== */

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        1200
    );


/* ==============================
   РЕНДЕР
============================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* ==============================
   СВЕТ
============================== */

const ambient =
    new THREE.HemisphereLight(
        0xc8e5ff,
        0x405a35,
        2.2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    120,
    180,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -300;
sun.shadow.camera.right = 300;
sun.shadow.camera.top = 300;
sun.shadow.camera.bottom = -300;

scene.add(sun);


/* ==============================
   ЗЕМЛЯ
============================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            2000,
            2000
        ),

        new THREE.MeshStandardMaterial({
            color:0x527b48
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* ==============================
   ДОРОГИ
============================== */

function road(
    width,
    length,
    x,
    z,
    rotation=0
){

    const r =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .08,
                length
            ),

            new THREE.MeshStandardMaterial({
                color:0x303335
            })
        );

    r.position.set(
        x,
        .04,
        z
    );

    r.rotation.y =
        rotation;

    r.receiveShadow = true;

    scene.add(r);
}


/* центральные улицы */

road(
    42,
    1300,
    0,
    0
);

road(
    42,
    1300,
    0,
    0,
    Math.PI/2
);


/* дополнительные улицы */

road(
    25,
    1000,
    -190,
    0
);

road(
    25,
    1000,
    190,
    0
);

road(
    25,
    1000,
    0,
    -190,
    Math.PI/2
);

road(
    25,
    1000,
    0,
    190,
    Math.PI/2
);


/* ==============================
   ЗДАНИЯ
============================== */

const colors = [
    0xb9a98f,
    0xc5c8c7,
    0xaeb7ba,
    0xc6a17f,
    0xb6b0a4
];


function building(
    x,
    z
){

    const width =
        48 +
        Math.random()*28;

    const depth =
        42 +
        Math.random()*30;

    const height =
        16 +
        Math.random()*45;


    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({
                color:
                    colors[
                        Math.floor(
                            Math.random()*
                            colors.length
                        )
                    ]
            })
        );


    mesh.position.set(
        x,
        height/2,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);


    /* крыша */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width+1,
                .7,
                depth+1
            ),

            new THREE.MeshStandardMaterial({
                color:0x4a4e50
            })
        );


    roof.position.set(
        x,
        height+.35,
        z
    );

    roof.castShadow = true;

    scene.add(roof);
}


/* создаём кварталы */

for(
    let x=-480;
    x<=480;
    x+=90
){

    for(
        let z=-480;
        z<=480;
        z+=90
    ){

        if(
            Math.abs(x)<65 ||
            Math.abs(z)<65
        )
            continue;

        building(
            x+(Math.random()-.5)*18,
            z+(Math.random()-.5)*18
        );
    }
}


/* ==============================
   ДЕРЕВЬЯ
============================== */

function tree(x,z){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .6,
                .9,
                6,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x664329
            })
        );

    trunk.position.set(
        x,
        3,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);


    const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                4.5,
                12,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x28623b
            })
        );

    crown.position.set(
        x,
        8,
        z
    );

    crown.castShadow=true;

    scene.add(crown);
}


for(
    let i=0;
    i<120;
    i++
){

    const x =
        (Math.random()-.5)*1100;

    const z =
        (Math.random()-.5)*1100;

    if(
        Math.abs(x)<55 &&
        Math.abs(z)<55
    )
        continue;

    tree(x,z);
}


/* ==============================
   ПЕРСОНАЖ
============================== */

const player =
    new THREE.Group();

scene.add(player);


/* тело */

const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .7,
            1.7,
            5,
            12
        ),

        new THREE.MeshStandardMaterial({
            color:0x24547d
        })
    );

body.position.y=1.7;

body.castShadow=true;

player.add(body);


/* голова */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .55,
            18,
            18
        ),

        new THREE.MeshStandardMaterial({
            color:0xe0ad85
        })
    );

head.position.y=3.15;

head.castShadow=true;

player.add(head);


/* волосы */

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .57,
            18,
            9,
            0,
            Math.PI*2,
            0,
            Math.PI/2
        ),

        new THREE.MeshStandardMaterial({
            color:0x211c19
        })
    );

hair.position.y=3.42;

player.add(hair);


/* ==============================
   УПРАВЛЕНИЕ
============================== */

const controls = {
    forward:false,
    back:false,
    left:false,
    right:false
};


function bind(
    id,
    name
){

    const element =
        document.getElementById(id);

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            controls[name]=true;
        }
    );

    const release=()=>{
        controls[name]=false;
    };

    element.addEventListener(
        "pointerup",
        release
    );

    element.addEventListener(
        "pointercancel",
        release
    );

    element.addEventListener(
        "pointerleave",
        release
    );
}


bind(
    "forward",
    "forward"
);

bind(
    "back",
    "back"
);

bind(
    "left",
    "left"
);

bind(
    "right",
    "right"
);


/* ==============================
   КАМЕРА
============================== */

let yaw=0;

let pitch=.4;

let distance=10;


const cameraZone =
    document.getElementById(
        "camera"
    );


let dragging=false;

let lastX=0;

let lastY=0;


cameraZone.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        dragging=true;

        lastX=e.clientX;

        lastY=e.clientY;

        cameraZone.setPointerCapture(
            e.pointerId
        );
    }
);


cameraZone.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;

        yaw -=
            dx*.008;

        pitch +=
            dy*.006;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                .12,
                1.1
            );

        lastX=e.clientX;

        lastY=e.clientY;
    }
);


cameraZone.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

cameraZone.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* ==============================
   ДВИЖЕНИЕ
============================== */

const clock =
    new THREE.Clock();


function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    let forward =
        (controls.forward?1:0) -
        (controls.back?1:0);

    let side =
    (controls.left?1:0) -
    (controls.right?1:0);


    const len =
        Math.hypot(
            forward,
            side
        );


    if(len>0){

        forward/=len;
        side/=len;


        const speed =
            22*delta;


        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);


        const moveX =
            sin*forward +
            cos*side;


        const moveZ =
            cos*forward -
            sin*side;


        player.position.x +=
            moveX*speed;

        player.position.z +=
            moveZ*speed;


        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );
    }


    /* ==========================
       КАМЕРА
    ========================== */

    const horizontal =
        Math.cos(pitch)*
        distance;

    const vertical =
        Math.sin(pitch)*
        distance;


    const target =
        new THREE.Vector3(
            player.position.x,
            2.2,
            player.position.z
        );


    const wanted =
        new THREE.Vector3(

            player.position.x -
            Math.sin(yaw)*
            horizontal,

            player.position.y+
            vertical,

            player.position.z -
            Math.cos(yaw)*
            horizontal
        );


    camera.position.lerp(
        wanted,
        .12
    );


    camera.lookAt(
        target
    );
}


/* ==============================
   ЗАПУСК
============================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


animate();


/* ==============================
   RESIZE
============================== */

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
